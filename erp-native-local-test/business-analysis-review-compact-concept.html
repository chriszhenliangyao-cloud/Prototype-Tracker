<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>经营分析复盘紧凑化方案示例</title>
  <style>
    :root{--bg:#f4f7fb;--surface:#fff;--subtle:#f8fafc;--muted:#edf2f8;--line:#d7e1ee;--strong:#bdcbe0;--text:#182237;--dim:#66758e;--faint:#8b98aa;--blue:#2762e9;--blue2:#edf3ff;--green:#11835b;--green2:#edf9f4;--amber:#b96805;--amber2:#fff7e9;--red:#d72d42;--red2:#fff1f3;--sidebar:184px}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:12px;letter-spacing:0}button,select,input,textarea{font:inherit;color:inherit}.app{height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
    aside{display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line)}.brand{height:56px;padding:10px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}.logo{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;background:#182237;color:#fff;font-weight:800}.brand b,.brand small{display:block}.brand small{margin-top:2px;color:var(--dim);font-size:9px}.nav{padding:7px 8px}.group{padding:8px 8px 3px;color:var(--faint);font-size:9px}.nav button{width:100%;height:27px;padding:0 8px;border:0;border-left:2px solid transparent;border-radius:5px;background:transparent;text-align:left;color:#526178}.nav button.active{border-left-color:var(--blue);background:var(--blue2);color:var(--blue);font-weight:750}.nav .red{float:right;color:var(--red)}.foot{margin-top:auto;padding:9px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:9px}.dot{display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--green)}
    main{min-width:0;display:grid;grid-template-rows:48px 27px minmax(0,1fr)}.top{display:flex;align-items:center;gap:9px;padding:0 15px;border-bottom:1px solid var(--line);background:#fff}.top b{font-size:11px}.top span{color:var(--dim);font-size:9px}.grow{flex:1}.chip{height:25px;display:flex;align-items:center;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--dim);font-size:9px}.env{display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #d5e2f4;background:#f6f9ff;color:var(--dim);font-size:9px}.env b{color:var(--blue)}
    .content{overflow:auto;padding:10px 14px}.page{max-width:1510px;margin:0 auto;display:grid;gap:8px}.control-shell{border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden}.control-main{min-height:58px;display:flex;align-items:center;gap:9px;padding:8px 10px}.title{min-width:210px}.title small,.title strong{display:block}.title small{color:var(--faint);font-size:8px;font-weight:800;letter-spacing:.8px}.title strong{margin-top:2px;font-size:19px}.compact-field{display:grid;gap:2px}.compact-field span{color:var(--dim);font-size:8px;font-weight:700}.compact-field select{width:125px;height:29px;padding:0 7px;border:1px solid var(--strong);border-radius:5px;background:#fff}.compact-field.period select{width:112px}.compact-field.market select{width:145px}.source-button,.icon-btn,.freeze{height:29px;padding:0 9px;border:1px solid var(--line);border-radius:5px;background:var(--subtle);font-weight:700;font-size:9px}.source-button{color:var(--green)}.icon-btn{background:#fff;color:#43536c}.freeze{border-color:#9ebaf8;background:var(--blue2);color:var(--blue)}
    .tabs{height:38px;display:flex;align-items:stretch;gap:24px;padding:0 11px;border-top:1px solid var(--line);background:var(--subtle);overflow:hidden}.tab{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--dim);font-weight:750;white-space:nowrap}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
    .summary{height:46px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden}.summary>div{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;border-right:1px solid var(--line)}.summary>div:last-child{border-right:0}.summary span{color:var(--dim);font-size:9px}.summary strong{font-size:14px}.bad{color:var(--red)}.warn{color:var(--amber)}.good{color:var(--green)}
    .panel{min-width:0;border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden}.ph{height:38px;display:flex;align-items:center;padding:0 11px;border-bottom:1px solid var(--line)}.ph h2{margin:0;font-size:13px}.ph span{margin-left:auto;color:var(--dim);font-size:9px}.bridge{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:9px}.step{position:relative;min-height:82px;padding:9px;border:1px solid var(--line);border-right:0;background:var(--subtle)}.step:first-child{border-radius:6px 0 0 6px}.step:last-child{border-right:1px solid var(--line);border-radius:0 6px 6px 0}.step.cost{background:var(--red2)}.step.profit{background:var(--green2)}.step small,.step strong,.step em{display:block}.step small{color:var(--dim);font-size:8px}.step strong{margin-top:5px;font-size:16px}.step em{margin-top:3px;color:var(--dim);font-size:8px;font-style:normal}.step i{position:absolute;left:9px;right:9px;bottom:7px;height:3px;border-radius:3px;background:var(--blue)}.step.cost i{background:var(--red)}.step.profit i{background:var(--green)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{height:39px;padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;font-size:9px}th:last-child,td:last-child{border-right:0}tbody tr:last-child td{border-bottom:0}th{background:var(--muted);color:var(--dim);font-weight:750}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.money-link{border:0;background:transparent;color:var(--blue);font-weight:750;text-decoration:underline;text-decoration-color:#aac0f6;text-underline-offset:2px;cursor:pointer}.ratio{margin-left:3px;color:var(--dim);font-size:8px}.pill{display:inline-flex;align-items:center;min-height:20px;padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--subtle);font-size:8px;font-weight:750}.pill.green{border-color:#bae3d1;background:var(--green2);color:var(--green)}.pill.amber{border-color:#efd09d;background:var(--amber2);color:var(--amber)}.pill.red{border-color:#f0b6bf;background:var(--red2);color:var(--red)}
    .insights{display:grid}.insight{display:grid;grid-template-columns:7px minmax(0,1fr) auto;gap:7px;padding:9px 10px;border-bottom:1px solid var(--line)}.insight:last-child{border-bottom:0}.insight>i{width:6px;height:6px;margin-top:4px;border-radius:50%;background:var(--amber)}.insight.red>i{background:var(--red)}.insight b,.insight small{display:block}.insight small{margin-top:3px;color:var(--dim);font-size:8px;line-height:1.35}.insight strong{font-size:9px}
    .action-head{height:48px;display:flex;align-items:center;gap:18px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:#fff}.action-head b{font-size:13px}.action-head span{color:var(--dim)}.action-head strong{margin-left:4px}.action-layout{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px}.compact-list{display:grid}.compact-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:52px;padding:7px 10px;border-bottom:1px solid var(--line)}.compact-row:last-child{border-bottom:0}.index{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--dim);font-size:8px}.compact-row b,.compact-row small{display:block}.compact-row b{font-size:10px}.compact-row small{margin-top:3px;color:var(--dim);font-size:8px}.view-btn,.edit-btn{height:25px;padding:0 8px;border:1px solid var(--strong);border-radius:5px;background:#fff;font-weight:700;font-size:8px}.edit-btn{color:var(--blue);border-color:#aac0f6;background:var(--blue2)}
    .scrim{position:fixed;inset:0 0 0 var(--sidebar);z-index:5;background:rgba(24,34,55,.18)}.drawer{position:fixed;top:0;right:0;bottom:0;z-index:6;width:410px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(24,34,55,.13)}.drawer-head{display:flex;align-items:center;padding:14px;border-bottom:1px solid var(--line)}.drawer-head b{font-size:15px}.drawer-head button{margin-left:auto;width:29px;height:29px;border:1px solid var(--line);border-radius:5px;background:#fff}.drawer-body{overflow:auto;padding:12px;display:grid;align-content:start;gap:10px}.drawer-context{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--subtle)}.drawer-context span,.field span{display:block;color:var(--dim);font-size:8px}.drawer-context b{display:block;margin-top:3px;font-size:10px}.field{display:grid;gap:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--strong);border-radius:5px;background:#fff;padding:7px}.field textarea{height:76px;resize:none}.drawer-foot{display:flex;justify-content:flex-end;gap:7px;padding:10px 12px;border-top:1px solid var(--line)}.btn{height:30px;padding:0 11px;border:1px solid var(--strong);border-radius:5px;background:#fff;font-weight:700}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}
  </style>
</head>
<body>
  <div class="app">
    <aside><div class="brand"><div class="logo">OP</div><div><b>运营协同平台</b><small>欧洲业务运营</small></div></div><div class="nav">
      <button>我的工作台</button><div class="group">计划与交付</div><button>产品路线图</button><button>项目跟进 <span class="red">34</span></button><button>产销管理</button><button>预测管理</button><button>物流交付</button>
      <div class="group">市场增长</div><button>新品上市</button><button>营销活动</button><button>营销物料</button><div class="group">协同中心</div><button>月度促销审批</button><button>其他审批</button><button>我的待办 <span class="red">4</span></button><button>异常中心 <span class="red">12</span></button>
      <div class="group">经营管理</div><button>经营总览</button><button>BP达成</button><button class="active">经营分析复盘</button><button>价值链测算</button><button>结算台账</button><div class="group">专业与管理</div><button>职能工作台</button><button>系统管理</button>
    </div><div class="foot"><span class="dot"></span>界面优化方案 · 不写入业务数据</div></aside>
    <main><header class="top"><b>经营管理 / 经营分析复盘</b><span>冻结数据的分析、结论与行动</span><div class="grow"></div><div class="chip"><span class="dot"></span>本地快照 · 15张表</div><div class="chip">中文⌄</div><div class="chip">payton.ppc · 平台所有者</div></header><div class="env"><div><b>紧凑模式</b> 流程条已取消；顶部控制与来源状态合并</div><div>正式复盘版本 2026-Q2-v3</div></div><div class="content"><div class="page" id="page"></div></div></main>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const view = params.get("view") || "profit";
    const detail = params.get("detail") === "1";
    const tabs = ["复盘总览","收入与利润","预测与交付","项目与市场","结论与行动","历史复盘"];
    const header = `<section class="control-shell"><div class="control-main"><div class="title"><small>BUSINESS ANALYSIS REVIEW</small><strong>经营分析复盘</strong></div><label class="compact-field period"><span>周期</span><select><option>季度复盘</option></select></label><label class="compact-field period"><span>期间</span><select><option>2026 Q2</option></select></label><label class="compact-field market"><span>市场</span><select><option>全部可见市场</option></select></label><label class="compact-field"><span>对比</span><select><option>上一周期</option></select></label><div class="grow"></div><button class="source-button">● 来源 4/4</button><button class="icon-btn">会议</button><button class="icon-btn">历史</button><button class="freeze">已冻结 · v3</button></div><nav class="tabs">${tabs.map(t=>`<button class="tab ${((view==='profit'&&t==='收入与利润')||(view==='action'&&t==='结论与行动'))?'active':''}">${t}</button>`).join('')}</nav></section>`;
    const profit = `<section class="panel"><header class="ph"><h2>2026 Q2 利润桥</h2><span>冻结口径 · EUR</span></header><div class="bridge"><div class="step"><small>收入</small><strong>€527.0K</strong><em>BP达成 47.5% · 16个PO</em><i></i></div><div class="step cost"><small>− BOM</small><strong>€288.4K</strong><em>占收入 54.7%</em><i></i></div><div class="step cost"><small>− 物流费用</small><strong>€77.3K</strong><em>占收入 14.7% · 3个PO待补</em><i></i></div><div class="step profit"><small>= 毛利润</small><strong>€161.2K</strong><em>毛利率 30.6%</em><i></i></div><div class="step cost"><small>− Credit Note</small><strong>€31.7K</strong><em>占收入 6.0%</em><i></i></div><div class="step profit"><small>= 净利润</small><strong>€129.5K</strong><em>净利率 24.6%</em><i></i></div></div></section><div class="layout"><section class="panel"><header class="ph"><h2>市场收入、利润与费用</h2><span>费用金额可点击穿透明细</span></header><div class="table-wrap"><table><thead><tr><th style="width:7%">市场</th><th class="num">收入</th><th class="num">BP达成</th><th class="num">GP率</th><th class="num">物流费用（占比）</th><th class="num">Credit Note（占比）</th><th class="num">费用合计（占比）</th><th class="num">NP率</th><th style="width:10%">复盘状态</th></tr></thead><tbody><tr><td><b>FR</b></td><td class="num">€218.5K</td><td class="num">44.2%</td><td class="num">35.3%</td><td class="num"><button class="money-link">€26.2K</button><span class="ratio">(12.0%)</span></td><td class="num"><button class="money-link">€6.4K</button><span class="ratio">(2.9%)</span></td><td class="num">€32.6K <span class="ratio">(14.9%)</span></td><td class="num">31.0%</td><td><span class="pill green">已确认</span></td></tr><tr><td><b>ES</b></td><td class="num">€193.2K</td><td class="num bad">31.4%</td><td class="num">23.9%</td><td class="num"><button class="money-link">€45.9K</button><span class="ratio bad">(23.8%)</span></td><td class="num"><button class="money-link">€17.3K</button><span class="ratio bad">(9.0%)</span></td><td class="num">€63.2K <span class="ratio bad">(32.7%)</span></td><td class="num bad">14.9%</td><td><span class="pill red">需行动</span></td></tr><tr><td><b>PL</b></td><td class="num">€114.9K</td><td class="num">--</td><td class="num">32.9%</td><td class="num"><button class="money-link">€5.2K</button><span class="ratio">(4.5%)</span></td><td class="num"><button class="money-link">€3.4K</button><span class="ratio">(3.0%)</span></td><td class="num">€8.6K <span class="ratio">(7.5%)</span></td><td class="num">28.6%</td><td><span class="pill green">已确认</span></td></tr><tr><td><b>NL</b></td><td class="num">€0.4K</td><td class="num">--</td><td class="num">59.8%</td><td class="num"><button class="money-link">€0.0K</button><span class="ratio">(4.0%)</span></td><td class="num"><button class="money-link">€0.0K</button><span class="ratio">(1.2%)</span></td><td class="num">€0.0K <span class="ratio">(5.2%)</span></td><td class="num">25.2%</td><td><span class="pill green">已确认</span></td></tr><tr><td><b>未分配</b></td><td class="num">--</td><td class="num">--</td><td class="num">--</td><td class="num">--</td><td class="num"><button class="money-link">€4.6K</button></td><td class="num">€4.6K</td><td class="num">--</td><td><span class="pill amber">待匹配</span></td></tr></tbody></table></div></section><section class="panel"><header class="ph"><h2>费用与利润异常</h2><span>3项</span></header><div class="insights"><div class="insight red"><i></i><div><b>ES费用率32.7%</b><small>物流费与Price Protection共同拉低NP率。</small></div><strong class="bad">需归因</strong></div><div class="insight"><i></i><div><b>3个PO缺物流费用</b><small>正式复盘前补齐或明确暂估口径。</small></div><strong class="warn">补数据</strong></div><div class="insight"><i></i><div><b>€4.6K CN未匹配SKU</b><small>总额已计入，产品归因待完善。</small></div><strong class="warn">待匹配</strong></div></div></section></div>`;
    const action = `<section class="action-head"><b>结论与行动</b><span>本期只保留决策摘要，原因、证据与协同记录进入明细</span><div class="grow"></div><span>结论<strong>4</strong></span><span>行动<strong>5</strong></span><span class="warn">待确认<strong>2</strong></span><button class="btn primary">+ 新增行动</button></section><div class="action-layout"><section class="panel"><header class="ph"><h2>本期结论</h2><span>按影响优先级排序</span></header><div class="compact-list"><div class="compact-row"><span class="index">1</span><div><b>ES收入与利润缺口需要专项修复</b><small>影响：收入、物流费用、Credit Note · Owner María</small></div><button class="view-btn">查看</button></div><div class="compact-row"><span class="index">2</span><div><b>Q3预测应下调高偏差SKU</b><small>影响：预测准确率、供应计划 · Owner GTM</small></div><button class="view-btn">查看</button></div><div class="compact-row"><span class="index">3</span><div><b>PX51上市延期但首批供应不变</b><small>影响：上市节奏、营销物料 · Owner Ivy</small></div><button class="view-btn">查看</button></div><div class="compact-row"><span class="index">4</span><div><b>物流费用缺失需在归档前补齐</b><small>影响：净利润口径 · Owner Owen</small></div><button class="view-btn">查看</button></div></div></section><section class="panel"><header class="ph"><h2>行动清单</h2><span>点击查看或编辑明细</span></header><table><thead><tr><th>行动</th><th>来源</th><th>负责人</th><th>DDL</th><th>状态</th><th style="width:11%">操作</th></tr></thead><tbody><tr><td><b>拆解ES收入与利润缺口</b></td><td>经营分析复盘</td><td>María</td><td>7月12日</td><td><span class="pill amber">进行中</span></td><td><button class="edit-btn">编辑</button></td></tr><tr><td><b>核对ES Credit Note归属</b></td><td>结算台账</td><td>Finance</td><td>7月10日</td><td><span class="pill red">待确认</span></td><td><button class="edit-btn">编辑</button></td></tr><tr><td><b>补录缺失PO物流费用</b></td><td>物流交付</td><td>Owen</td><td>7月11日</td><td><span class="pill amber">待处理</span></td><td><button class="edit-btn">编辑</button></td></tr><tr><td><b>重提ES Q3渠道预测</b></td><td>预测管理</td><td>María</td><td>7月15日</td><td><span class="pill amber">进行中</span></td><td><button class="edit-btn">编辑</button></td></tr><tr><td><b>更新PX51上市时间线</b></td><td>项目跟进</td><td>Ivy</td><td>已完成</td><td><span class="pill green">已完成</span></td><td><button class="view-btn">查看</button></td></tr></tbody></table></section></div>`;
    const drawer = `<div class="scrim"></div><aside class="drawer"><div class="drawer-head"><b>编辑行动明细</b><button>×</button></div><div class="drawer-body"><div class="drawer-context"><div><span>复盘期间</span><b>2026 Q2 · v3</b></div><div><span>来源模块</span><b>结算台账</b></div></div><label class="field"><span>行动标题</span><input value="核对ES Credit Note归属"></label><label class="field"><span>负责人</span><select><option>Finance</option></select></label><label class="field"><span>DDL</span><input value="2026/07/10"></label><label class="field"><span>状态</span><select><option>待确认</option></select></label><label class="field"><span>结论 / 原因</span><textarea>ES市场存在未匹配SKU的Credit Note，需要确认责任渠道与产品归属。</textarea></label><label class="field"><span>证据与后续安排</span><textarea>关联CN明细表；确认后同步结算台账并重新冻结调整版本。</textarea></label></div><div class="drawer-foot"><button class="btn">取消</button><button class="btn primary">保存更新</button></div></aside>`;
    document.getElementById("page").innerHTML = header + (view === "action" ? action : profit);
    if (view === "action" && detail) document.body.insertAdjacentHTML("beforeend", drawer);
  </script>
</body>
</html>
