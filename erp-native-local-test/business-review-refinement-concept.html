<html lang="zh-CN">
<head>

  <style>

    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:12px;letter-spacing:0}button,select{font:inherit}.app{height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
    aside{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{height:60px;padding:11px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}.logo{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;background:#182237;color:#fff;font-weight:800}.brand b,.brand small{display:block}.brand small{margin-top:2px;color:var(--dim);font-size:9px}.nav{padding:7px 8px}.group{padding:10px 8px 4px;color:var(--faint);font-size:9px}.nav button{width:100%;height:29px;padding:0 8px;border:0;border-left:2px solid transparent;border-radius:5px;background:transparent;text-align:left;color:#526178}.nav button.active{border-left-color:var(--blue);background:var(--blue2);color:var(--blue);font-weight:750}.nav button .red{float:right;color:var(--red)}.foot{margin-top:auto;padding:10px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:9px}.dot{display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--green)}

    .content{overflow:auto;padding:10px 16px 8px}.page{max-width:1500px;margin:0 auto;display:grid;gap:8px}.head{display:flex;align-items:flex-end;gap:11px}.title small,.title strong{display:block}.title small{color:var(--faint);font-size:9px;font-weight:750;letter-spacing:.8px}.title strong{font-size:22px;margin-top:2px}.sub{color:var(--dim);font-size:9px}.actions{margin-left:auto;display:flex;gap:7px}.btn{height:30px;padding:0 10px;border:1px solid var(--strong);border-radius:6px;background:#fff;color:#35445c;font-weight:700}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}
    .filters{display:grid;grid-template-columns:145px 160px 160px 160px minmax(260px,1fr);gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}.field{display:grid;gap:3px}.field span{font-size:9px;color:var(--dim);font-weight:700}.field select{height:30px;border:1px solid var(--strong);border-radius:5px;padding:0 8px;background:#fff;color:var(--text)}.sources{display:flex;align-items:flex-end;gap:5px;flex-wrap:wrap}.source{height:29px;display:flex;align-items:center;gap:5px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface2);color:var(--dim);font-size:9px}.source i{width:6px;height:6px;border-radius:50%;background:var(--green)}
    .tabs{height:40px;display:flex;gap:22px;align-items:stretch;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:#fff}.tab{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--dim);font-weight:750}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
    .panel{min-width:0;border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden}.ph{min-height:41px;display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line)}.ph h2{margin:0;font-size:13px}.ph span{margin-left:auto;color:var(--dim);font-size:9px}.bridge{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:11px}.step{position:relative;min-height:94px;padding:10px;border:1px solid var(--line);border-right:0;background:var(--surface2)}.step:first-child{border-radius:6px 0 0 6px}.step:last-child{border-right:1px solid var(--line);border-radius:0 6px 6px 0}.step.cost{background:var(--red2)}.step.profit{background:var(--green2)}.step small,.step strong,.step em,.step span{display:block}.step small{color:var(--dim);font-size:9px}.step strong{margin-top:7px;font-size:17px}.step em{margin-top:4px;color:var(--dim);font-size:9px;font-style:normal}.step span{position:absolute;left:9px;right:9px;bottom:8px;height:4px;border-radius:3px;background:var(--blue)}.step.cost span{background:var(--red)}.step.profit span{background:var(--green)}
    .grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.75fr);gap:9px}.grid.equal{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}.metric{padding:10px 11px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric small,.metric strong,.metric em{display:block}.metric small{color:var(--dim);font-size:9px}.metric strong{margin-top:4px;font-size:16px}.metric em{margin-top:2px;color:var(--dim);font-size:8px;font-style:normal}
    table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{height:39px;padding:7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;font-size:9px}th:last-child,td:last-child{border-right:0}tbody tr:last-child td{border-bottom:0}th{background:var(--surface3);color:var(--dim);font-weight:750}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.pill{display:inline-flex;align-items:center;min-height:20px;padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface2);font-size:8px;font-weight:750}.pill.green{border-color:#bae3d1;background:var(--green2);color:var(--green)}.pill.amber{border-color:#efd09d;background:var(--amber2);color:var(--amber)}.pill.red{border-color:#f0b6bf;background:var(--red2);color:var(--red)}
    .bars{display:grid;gap:10px;padding:11px}.bar{display:grid;grid-template-columns:115px minmax(0,1fr) 66px;gap:9px;align-items:center}.bar label{font-size:9px;font-weight:700}.track{height:8px;border-radius:5px;background:var(--surface3);overflow:hidden}.track i{display:block;height:100%;border-radius:5px;background:var(--blue)}.bar.cost .track i{background:var(--red)}.bar.cn .track i{background:var(--amber)}.bar strong{text-align:right;font-size:9px}.issues{display:grid}.issue{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 11px;border-bottom:1px solid var(--line)}.issue:last-child{border-bottom:0}.issue>i{width:6px;height:6px;margin-top:4px;border-radius:50%;background:var(--amber)}.issue.red>i{background:var(--red)}.issue b,.issue small{display:block}.issue small{margin-top:3px;color:var(--dim);font-size:8px;line-height:1.35}.issue strong{font-size:9px}.lineage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}.lineage button{min-height:58px;padding:9px 11px;border:0;border-right:1px solid var(--line);background:#fff;text-align:left}.lineage button:last-child{border-right:0}.lineage b,.lineage small{display:block}.lineage b{color:var(--blue);font-size:9px}.lineage small{margin-top:4px;color:var(--dim);font-size:8px}.lineage button:hover{background:var(--blue2)}
    .flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden}.flow-step{position:relative;padding:10px 12px;border-right:1px solid var(--line)}.flow-step:last-child{border-right:0}.flow-step:after{content:"›";position:absolute;right:-7px;top:27px;z-index:2;width:14px;height:14px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--dim);font-size:12px}.flow-step:last-child:after{display:none}.flow-step small,.flow-step strong,.flow-step em{display:block}.flow-step small{color:var(--dim);font-size:9px}.flow-step strong{margin-top:5px;font-size:18px}.flow-step em{margin-top:3px;color:var(--dim);font-size:8px;font-style:normal}.flow-step.accent{background:var(--blue2)}
    .month-row{display:grid;grid-template-columns:85px repeat(6,minmax(0,1fr));border-bottom:1px solid var(--line)}.month-row:last-child{border-bottom:0}.month-row>div{min-height:49px;padding:8px;border-right:1px solid var(--line)}.month-row>div:last-child{border-right:0}.month-row.head>div{min-height:34px;background:var(--surface3);color:var(--dim);font-size:8px;font-weight:750}.month-row b,.month-row small{display:block}.month-row small{margin-top:2px;color:var(--dim);font-size:8px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
    @media(max-width:1100px){.filters{grid-template-columns:repeat(4,minmax(0,1fr))}.sources{grid-column:1/-1}.grid{grid-template-columns:1fr}.bridge{overflow:auto}.step{min-width:140px}}
  </style>
