<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>ERP 模块原生整合测试 · 运营协同平台</title>
  <link rel="stylesheet" href="assets/module-base.css">
  <link rel="stylesheet" href="assets/platform-integration.css">
  <link rel="stylesheet" href="assets/forecast.css?v=20260809-bp-context-4">
  <link rel="stylesheet" href="assets/shipment-summary.css?v=20260809-bp-context-5">
  <link rel="stylesheet" href="assets/functional-workspace.css?v=20260808-native-1">
  <link rel="stylesheet" href="assets/prototype-management.css?v=20260808-native-1">
  <link rel="stylesheet" href="assets/business-workspaces.css?v=20260809-bp-chart-4">
</head>
<body>
  <div class="app native-test-shell">
    <aside class="sidebar platform-sidebar" aria-label="平台模块导航">
      <div class="brand platform-brand">
        <div class="logo" aria-hidden="true">OP</div>
        <div>
          <div class="brand-name" data-i18n="brand">运营协同平台</div>
          <div class="brand-sub" data-i18n="business">欧洲业务运营</div>
        </div>
      </div>

      <nav class="nav" id="platformNav">
        <button class="nav-item platform-existing" type="button" data-existing-module="home">
          <span class="lbl" data-i18n="workbench">我的工作台</span>
        </button>

        <div class="nav-section" data-i18n="planning">计划与交付</div>
        <button class="nav-item platform-existing" type="button" data-existing-module="projects"><span class="lbl" data-i18n="projects">项目跟进</span><span class="nav-badge red">34</span></button>
        <button class="nav-item platform-existing" type="button" data-existing-module="sales"><span class="lbl" data-i18n="sales">产销管理</span></button>
        <button class="nav-item" type="button" data-module="forecast"><span class="lbl" data-i18n="forecast">预测管理</span><span class="nav-tag" data-i18n="native">原生</span></button>
        <button class="nav-item" type="button" data-module="shipmentSummary"><span class="lbl" data-i18n="logistic">物流交付</span><span class="nav-tag" data-i18n="native">原生</span></button>

        <div class="nav-section" data-i18n="growth">市场增长</div>
        <button class="nav-item platform-existing" type="button" data-existing-module="launch"><span class="lbl" data-i18n="launch">新品上市</span></button>
        <button class="nav-item platform-existing" type="button" data-existing-module="campaigns"><span class="lbl" data-i18n="campaigns">营销活动</span></button>
        <button class="nav-item platform-existing" type="button" data-existing-module="assets"><span class="lbl" data-i18n="assets">营销物料</span></button>

        <div class="nav-section" data-i18n="collaboration">协同中心</div>
        <button class="nav-item platform-existing" type="button" data-existing-module="monthly"><span class="lbl" data-i18n="monthly">月度促销审批</span><span class="nav-badge zero">0</span></button>
        <button class="nav-item platform-existing" type="button" data-existing-module="other"><span class="lbl" data-i18n="other">其他审批</span><span class="nav-badge zero">0</span></button>
        <button class="nav-item platform-existing" type="button" data-existing-module="tasks"><span class="lbl" data-i18n="tasks">我的待办</span><span class="nav-badge red">4</span></button>
        <button class="nav-item platform-existing" type="button" data-existing-module="exceptions"><span class="lbl" data-i18n="exceptions">异常中心</span><span class="nav-badge red">12</span></button>

        <div class="nav-section" data-i18n="businessManagement">经营管理</div>
        <button class="nav-item platform-existing" type="button" data-existing-module="overview"><span class="lbl" data-i18n="overview">经营总览</span></button>
        <button class="nav-item" type="button" data-module="bp"><span class="lbl" data-i18n="bp">BP达成</span><span class="nav-tag" data-i18n="native">原生</span></button>
        <button class="nav-item" type="button" data-module="performance"><span class="lbl" data-i18n="performance">经营分析复盘</span><span class="nav-tag" data-i18n="native">原生</span></button>
        <button class="nav-item platform-existing" type="button" data-existing-module="value-chain"><span class="lbl" data-i18n="valueChain">价值链测算</span></button>
        <button class="nav-item platform-existing" type="button" data-existing-module="settlement"><span class="lbl" data-i18n="settlement">结算台账</span></button>

        <div class="nav-section" data-i18n="management">专业与管理</div>
        <button class="nav-item" type="button" data-module="functions"><span class="lbl" data-i18n="functional">职能工作台</span></button>
        <button class="nav-item platform-existing" type="button" data-existing-module="system"><span class="lbl" data-i18n="system">系统管理</span></button>
      </nav>

      <div class="sidebar-foot">
        <span class="sync-dot" aria-hidden="true"></span>
        <span data-i18n="localTest">本地原生整合测试</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar platform-topbar">
        <div class="crumb">
          <div class="path" id="modulePath">计划与交付 <span class="sep">/</span> 预测管理</div>
          <div class="desc" id="moduleDescription">销售预测输入、共识与版本管理</div>
        </div>
        <label class="mobile-module-picker">
          <span class="sr-only">选择模块</span>
          <select id="mobileModuleSelect" aria-label="选择测试模块">
            <option value="forecast">预测管理</option>
            <option value="shipmentSummary">物流交付</option>
            <option value="bp">BP达成</option>
            <option value="performance">经营分析复盘</option>
            <option value="functions">职能工作台</option>
          </select>
        </label>
        <div class="spacer"></div>
        <div class="top-context" aria-label="测试环境状态">
          <span class="data-source"><span class="sync-dot" aria-hidden="true"></span><span data-i18n="snapshot">本地快照 · 15张表</span></span>
          <label class="top-control">
            <span class="sr-only">界面语言</span>
            <select id="localeSelect" aria-label="界面语言">
              <option value="zh-CN">中文</option>
              <option value="en-GB">English</option>
            </select>
          </label>
          <button class="top-control account-control" type="button" id="accountButton" title="测试账号">payton.ppc · 平台所有者</button>
          <div id="cloudStatusMount" aria-label="云端账号与同步状态"></div>
        </div>
      </header>

      <div class="environment-strip" role="status">
        <div>
          <strong data-i18n="testMode">业务分析试运行</strong>
          <span id="testModeDescription">业务数据为只读快照；不会写入或覆盖云端正式记录。</span>
        </div>
        <span class="render-status" id="renderStatus">已就绪</span>
      </div>

      <section class="content" aria-live="polite">
        <div class="content-inner">
          <nav class="logistics-subnav" id="logisticsSubnav" aria-label="物流交付子模块" hidden>
            <span class="logistics-subnav-title" data-i18n="logisticsWorkspace">物流交付</span>
            <div class="logistics-subnav-tabs" role="tablist">
              <button type="button" role="tab" data-logistics-view="shipmentSummary" data-i18n="shipmentSummary">发货汇总</button>
              <button type="button" role="tab" data-logistics-view="shipment" data-i18n="shipmentOperation">发货操作</button>
              <button type="button" role="tab" data-logistics-view="logistic" data-i18n="productLogistics">产品物流与价格</button>
            </div>
          </nav>
          <div id="view"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    window.ROUTES = {
      forecast: { overline: "计划与交付 · FORECAST MANAGEMENT" },
      shipmentSummary: { overline: "计划与交付 · SHIPMENT OVERVIEW" },
      logistic: { overline: "计划与交付 · LOGISTICS DELIVERY" },
      shipment: { overline: "计划与交付 · SHIPMENT FULFILMENT" },
      bp: { overline: "经营管理 · BP ACHIEVEMENT" },
      performance: { overline: "经营管理 · BUSINESS ANALYSIS REVIEW" },
      functions: { overline: "专业与管理 · PROFESSIONAL WORKSPACES" },
      prototypeManagement: { overline: "专业与管理 · PROTOTYPE OPERATIONS" }
    };
  </script>
  <script>
    window.platformAuthReady = (() => {
      const hosted = window.location.protocol === "https:";
      if (!hosted) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "/cloud-sync.js";
        script.onload = () => Promise.resolve(window.cloudSyncReady).then(resolve, reject);
        script.onerror = () => reject(new Error("云端登录组件加载失败"));
        document.head.appendChild(script);
      });
    })();

    const nativeScripts = [
      "assets/data.js",
      "assets/shared.js?v=20260809-navigation-context-4",
      "assets/business-metrics.js?v=20260809-native-1",
      "assets/forecast.js?v=20260809-bp-context-4",
      "assets/logistic.js?v=20260808-sticky-header-2",
      "assets/shipment.js",
      "assets/shipment-summary.js?v=20260809-bp-context-5",
      "assets/bp-achievement.js?v=20260809-bp-chart-4",
      "assets/business-review.js?v=20260809-review-bp-2",
      "assets/functional-workspace.js?v=20260808-native-1",
      "assets/prototype-management.js?v=20260808-native-1",
      "assets/platform-shell.js"
    ];

    function loadNativeScript(source) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = source;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`模块资源加载失败：${source}`));
        document.body.appendChild(script);
      });
    }

    window.platformBootstrapReady = window.platformAuthReady
      .then(() => nativeScripts.reduce(
        (sequence, source) => sequence.then(() => loadNativeScript(source)),
        Promise.resolve()
      ))
      .catch((error) => {
        const status = document.getElementById("renderStatus");
        const view = document.getElementById("view");
        if (status) status.textContent = "加载失败";
        if (view) {
          view.innerHTML = `<section class="card"><h2>无法加载业务快照</h2><p>${String(error && error.message || error)}</p><button class="btn" type="button" onclick="location.reload()">重新加载</button></section>`;
        }
        throw error;
      });
  </script>
</body>
</html>
