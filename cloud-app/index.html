      `;
    }

    function renderProjectSelect(name, label, options, value) {
      return `
        <div class="control">
          <label>${label}</label>
          <select data-project-filter="${name}">
            ${options.map((option) => `<option value="${option}" ${option === value ? "selected" : ""}>${projectOptionLabel(name, option)}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function renderProjectKpis(projects) {
      const kpi = projectKpiData(projects);
      const cards = [
        { label: "范围内项目", value: kpi.active, foot: "当前筛选范围" },
        { label: "上市有风险", value: kpi.launchRisk, foot: "关键路径为红色", risk: kpi.launchRisk > 0 },
        { label: "阻塞任务", value: kpi.blockedTasks, foot: "需要立即处理", risk: kpi.blockedTasks > 0 },
        { label: "未来14天到期", value: kpi.dueNext14, foot: "尚未完成的交付项" },
        { label: "项目组合准备度", value: kpi.readiness + "%", foot: "必需任务完成比例" }
      ];
      return `<section class="kpis" aria-label="项目组合摘要">${cards.map((card) => `
        <article class="kpi">
          <div class="kpi-label">${card.label}</div>
          <div class="kpi-value ${card.risk ? "number-negative" : ""}">${card.value}</div>
          <div class="kpi-foot">${card.foot}</div>
        </article>
      `).join("")}</section>`;
    }

    function renderProjectExceptionBoard(rows) {
      return `
        <aside class="panel project-exception-panel">
          <div class="panel-head">
            <h2 class="panel-title">异常事项 <span class="count-badge">${rows.length}</span></h2>
            <span class="exception-summary">负责人和截止时间</span>
          </div>
          <div class="chips">
            <span class="chip danger">阻塞 (${rows.filter((row) => row.health === "red").length})</span>
            <span class="chip warn">预警 (${rows.filter((row) => row.health === "amber").length})</span>
          </div>
          <div class="project-exception-list">
            ${rows.length ? rows.map((row) => `
              <button class="project-exception" data-project-action="open-workstream" data-project-id="${row.projectId}" data-workstream="${row.workstream}">
                <span class="project-exception-top">
                  <span class="health-label"><span class="health-dot ${row.health}"></span>${row.workstreamLabel}</span>
                  <span class="exception-month">${projectDateLabel(row.due)}</span>
                </span>
                <span class="project-exception-title">${row.model} · ${renderProjectUserContent(projectText(row.issue))}</span>
                <span class="project-exception-copy">${row.projectName}</span>
                <span class="project-exception-foot"><span>负责人 ${row.owner}</span><span>${row.health === "red" ? "阻塞" : "预警"}</span></span>
              </button>
            `).join("") : `<div class="exception-empty">当前范围内没有重大异常。</div>`}
          </div>
        </aside>
      `;
    }

    function renderProjectMatrix(projects) {
      return `
        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">跨职能准备度矩阵</h2>
            <span class="chart-note">状态 · 完成数 · 截止日期</span>
          </div>
          <div class="project-matrix-wrap">
            <table class="project-table">
              <thead>
                <tr>
                  <th class="project-col">项目</th>
                  <th class="launch-col">上市日期</th>
                  <th class="stage-col">当前阶段</th>
                  <th class="health-col">健康状态</th>
                  ${PROJECT_WORKSTREAMS.map((item) => `<th class="workstream-col ${item.key === "supply" ? "supply-col" : ""}" title="${item.label}">${item.short}</th>`).join("")}
                  <th class="milestone-col">下一里程碑</th>
                </tr>
              </thead>
              <tbody>
                ${projects.length ? projects.map(renderProjectRow).join("") : `<tr><td colspan="${PROJECT_WORKSTREAMS.length + 5}" class="exception-empty">没有符合筛选条件的项目。</td></tr>`}
              </tbody>
            </table>
          </div>
          <div class="legend">
            <span><span class="legend-dot" style="background:var(--red)"></span>重大阻塞或已逾期</span>
            <span><span class="legend-dot" style="background:var(--orange)"></span>即将到期或存在依赖风险</span>
            <span><span class="legend-dot" style="background:var(--green)"></span>按计划推进</span>
            <span><span class="legend-dot" style="background:var(--soft)"></span>未启用 / 不适用</span>
          </div>
        </section>
      `;
    }

    function renderProjectRow(project) {
      const metrics = projectMetrics(project);
      const lifecycle = projectLifecycleMeta(project);
      const stageProgress = Math.round(((project.gateIndex + 1) / PROJECT_GATES.length) * 100);
      const ownerLabel = activeLocale === "en-GB" ? "Owner" : "负责人";
      const delayLabel = activeLocale === "en-GB" ? "delays" : "延期";
      const originalLabel = activeLocale === "en-GB" ? "Original" : "原";
      const phaseLabel = activeLocale === "en-GB" ? "Phase" : "阶段";
      const readinessLabel = activeLocale === "en-GB" ? "Readiness" : "准备度";
      return `
        <tr>
          <td class="project-col">
            <button class="project-link" data-project-action="open-project" data-project-id="${project.id}">
              <span class="sku-main">${project.model} · ${project.name}</span>
              <span class="project-owner">${projectText(project.category)} · ${ownerLabel} ${project.owner}${project.projectStatus !== "active" ? `<span class="lifecycle-inline ${lifecycle.tone}"> · ${lifecycle.label}</span>` : ""}${project.delayRecords?.length ? `<span class="timeline-inline"> · V${project.timelineVersion} / ${project.delayRecords.length} ${delayLabel}</span>` : ""}</span>
            </button>
          </td>
          <td class="launch-col"><span class="launch-date-stack"><span>${project.launchDate.slice(5)}</span>${project.originalLaunchDate && project.originalLaunchDate !== project.launchDate ? `<span class="date-original">${originalLabel} ${project.originalLaunchDate.slice(5)}</span>` : ""}</span></td>
          <td class="stage-col">
            <div class="stage-cell">
              <span class="stage-name">${projectStageLabel(project.stage)}</span>
              <span class="stage-progress"><span style="width:${stageProgress}%"></span></span>
              <span class="ws-meta">${phaseLabel} ${project.gateIndex + 1}/${PROJECT_GATES.length}</span>
            </div>
          </td>
          <td class="health-col">
            <div class="overall-health">
              <span class="health-label"><span class="health-dot ${metrics.health}"></span>${projectHealthLabel(metrics.health)}</span>
              <span class="readiness-value">${readinessLabel} ${metrics.readiness}%</span>
            </div>
          </td>
          ${PROJECT_WORKSTREAMS.map((meta) => renderWorkstreamCell(project, meta)).join("")}
          <td>
            <button class="project-link" data-project-action="open-project" data-project-id="${project.id}">
              <span class="next-milestone"><strong>${projectText(project.nextMilestone)}</strong><span>${projectDateLabel(project.nextDate)} · ${projectText(project.updated)}</span></span>
            </button>
          </td>
        </tr>
      `;
    }

    function renderWorkstreamCell(project, meta) {
      const stream = projectWorkstreamView(project, meta.key);
      const alertCount = stream.tasks.filter((task) => task.status === "Blocked").length;
      const ariaLabel = activeLocale === "en-GB"
        ? `${project.model} ${projectWorkstreamLabel(meta.key)}: ${projectHealthLabel(stream.health)}, completed ${stream.done}/${stream.total}${stream.firstBatch ? `, First Batch forecast ${stream.firstBatch.demand}, supply ${stream.firstBatch.supply}` : ""}`
        : `${project.model} ${meta.label}：${projectHealthLabel(stream.health)}，完成${stream.done}/${stream.total}${stream.firstBatch ? `，首批预测${stream.firstBatch.demand}，供应${stream.firstBatch.supply}` : ""}`;
      return `<td>
        <button class="ws-cell ${stream.health}${stream.firstBatch ? " has-first-batch" : ""}" data-project-action="open-workstream" data-project-id="${project.id}" data-workstream="${meta.key}" aria-label="${ariaLabel}">
          <span class="ws-main"><span class="ws-count">${stream.done}/${stream.total}</span></span>
          <span class="ws-meta"><span title="${stream.baselineDueISO && stream.baselineDueISO !== stream.dueISO ? `原计划 ${projectISODateLabel(stream.baselineDueISO)}` : ""}">${projectDateLabel(stream.due)}${stream.baselineDueISO && stream.baselineDueISO !== stream.dueISO ? "*" : ""}</span>${alertCount ? `<span class="ws-alert">! ${alertCount}</span>` : ""}</span>
          ${stream.firstBatch ? `<span class="ws-first-batch"><span>${activeLocale === "en-GB" ? "FB" : "首批"} ${activeLocale === "en-GB" ? new Intl.DateTimeFormat("en-GB", { month: "short", timeZone: "UTC" }).format(new Date(`${stream.firstBatch.month}-01T00:00:00Z`)) : stream.firstBatch.monthShort}</span><span>${activeLocale === "en-GB" ? "F" : "预"}${compact(stream.firstBatch.demand)} / ${activeLocale === "en-GB" ? "S" : "供"}${compact(stream.firstBatch.supply)}</span></span>` : ""}
        </button>
      </td>`;
    }

    function renderProjectMilestones(projects) {
      return `
        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">项目阶段与里程碑</h2>
            <span class="chart-note">预测日期及当前阶段</span>
          </div>
          <div class="milestone-wrap">
            <table class="milestone-table">
              <thead><tr><th class="project-col">项目</th>${PROJECT_GATES.map((gate) => `<th>${projectStageLabel(gate)}</th>`).join("")}</tr></thead>
              <tbody>
                ${projects.length ? projects.map((project) => `
                  <tr>
                    <td class="project-col"><button class="project-link" data-project-action="open-project" data-project-id="${project.id}"><span class="sku-main">${project.model}</span><span class="project-owner">${project.name}</span></button></td>
                    ${project.gates.map((gate, index) => `<td><div class="gate-cell ${gate.state}${gate.revisionCount ? " revised" : ""}"><strong>${projectDateLabel(gate.date)}</strong>${gate.baselineDueISO && gate.baselineDueISO !== gate.dueISO ? `<span class="gate-original-date">原 ${projectISODateLabel(gate.baselineDueISO)}</span>` : ""}<span class="gate-status">${gate.state === "current" ? "当前" : gate.state === "done" ? "已完成" : gate.state === "delayed" ? "延期" : "计划"}${gate.revisionCount ? " · 已修订" : ""}</span></div></td>`).join("")}
                  </tr>
                `).join("") : `<tr><td colspan="7" class="exception-empty">没有符合筛选条件的项目。</td></tr>`}
              </tbody>
            </table>
          </div>
          <div class="legend">
            <span><span class="legend-dot" style="background:var(--green)"></span>已完成</span>
            <span><span class="legend-dot" style="background:var(--blue)"></span>当前阶段</span>
            <span><span class="legend-dot" style="background:var(--red)"></span>预测延期</span>
          </div>
        </section>
      `;
    }

    function renderProjectDrawer(projectId) {
      const root = document.getElementById("projectDrawerRoot");
      const project = projectState.projects.find((item) => item.id === projectId);
      if (!project) {
        root.className = "drawer-backdrop";
        root.setAttribute("aria-hidden", "true");
        root.innerHTML = "";
        return;
      }
      const metrics = projectMetrics(project);
      const lifecycle = projectLifecycleMeta(project);
      const readOnly = projectIsReadOnly(project);
      const selectedMeta = PROJECT_WORKSTREAMS.find((item) => item.key === projectState.selectedWorkstream);
      const selectedStream = selectedMeta ? projectWorkstreamView(project, selectedMeta.key) : null;
      root.className = "drawer-backdrop active";
      root.setAttribute("aria-hidden", "false");
      root.innerHTML = `
        <aside class="project-drawer" role="dialog" aria-modal="true" aria-labelledby="projectDrawerTitle">
          <div class="drawer-head">
            <div>
              <h2 class="drawer-title" id="projectDrawerTitle">${project.model} · ${selectedMeta ? selectedMeta.label : project.name}</h2>
              <div class="drawer-subtitle">${project.name} · ${projectStageLabel(project.stage)} · 负责人 ${project.owner} <span class="project-lifecycle-badge ${lifecycle.tone}">${lifecycle.label}</span></div>
            </div>
            <button class="icon-btn" data-project-action="close-drawer" aria-label="关闭">×</button>
          </div>
          <div class="drawer-body">
            <div class="drawer-summary">
              <div class="drawer-stat"><div class="drawer-stat-label">健康状态</div><div class="drawer-stat-value"><span class="health-dot ${selectedStream?.health || metrics.health}"></span> ${projectHealthLabel(selectedStream?.health || metrics.health)}</div></div>
              <div class="drawer-stat"><div class="drawer-stat-label">准备度</div><div class="drawer-stat-value">${selectedStream ? `${selectedStream.done}/${selectedStream.total}` : `${metrics.readiness}%`}</div></div>
              <div class="drawer-stat"><div class="drawer-stat-label">最近截止</div><div class="drawer-stat-value">${projectDateLabel(selectedStream?.due || project.nextDate)}</div></div>
              <div class="drawer-stat"><div class="drawer-stat-label">负责人</div><div class="drawer-stat-value">${selectedStream?.owner || project.owner}</div></div>
            </div>

            ${selectedMeta?.key === "supply" ? renderFirstBatchSyncStrip(project) : ""}

            <div class="chips">
              <button class="chip ${!projectState.selectedWorkstream ? "active" : ""}" data-project-action="select-workstream" data-project-id="${project.id}" data-workstream="">全部</button>
              ${PROJECT_WORKSTREAMS.map((meta) => `<button class="chip" data-project-action="select-workstream" data-project-id="${project.id}" data-workstream="${meta.key}"><span class="health-dot ${projectWorkstreamView(project, meta.key).health}"></span> ${meta.short}</button>`).join("")}
            </div>

            <div class="tabs">
              ${["overview", "tasks", "dependencies", "delays", "history"].map((tab) => `<button class="tab ${projectState.drawerTab === tab ? "active" : ""}" data-project-action="drawer-tab" data-tab="${tab}">${{ overview: "概览", tasks: "任务", dependencies: "依赖", delays: `延期${project.delayRecords?.length ? ` (${project.delayRecords.length})` : ""}`, history: "历史" }[tab]}</button>`).join("")}
            </div>
            ${renderProjectDrawerBody(project, selectedMeta)}
          </div>
          <div class="drawer-foot">
            <span class="helper-note">${readOnly ? "历史项目只读保留，可从项目台账恢复跟进。" : "状态和部门更新均保留操作记录；已接入模块可查看来源数据。"}</span>
            <div class="drawer-actions">
              ${selectedStream ? renderProjectSourceControl(project, selectedStream, selectedMeta.key) : ""}
              ${selectedStream && canEditProjectWorkstream(selectedMeta.key, project.id) ? `<button class="btn danger" data-project-action="register-delay" data-project-id="${project.id}" data-workstream="${selectedMeta.key}">登记延期</button><button class="btn primary" data-project-action="edit-workstream" data-project-id="${project.id}" data-workstream="${selectedMeta.key}">编辑更新</button>` : ""}
              ${canManageProjectLifecycle() ? `<button class="btn ${readOnly ? "primary" : ""}" data-project-action="manage-project-status" data-project-id="${project.id}">${readOnly ? "恢复跟进" : "状态管理"}</button>` : ""}
              <button class="btn" data-project-action="close-drawer">关闭</button>
            </div>
          </div>
        </aside>
      `;
    }

    function renderProjectDrawerBody(project, selectedMeta) {
      if (projectState.drawerTab === "tasks") return renderProjectTasks(project, selectedMeta);
      if (projectState.drawerTab === "dependencies") return renderProjectDependencies(project);
      if (projectState.drawerTab === "delays") return renderProjectDelays(project);
      if (projectState.drawerTab === "history") return renderProjectHistory(project);
      const streams = selectedMeta ? [selectedMeta] : PROJECT_WORKSTREAMS;
      const blockers = streams.flatMap((meta) => {
        const stream = projectWorkstreamView(project, meta.key);
        return stream.blocker ? [{ label: meta.label, ...stream }] : [];
      });
      return `
        <section class="drawer-section">
          <h3 class="drawer-section-title">当前异常</h3>
          <div class="dependency-list">
            ${blockers.length ? blockers.map((item) => `
              <div class="dependency-row">
                <span class="health-label"><span class="health-dot ${item.health}"></span>${item.label}</span>
                <span class="dependency-copy">${renderProjectUserContent(projectText(item.blocker))}</span>
                <strong>${projectDateLabel(item.due)}</strong>
              </div>
            `).join("") : `<div class="exception-empty">没有未关闭的异常。</div>`}
          </div>
        </section>
        <section class="drawer-section">
          <h3 class="drawer-section-title">工作流准备度</h3>
          <table class="drawer-table">
            <thead><tr><th>工作流</th><th>状态</th><th>完成情况</th><th>最近截止</th><th>负责人</th></tr></thead>
            <tbody>${streams.map((meta) => {
              const stream = projectWorkstreamView(project, meta.key);
              return `<tr><td>${meta.label}</td><td><span class="task-status"><span class="health-dot ${stream.health}"></span>${projectHealthLabel(stream.health)}</span></td><td>${stream.done}/${stream.total}</td><td>${projectDateLabel(stream.due)}</td><td>${stream.owner}</td></tr>`;
            }).join("")}</tbody>
          </table>
        </section>
      `;
    }

    function renderProjectTasks(project, selectedMeta) {
      const metas = selectedMeta ? [selectedMeta] : PROJECT_WORKSTREAMS;
      const rows = metas.flatMap((meta) => project.workstreams[meta.key].tasks.map((task) => ({ ...task, workstream: meta.label })));
      return `
        <section class="drawer-section">
          <h3 class="drawer-section-title">${selectedMeta ? selectedMeta.label : "跨职能"}任务</h3>
          <table class="drawer-table">
            <thead><tr><th>任务</th><th>工作流</th><th>状态</th><th>负责人</th><th>截止时间</th></tr></thead>
            <tbody>${rows.map((task) => `<tr><td><strong>${projectText(task.name)}</strong>${task.critical ? `<div class="ws-alert">关键任务</div>` : ""}</td><td>${task.workstream}</td><td><span class="task-status"><span class="health-dot ${task.status === "Blocked" ? "red" : task.status === "Completed" ? "green" : "amber"}"></span>${projectStatusLabel(task.status)}</span></td><td>${task.owner}</td><td>${projectDateLabel(task.due)}</td></tr>`).join("")}</tbody>
          </table>
        </section>
      `;
    }

    function renderProjectDependencies(project) {
      return `
        <section class="drawer-section">
          <h3 class="drawer-section-title">依赖关系</h3>
          <div class="dependency-list">
            ${project.dependencies.length ? project.dependencies.map((item) => `
              <div class="dependency-row">
                <span class="dependency-source">${projectText(item.source)} → ${projectText(item.target)}</span>
                <span class="dependency-copy">${renderProjectUserContent(projectText(item.detail))}</span>
                <span class="task-status"><span class="health-dot ${item.status === "Blocked" ? "red" : "amber"}"></span>${projectStatusLabel(item.status)}</span>
              </div>
            `).join("") : `<div class="exception-empty">没有有效依赖关系。</div>`}
          </div>
        </section>
      `;
    }

    function renderProjectHistory(project) {
      const statusRecords = project.statusHistory || [];
      return `
        ${statusRecords.length ? `<section class="drawer-section"><h3 class="drawer-section-title">项目状态记录</h3><div class="activity-list">${statusRecords.map((item) => `<div class="activity-row"><strong>${projectISODateLabel(item.effectiveDate)}</strong><span class="dependency-copy"><span class="project-lifecycle-badge ${projectLifecycleMeta(item.toStatus).tone}">${projectLifecycleMeta(item.toStatus).label}</span> ${renderProjectUserContent(item.reason)}</span><span class="task-status">${escapeProjectHtml(item.createdBy)} · ${escapeProjectHtml(item.responsibleOwner)}</span></div>`).join("")}</div></section>` : ""}
        <section class="drawer-section">
          <h3 class="drawer-section-title">最近动态</h3>
          <div class="activity-list">
            ${project.history.map((item) => `<div class="activity-row"><strong>${projectTimeLabel(item.time)}</strong><span class="dependency-copy">${renderProjectUserContent(projectText(item.detail))}</span><span class="task-status">${projectText(item.source)}</span></div>`).join("")}
          </div>
        </section>
      `;
    }

    function renderProjectDelays(project) {
      const records = project.delayRecords || [];
      const baselineLaunchDate = project.originalLaunchDate || records[records.length - 1]?.oldLaunchDate || project.launchDate;
      const cumulativeDelayDays = Math.max(0, projectDelayDays(baselineLaunchDate, project.launchDate));
      return `
        <section class="drawer-section">
          <h3 class="drawer-section-title">时间线修订记录</h3>
          ${records.length ? `<div class="delay-impact-summary drawer-delay-summary">
            <div class="delay-impact-item"><div class="delay-impact-label">当前版本</div><div class="delay-impact-value">V${project.timelineVersion || records[0].version}</div></div>
            <div class="delay-impact-item"><div class="delay-impact-label">累计延期</div><div class="delay-impact-value number-negative">+${cumulativeDelayDays}天</div></div>
            <div class="delay-impact-item"><div class="delay-impact-label">上市日期</div><div class="delay-impact-value">${projectISODateLabel(baselineLaunchDate)} → ${projectISODateLabel(project.launchDate)}</div></div>
            <div class="delay-impact-item"><div class="delay-impact-label">延期记录</div><div class="delay-impact-value">${records.length}次</div></div>
          </div>` : ""}
          <div class="delay-record-list">
            ${records.length ? records.map((record) => {
              const changes = record.changes || [];
              return `
                <article class="delay-record">
                  <div class="delay-record-head">
                    <span class="health-label"><span class="health-dot red"></span>V${record.version} · ${projectWorkstreamLabel(record.sourceWorkstream)} ${record.isDemo ? `<span class="role-badge">示例</span>` : ""}</span>
                    <span class="exception-month">${record.createdLabel}</span>
                  </div>
                  <div class="delay-record-body">
                    <div class="delay-reason">${renderProjectUserContent(record.reason)}</div>
                    <div class="delay-meta"><span>根因：${delayCategoryLabel(record.category)}</span><span>责任人：${escapeProjectHtml(record.responsibleOwner)}</span><span>顺延方式：${delayPropagationLabel(record.propagation)}</span><span>延期：+${record.delayDays}天</span></div>
                    ${record.mitigation ? `<div class="dependency-copy"><strong>缓解措施：</strong>${renderProjectUserContent(record.mitigation)}</div>` : ""}
                    ${record.impactNote ? `<div class="dependency-copy"><strong>影响说明：</strong>${renderProjectUserContent(record.impactNote)}</div>` : ""}
                    <details class="delay-changes"><summary>查看全部 ${changes.length} 项日期变化</summary><div class="timeline-change-list">${changes.map(renderDelayPreviewChange).join("")}</div></details>
                    <div class="delay-meta"><span>上市日期：${projectISODateLabel(record.oldLaunchDate)} → ${projectISODateLabel(record.newLaunchDate)}</span><span>登记人：${record.createdBy}</span></div>
                  </div>
                </article>
              `;
            }).join("") : `<div class="exception-empty">暂无延期和时间线修订记录。</div>`}
          </div>
        </section>
      `;
    }

    function renderFirstBatchSyncStrip(project) {
      const firstBatch = projectFirstBatchData(project, true);
      if (!firstBatch) return "";
      return `
        <section class="first-batch-sync" aria-label="产销首批同步数据">
          <div class="first-batch-sync-item"><div class="first-batch-sync-label">首批月份</div><div class="first-batch-sync-value">${firstBatch.monthShort}</div></div>
          <div class="first-batch-sync-item"><div class="first-batch-sync-label">销售预测</div><div class="first-batch-sync-value">${formatNumber(firstBatch.demand)}</div></div>

          <div class="first-batch-sync-item"><div class="first-batch-sync-label">EOH</div><div class="first-batch-sync-value ${firstBatch.eoh < 0 ? "number-negative" : ""}">${formatNumber(firstBatch.eoh)}</div></div>

    function renderProjectAdminModal() {
      const root = document.getElementById("projectEditorRoot");
      if (!projectState.adminModal) {
        root.className = "modal-backdrop project-editor-backdrop";
        root.setAttribute("aria-hidden", "true");
        root.innerHTML = "";
        return;
      }
      root.className = "modal-backdrop project-editor-backdrop active";
      root.setAttribute("aria-hidden", "false");
      root.innerHTML = projectState.adminModal === "permissions"
        ? renderProjectPermissionModal()
        : projectState.adminModal === "project-ledger"
          ? renderProjectLedgerModal()
          : projectState.adminModal === "project-transition"
            ? renderProjectTransitionModal()
        : projectState.adminModal === "add-project"
          ? renderAddProjectModal()
          : projectState.adminModal === "delay"
            ? renderProjectDelayModal()
            : renderProjectWorkstreamEditor();
    }

    function renderProjectLedgerModal() {
      const statusOrder = { active: 0, paused: 1, closeout: 2, archived: 3, cancelled: 4 };
      const projects = [...projectState.projects].sort((a, b) => statusOrder[projectLifecycleStatus(a)] - statusOrder[projectLifecycleStatus(b)] || a.launchDate.localeCompare(b.launchDate));
      const counts = Object.fromEntries(Object.keys(PROJECT_LIFECYCLE).map((status) => [status, projects.filter((project) => projectLifecycleStatus(project) === status).length]));
      return `
        <section class="modal project-editor-modal project-ledger-modal" role="dialog" aria-modal="true" aria-labelledby="projectLedgerTitle">
          <div class="modal-head">
            <div>
              <h2 class="modal-title" id="projectLedgerTitle">项目台账</h2>
              <p class="modal-subtitle">统一管理项目进入、退出、上市收尾和恢复；历史项目只读保留</p>
            </div>
            <button class="icon-btn" data-project-editor-action="close" aria-label="关闭">×</button>
          </div>
          <div class="modal-body">
            <div class="ledger-summary" aria-label="项目状态摘要">
              ${[["active", "进行中"], ["paused", "暂停"], ["closeout", "上市待收尾"], ["archived", "已归档"], ["cancelled", "已取消"]].map(([status, label]) => `<div class="ledger-summary-item"><span>${label}</span><strong class="${status === "cancelled" ? "number-negative" : ""}">${counts[status] || 0}</strong></div>`).join("")}
            </div>
            <div class="ledger-guidance">
              <span><strong>默认矩阵：</strong>进行中、暂停和上市待收尾</span>
              <span><strong>历史保留：</strong>归档和取消项目不再占用默认矩阵</span>
              <span><strong>删除规则：</strong>已创建项目不硬删除，所有退出和恢复均留痕</span>
            </div>
            <div class="project-ledger-table-wrap">
              <table class="project-ledger-table">
                <thead><tr><th>项目</th><th>状态</th><th>上市时间</th><th>负责人</th><th>收尾情况</th><th>最近状态变更</th><th>操作</th></tr></thead>
                <tbody>${projects.map((project) => {
                  const lifecycle = projectLifecycleMeta(project);
                  const progress = projectCloseoutProgress(project);
                  const latest = project.statusHistory?.[0];
                  return `<tr>
                    <td><button class="project-link" data-project-editor-action="open-ledger-project" data-project-id="${project.id}"><span class="sku-main">${project.model} · ${project.name}</span><span class="project-owner">${project.id} · ${projectText(project.category)}</span></button></td>
                    <td><span class="project-lifecycle-badge ${lifecycle.tone}">${lifecycle.label}</span><div class="ledger-scope-note">${projectMatchesPortfolioScope(project, "history") ? "历史项目" : "默认矩阵可见"}</div></td>
                    <td><strong>${project.actualLaunchDate || project.launchDate}</strong>${project.actualLaunchDate ? `<div class="ledger-scope-note">原计划 ${project.launchDate}</div>` : `<div class="ledger-scope-note">计划日期</div>`}</td>
                    <td>${escapeProjectHtml(project.owner)}</td>
                    <td><span class="${progress.ready ? "number-positive" : progress.blockers ? "number-negative" : ""}">${progress.ready ? (activeLocale === "en-GB" ? "Completed" : "已完成") : (activeLocale === "en-GB" ? `Remaining ${progress.remaining} items` : `剩余 ${progress.remaining} 项`)}</span>${progress.blockers ? `<div class="ledger-scope-note number-negative">${activeLocale === "en-GB" ? `${progress.blockers} blocked items` : `${progress.blockers} 项阻塞`}</div>` : ""}</td>
                    <td>${latest ? `<strong>${projectISODateLabel(latest.effectiveDate)}</strong><div class="ledger-scope-note">${escapeProjectHtml(latest.createdBy)} · ${renderProjectUserContent(latest.reason)}</div>` : `<span class="ledger-scope-note">暂无状态变更</span>`}</td>
                    <td><div class="ledger-actions"><button class="btn" data-project-editor-action="open-ledger-project" data-project-id="${project.id}">查看</button>${canManageProjectLifecycle() ? `<button class="btn ${projectIsReadOnly(project) ? "primary" : ""}" data-project-editor-action="manage-project-status" data-project-id="${project.id}">${projectIsReadOnly(project) ? "恢复" : "管理状态"}</button>` : ""}</div></td>
                  </tr>`;
                }).join("")}</tbody>
              </table>
            </div>
          </div>
          <div class="modal-foot">
            <span class="helper-note">项目台账统计全部项目，不受主页面筛选条件影响。</span>
            <button class="btn" data-project-editor-action="close">关闭</button>
          </div>
        </section>
      `;
    }

    function renderProjectTransitionModal() {
      const draft = projectState.transitionDraft;
      const project = projectState.projects.find((item) => item.id === draft?.projectId);
      if (!draft || !project) return "";
      const targets = projectAllowedTransitions(project);
      const fromMeta = projectLifecycleMeta(draft.fromStatus);
      const targetMeta = projectLifecycleMeta(draft.targetStatus);
      const reasons = projectTransitionReasonOptions(draft.targetStatus);
      const closeout = projectCloseoutProgress(project);
      const requiresLaunchDate = ["closeout", "archived"].includes(draft.targetStatus);
      const movesToHistory = ["archived", "cancelled"].includes(draft.targetStatus);
      return `
        <section class="modal project-editor-modal project-transition-modal" role="dialog" aria-modal="true" aria-labelledby="projectTransitionTitle">
          <div class="modal-head">
            <div>
              <h2 class="modal-title" id="projectTransitionTitle">项目状态管理</h2>
              <p class="modal-subtitle">${project.model} · ${project.name}</p>
            </div>
            <button class="icon-btn" data-project-editor-action="close" aria-label="关闭">×</button>
          </div>
          <div class="modal-body">
            <div class="transition-path">
              <span class="project-lifecycle-badge ${fromMeta.tone}">${fromMeta.label}</span>
              <span class="transition-arrow">→</span>
              <span class="project-lifecycle-badge ${targetMeta.tone}">${targetMeta.label}</span>
              <span class="transition-impact-copy">${movesToHistory ? "确认后退出默认矩阵并进入历史项目" : draft.targetStatus === "active" ? "确认后恢复到当前跟进范围" : "确认后保留在默认矩阵，可按状态筛选"}</span>
            </div>

            <section class="editor-section">
              <div class="editor-section-head"><h3 class="editor-section-title">状态变更信息</h3><span class="permission-note">发布后生成不可覆盖的状态记录</span></div>
              <div class="editor-form-grid transition-form-grid">
                <div class="editor-field">
                  <label>目标状态</label>
                  <select data-project-transition-field="targetStatus">${targets.map((status) => `<option value="${status}" ${draft.targetStatus === status ? "selected" : ""}>${projectLifecycleMeta(status).label}</option>`).join("")}</select>
                </div>
                <div class="editor-field">
                  <label>变更类型</label>
                  <select data-project-transition-field="reasonCode">${reasons.map(([code, label]) => `<option value="${code}" ${draft.reasonCode === code ? "selected" : ""}>${label}</option>`).join("")}</select>
                </div>
                <div class="editor-field">
                  <label>责任人</label>
                  <input data-project-transition-field="responsibleOwner" value="${escapeProjectHtml(draft.responsibleOwner)}">
                </div>
                <div class="editor-field">
                  <label>生效日期</label>
                  <input type="date" data-project-transition-field="effectiveDate" value="${draft.effectiveDate}">
                </div>
                ${requiresLaunchDate ? `<div class="editor-field"><label>实际上市日期</label><input type="date" data-project-transition-field="actualLaunchDate" value="${draft.actualLaunchDate}"></div>` : ""}
                <div class="editor-field ${requiresLaunchDate ? "" : "span-2"}">
                  <label>关联项目（选填）</label>
                  <select data-project-transition-field="relatedProjectId"><option value="">无</option>${projectState.projects.filter((item) => item.id !== project.id && !projectIsReadOnly(item)).map((item) => `<option value="${item.id}" ${draft.relatedProjectId === item.id ? "selected" : ""}>${item.model} · ${item.name}</option>`).join("")}</select>
                </div>
                <div class="editor-field span-2">
                  <label>变更原因</label>
                  <textarea data-project-transition-field="reason" placeholder="说明项目暂停、取消、上市收尾或恢复的事实依据">${escapeProjectHtml(draft.reason)}</textarea>
                </div>
                <div class="editor-field span-2">
                  <label>交接与后续安排</label>
                  <textarea data-project-transition-field="note" placeholder="说明未完成事项、资料位置、承接人或恢复条件">${escapeProjectHtml(draft.note)}</textarea>
                </div>
              </div>
            </section>

            ${["closeout", "archived"].includes(draft.targetStatus) ? `<section class="editor-section"><div class="editor-section-head"><h3 class="editor-section-title">上市收尾检查</h3><span class="project-lifecycle-badge ${closeout.ready ? "green" : closeout.blockers ? "red" : "amber"}">${closeout.ready ? "可归档" : "待收尾"}</span></div><div class="closeout-check-grid"><div><span>未完成必需任务</span><strong>${closeout.remaining}</strong></div><div><span>阻塞任务</span><strong class="${closeout.blockers ? "number-negative" : ""}">${closeout.blockers}</strong></div><div><span>项目资料</span><strong>${draft.note.trim() ? "已填写交接" : "待补充"}</strong></div></div>${draft.targetStatus === "archived" ? `<label class="transition-confirm"><input type="checkbox" data-project-transition-field="closeoutConfirmed" ${draft.closeoutConfirmed ? "checked" : ""}><span>确认上市收尾已完成；若仍有未完成项，已在交接说明中明确承接人和完成时间。</span></label>` : `<div class="delay-warning">进入“已上市待收尾”后仍保留在默认矩阵，完成必要任务并由管理员确认后再归档。</div>`}</section>` : ""}
          </div>
          <div class="modal-foot">
            <span>${autosaveStatusMarkup("project-transition")} <span class="helper-note">自动保存仅保留草稿，状态变更需明确确认。</span></span>
            <div style="display:flex;gap:7px"><button class="btn" data-project-editor-action="back-to-ledger">返回台账</button><button class="btn primary" data-project-editor-action="apply-project-transition">确认变更为${targetMeta.label}</button></div>
          </div>
        </section>
      `;
    }

    function renderAddProjectModal() {
      const draft = projectState.newProjectDraft;
      if (!draft) return "";
      const linkedProduct = state.products.find((product) => product.model === draft.productSource);
      return `
        <section class="modal project-editor-modal" role="dialog" aria-modal="true" aria-labelledby="addProjectTitle">
          <div class="modal-head">
            <div>
              <h2 class="modal-title" id="addProjectTitle">新增项目</h2>
              <p class="modal-subtitle">建立项目主数据并初始化跨职能工作流</p>
            </div>
            <button class="icon-btn" data-project-editor-action="close" aria-label="关闭">×</button>
          </div>
          <div class="modal-body">
            <div class="admin-context-strip">
              <span>当前操作人：${currentProjectUser()?.name || "Ivy"} <span class="role-badge">${projectRoleLabel(currentProjectUser()?.role)}</span></span>
              <span>项目编号：${draft.id}</span>

            <section class="editor-section">
              <div class="editor-section-head"><h3 class="editor-section-title">项目基本信息</h3></div>

                    ${state.products.map((product) => `<option value="${product.model}" ${draft.productSource === product.model ? "selected" : ""}>关联产销产品 · ${product.model} · ${product.name}</option>`).join("")}
                  </select>
                </div>
                <div class="editor-field">
                  <label>项目ID</label>
                  <input value="${draft.id}" disabled>
                </div>
                <div class="editor-field">
                  <label>项目负责人</label>
                  <input data-new-project-field="owner" value="${escapeProjectHtml(draft.owner)}">
                </div>
                <div class="editor-field">
                  <label>产品型号</label>
                  <input data-new-project-field="model" value="${escapeProjectHtml(draft.model)}" ${linkedProduct ? "disabled" : ""} placeholder="例如 PX52">
                </div>
                <div class="editor-field span-2">
                  <label>产品名称</label>
                  <input data-new-project-field="name" value="${escapeProjectHtml(draft.name)}" ${linkedProduct ? "disabled" : ""} placeholder="产品正式名称">
                </div>
                <div class="editor-field">
                  <label>产品类别</label>
                  <input data-new-project-field="category" value="${escapeProjectHtml(projectText(draft.category))}" ${linkedProduct ? "disabled" : ""} placeholder="产品类别">
                </div>
                <div class="editor-field">
                  <label>计划上市日期</label>
                  <input type="date" data-new-project-field="launchDate" value="${draft.launchDate}">
                </div>
                <div class="editor-field">
                  <label>当前阶段</label>
                  <select data-new-project-field="stage">${PROJECT_GATES.map((stage) => `<option value="${stage}" ${draft.stage === stage ? "selected" : ""}>${projectStageLabel(stage)}</option>`).join("")}</select>
                </div>
              </div>
              ${linkedProduct?.lifecycle === "New" ? renderFirstBatchSyncStrip({ model: linkedProduct.model }) : ""}
            </section>

            <section class="editor-section">
              <div class="editor-section-head"><h3 class="editor-section-title">项目模板</h3><span class="permission-note">模板决定默认启用的工作流及必需任务数</span></div>
              <div class="template-grid">
                <label class="template-option"><input type="radio" name="projectTemplate" data-new-project-field="template" value="new_launch" ${draft.template === "new_launch" ? "checked" : ""}><strong>新品上市</strong><span>启用研发、样机、质量、认证、供应、营销和销售全部工作流。</span></label>
                <label class="template-option"><input type="radio" name="projectTemplate" data-new-project-field="template" value="product_refresh" ${draft.template === "product_refresh" ? "checked" : ""}><strong>产品更新</strong><span>保留研发、样机、质量、供应、营销和销售，认证默认不启用。</span></label>
                <label class="template-option"><input type="radio" name="projectTemplate" data-new-project-field="template" value="market_extension" ${draft.template === "market_extension" ? "checked" : ""}><strong>市场扩展</strong><span>重点启用认证、供应、营销和销售，其他工作流默认不适用。</span></label>
              </div>
            </section>
          </div>
          <div class="modal-foot">
            <span>${autosaveStatusMarkup("project-add")} <span class="helper-note">创建前仅保存为个人草稿。</span></span>
            <div style="display:flex;gap:7px"><button class="btn" data-project-editor-action="close">暂存并关闭</button><button class="btn primary" data-project-editor-action="create-project">创建项目</button></div>

    function renderProjectDelayModal() {
      const draft = projectState.delayDraft;
      const project = projectState.projects.find((item) => item.id === draft?.projectId);
      if (!draft || !project) return "";
      const preview = buildProjectDelayPreview(project, draft);
      const sourceMeta = PROJECT_WORKSTREAMS.find((item) => item.key === draft.sourceWorkstream);
      const firstBatch = projectFirstBatchData(project);
      const visibleChanges = preview.allChanges.slice(0, 14);
      const firstBatchWarning = firstBatch
        ? activeLocale === "en-GB"
          ? `Updating the project timeline does not change First Batch forecast or supply plan in Sales & Inventory. After publishing, review the ${new Intl.DateTimeFormat("en-GB", { month: "short", year: "numeric", timeZone: "UTC" }).format(new Date(`${firstBatch.month}-01T00:00:00Z`))} First Batch plan in Sales & Inventory.`
          : `项目时间线更新不会自动改写产销首批销售预测或供应计划。发布后需在产销管理中复核 ${firstBatch.monthShort} 首批计划。`
        : "";
      return `
        <section class="modal project-editor-modal" role="dialog" aria-modal="true" aria-labelledby="delayEditorTitle">
          <div class="modal-head">
            <div>
              <h2 class="modal-title" id="delayEditorTitle">登记延期并更新时间线</h2>
              <p class="modal-subtitle">${project.model} · ${project.name} · 时间线版本 V${(project.timelineVersion || 1) + 1}</p>
            </div>
            <button class="icon-btn" data-project-editor-action="close" aria-label="关闭">×</button>
          </div>
          <div class="modal-body">
            <div class="admin-context-strip">
              <span>登记人：${currentProjectUser()?.name || "Ivy"} <span class="role-badge">${projectRoleLabel(currentProjectUser()?.role)}</span></span>
              <span>卡点来源：${sourceMeta ? projectWorkstreamLabel(sourceMeta.key) : "未指定"}</span>
            </div>

            <section class="editor-section">
              <div class="editor-section-head"><h3 class="editor-section-title">延期信息</h3><span class="permission-note">原因和责任信息将进入不可覆盖的修订历史</span></div>
              <div class="editor-form-grid">
                <div class="editor-field">
                  <label>卡点工作流</label>
                  <select data-delay-field="sourceWorkstream">${PROJECT_WORKSTREAMS.map((meta) => `<option value="${meta.key}" ${draft.sourceWorkstream === meta.key ? "selected" : ""}>${meta.label}</option>`).join("")}</select>
                </div>
                <div class="editor-field">
                  <label>根因分类</label>
                  <select data-delay-field="category">${["technical", "prototype", "quality", "compliance", "supply", "resource", "decision", "external", "other"].map((value) => `<option value="${value}" ${draft.category === value ? "selected" : ""}>${delayCategoryLabel(value)}</option>`).join("")}</select>
                </div>
                <div class="editor-field">
                  <label>责任人</label>
                  <input data-delay-field="responsibleOwner" value="${escapeProjectHtml(draft.responsibleOwner)}">
                </div>
                <div class="editor-field">
                  <label>顺延方式</label>
                  <select data-delay-field="propagation"><option value="all_downstream" ${draft.propagation === "all_downstream" ? "selected" : ""}>全链路顺延</option><option value="milestones_only" ${draft.propagation === "milestones_only" ? "selected" : ""}>仅顺延里程碑</option><option value="anchor_only" ${draft.propagation === "anchor_only" ? "selected" : ""}>仅调整当前节点</option></select>
                </div>
                <div class="editor-field">
                  <label>受影响里程碑</label>
                  <select data-delay-field="anchorGate">${PROJECT_GATES.map((gate, index) => ({ gate, index })).filter((item) => item.index >= project.gateIndex).map((item) => `<option value="${item.gate}" ${draft.anchorGate === item.gate ? "selected" : ""}>${projectStageLabel(item.gate)}</option>`).join("")}</select>
                </div>
                <div class="editor-field">
                  <label>当前预测日期</label>
                  <input value="${preview.oldAnchorDate}" disabled>
                </div>
                <div class="editor-field">
                  <label>新预测日期</label>
                  <input type="date" data-delay-field="newDate" value="${draft.newDate}">
                </div>
                <div class="editor-field">
                  <label>延期天数</label>
                  <input value="${preview.delayDays > 0 ? `+${preview.delayDays} 天` : `${preview.delayDays} 天`}" disabled>
                </div>
                <div class="editor-field span-2">
                  <label>延期原因</label>
                  <textarea data-delay-field="reason" placeholder="说明卡点事实、发生时间和直接原因">${escapeProjectHtml(draft.reason)}</textarea>
                </div>
                <div class="editor-field span-2">
                  <label>缓解措施与下一步</label>
                  <textarea data-delay-field="mitigation" placeholder="说明负责人、措施和预计关闭时间">${escapeProjectHtml(draft.mitigation)}</textarea>

                <div class="editor-field span-2">
                  <label>影响说明</label>
                  <textarea data-delay-field="impactNote" placeholder="补充对供应、营销、销售或市场上市的影响">${escapeProjectHtml(draft.impactNote)}</textarea>

              </div>
            </section>

            <section class="editor-section">
              <div class="editor-section-head"><h3 class="editor-section-title">时间线变化预览</h3><span class="permission-note">${delayPropagationLabel(draft.propagation)}</span></div>

                <div class="delay-impact-item"><div class="delay-impact-label">上市日期</div><div class="delay-impact-value">${projectISODateLabel(preview.oldLaunchDate)} → ${projectISODateLabel(preview.newLaunchDate)}</div></div>

              </div>
            </section>

          </div>
        </section>
      `;
    }

    function ensurePermissionDraftMember(email, cloudRole = "editor", activatedAt = null) {
      if (!projectState.permissionDraft) return null;
      const normalizedEmail = normalizePermissionEmail(email);
      let user = projectState.permissionDraft.find((item) => normalizePermissionEmail(item.email) === normalizedEmail);
      if (!user) {
        user = normalizePermissionUser({
          id: `AUTH-${Date.now()}-${projectState.permissionDraft.length}`,
          name: normalizedEmail.split("@")[0] || "协同成员",
          email: normalizedEmail,
          department: "待分配",
          workstream: "all",
          cloudRole,
          platformRole: cloudRole === "admin" ? "super_admin" : "member",
          functionalRoles: [],
          role: cloudRole === "admin" ? "super_admin" : "viewer",
          scope: "all",
          status: "active",
          lastLogin: activatedAt ? "已登录" : "待首次登录"
        });
        projectState.permissionDraft.push(user);
      } else {
        user.cloudRole = cloudRole;
        if (cloudRole === "admin") user.platformRole = "super_admin";
        if (activatedAt && (!user.lastLogin || user.lastLogin === "尚未登录" || user.lastLogin === "待首次登录")) user.lastLogin = "已登录";
        Object.assign(user, normalizePermissionUser(user));
      }
      return user;
    }

    async function loadPermissionCloudMembers(options = {}) {
      const permissionApi = window.cloudStore?.permissions;
      if (!permissionApi || window.cloudStore?.identity?.role !== "admin") return;
      permissionCloudState.loading = true;
      if (!options.preserveMessage) {
        permissionCloudState.message = "正在同步授权成员...";
        permissionCloudState.messageTone = "";
      }
      if (projectState.adminModal === "permissions") renderProjectAdminModal();
      try {
        const members = await permissionApi.listMembers();
        permissionCloudState.members = members;
        members.forEach((member) => ensurePermissionDraftMember(member.email, member.role, member.activated_at));
        if (projectState.permissionDraft) scheduleProjectFormAutosave("project-permissions", "permissions", projectState.permissionDraft);
        if (!options.preserveMessage) permissionCloudState.message = "";
      } catch (error) {
        permissionCloudState.message = error.message || "授权成员加载失败，请稍后重试。";
        permissionCloudState.messageTone = "error";
      } finally {
        permissionCloudState.loading = false;
        permissionCloudState.busyEmail = "";
        if (projectState.adminModal === "permissions") renderProjectAdminModal();
      }
    }

    async function savePermissionCloudMember(email, role, options = {}) {
      const permissionApi = window.cloudStore?.permissions;
      const normalizedEmail = normalizePermissionEmail(email);
      if (!permissionApi) {
        permissionCloudState.message = "当前环境未连接云端授权服务。";
        permissionCloudState.messageTone = "error";
        renderProjectAdminModal();
        return;
      }
      if (!normalizedEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normalizedEmail)) {
        permissionCloudState.message = "请输入有效的 Google 邮箱。";
        permissionCloudState.messageTone = "error";
        renderProjectAdminModal();
        return;
      }
      permissionCloudState.busyEmail = normalizedEmail;
      permissionCloudState.message = options.isUpdate ? "正在更新登录权限..." : "正在授权成员...";
      permissionCloudState.messageTone = "";
      renderProjectAdminModal();
      try {
        const result = await permissionApi.authorizeMember(normalizedEmail, role);
        ensurePermissionDraftMember(normalizedEmail, role, result?.activated_at || (result?.status === "active" ? new Date().toISOString() : null));
        scheduleProjectFormAutosave("project-permissions", "permissions", projectState.permissionDraft);
        permissionCloudState.newEmail = "";
        permissionCloudState.message = result?.status === "active"
          ? `${normalizedEmail} 的登录权限已更新并立即生效。`
          : `${normalizedEmail} 已获授权，可使用该 Google 邮箱登录。`;
        permissionCloudState.messageTone = "success";
        await loadPermissionCloudMembers({ preserveMessage: true });
      } catch (error) {
        permissionCloudState.busyEmail = "";
        permissionCloudState.message = error.message || "授权保存失败，请稍后重试。";
        permissionCloudState.messageTone = "error";
        if (projectState.adminModal === "permissions") renderProjectAdminModal();
      }
    }

    async function revokePermissionCloudMember(userIndex) {
      const user = projectState.permissionDraft?.[userIndex];
      const email = normalizePermissionEmail(user?.email);
      const permissionApi = window.cloudStore?.permissions;
      if (!user || !email || !permissionApi) return;
      if (!window.confirm(`确认撤销 ${email} 的 Google 登录权限？职责记录将保留。`)) return;
      permissionCloudState.busyEmail = email;
      permissionCloudState.message = "正在撤销登录权限...";
      permissionCloudState.messageTone = "";
      renderProjectAdminModal();
      try {
        await permissionApi.revokeMember(email);
        permissionCloudState.message = `${email} 的登录权限已撤销，职责记录已保留。`;
        permissionCloudState.messageTone = "success";
        await loadPermissionCloudMembers({ preserveMessage: true });
      } catch (error) {
        permissionCloudState.busyEmail = "";
        permissionCloudState.message = error.message || "撤销失败，请稍后重试。";
        permissionCloudState.messageTone = "error";
        if (projectState.adminModal === "permissions") renderProjectAdminModal();
      }
    }

    function permissionSelectedDraftUser() {
      const users = projectState.permissionDraft || [];
      let user = users.find((item) => item.id === permissionUiState.selectedUserId);
      if (!user) {
        user = users[0] || null;
        permissionUiState.selectedUserId = user?.id || "";
      }
      return user;
    }

    function permissionFunctionalSummary(user) {
      if (!user?.functionalRoles?.length) return activeLocale === "en-GB" ? "No functional roles" : "未分配职能角色";
      return user.functionalRoles.map(functionalRoleLabel).join("、");

    function renderPermissionMembersTab(users, authorizationMap, cloudReady, messageClass) {
      return `<div class="permission-tab-panel" role="tabpanel">
        <section class="editor-section" style="padding-top:0">
          <div class="editor-section-head"><div><h3 class="editor-section-title">成员登录授权</h3><div class="permission-note">Google 邮箱控制能否登录；平台角色与职能角色控制登录后的业务权限。</div></div><button class="btn" data-project-editor-action="add-user">+ 添加内部账号</button></div>
          ${cloudReady ? `<div class="permission-invite-bar"><div class="permission-invite-field"><label>Google 邮箱</label><input type="email" autocomplete="email" data-permission-new-field="email" value="${escapeProjectHtml(permissionCloudState.newEmail)}" placeholder="name@company.com"></div><div class="permission-invite-field"><label>云端权限</label><select data-permission-new-field="role"><option value="editor" ${permissionCloudState.newRole === "editor" ? "selected" : ""}>可编辑</option><option value="viewer" ${permissionCloudState.newRole === "viewer" ? "selected" : ""}>只读</option></select></div><button class="btn primary" data-project-editor-action="authorize-new-member" ${permissionCloudState.busyEmail ? "disabled" : ""}>授权并添加</button><div class="permission-invite-help">精确匹配 Google 邮箱；新增成员默认只有登录和工作台权限。</div></div>` : `<div class="delay-warning">${window.cloudStore?.offline ? "本地预览模式不连接云端授权；仍可配置账号、角色、范围和审批权限。" : "当前云端账号没有成员授权管理权限。"}</div>`}

        </section>
        <section class="editor-section"><div class="permission-table-wrap"><table class="permission-table" style="min-width:1040px"><thead><tr><th style="width:25%">成员 / Google 邮箱</th><th style="width:14%">登录授权</th><th style="width:14%">平台角色</th><th style="width:24%">职能角色</th><th style="width:10%">账号状态</th><th style="width:13%">授权操作</th></tr></thead><tbody>${users.map((user, index) => renderPermissionMemberRow(user, index, authorizationMap, cloudReady)).join("")}</tbody></table></div></section>
      </div>`;
    }

    function renderPermissionMemberRow(user, index, authorizationMap, cloudReady) {
      const email = normalizePermissionEmail(user.email);
      const authorization = authorizationMap.get(email);
      const identityEmail = normalizePermissionEmail(window.cloudStore?.identity?.email);
      const isCurrentCloudAdmin = authorization?.role === "admin" && email === identityEmail;
      const cloudRole = authorization?.role || user.cloudRole || "editor";
      const accessState = authorization
        ? authorization.activated_at
          ? '<span class="permission-access-state active">已激活</span>'
          : '<span class="permission-access-state pending">待首次登录</span>'
        : `<span class="permission-access-state">${email ? "未授权" : "未绑定邮箱"}</span>`;
      let actions = '<span class="permission-note">云端不可用</span>';
      if (cloudReady) {
        if (authorization?.role === "admin") {
          actions = `<span class="permission-current-user">${isCurrentCloudAdmin ? "当前管理员" : "云端管理员"}</span>`;
        } else if (authorization) {
          actions = `<button class="btn" data-project-editor-action="update-member-access" data-user-index="${index}" ${permissionCloudState.busyEmail === email ? "disabled" : ""}>更新</button><button class="btn danger" data-project-editor-action="revoke-member-access" data-user-index="${index}" ${permissionCloudState.busyEmail === email ? "disabled" : ""}>撤销</button>`;
        } else {
          actions = `<button class="btn" data-project-editor-action="authorize-existing-member" data-user-index="${index}" ${!email || permissionCloudState.busyEmail === email ? "disabled" : ""}>授权登录</button>`;
        }
      }
      return `
        <tr>
          <td><div class="permission-member-fields"><input data-project-user-field="name" data-user-index="${index}" value="${escapeProjectHtml(user.name)}" placeholder="姓名"><input type="email" data-project-user-field="email" data-user-index="${index}" value="${escapeProjectHtml(user.email || "")}" placeholder="Google 邮箱" ${authorization ? "disabled title=\"请先撤销登录授权再更换邮箱\"" : ""}><input data-project-user-field="department" data-user-index="${index}" value="${escapeProjectHtml(user.department)}" placeholder="部门"><span class="permission-note">${escapeProjectHtml(user.lastLogin || "尚未登录")}</span></div></td>
          <td><div class="permission-access-stack">${accessState}${authorization?.role === "admin" ? '<span class="permission-note">云端管理员</span>' : `<select data-project-user-field="cloudRole" data-user-index="${index}"><option value="editor" ${cloudRole === "editor" ? "selected" : ""}>云端可编辑</option><option value="viewer" ${cloudRole === "viewer" ? "selected" : ""}>云端只读</option></select>`}</div></td>
          <td><select data-project-user-field="platformRole" data-user-index="${index}">${PLATFORM_ROLE_DEFINITIONS.map((role) => `<option value="${role.key}" ${user.platformRole === role.key ? "selected" : ""}>${permissionDefinitionLabel(role)}</option>`).join("")}</select></td>
          <td><div class="permission-role-chips">${user.functionalRoles?.length ? user.functionalRoles.map((role) => `<span class="permission-role-chip">${functionalRoleLabel(role)}</span>`).join("") : `<span class="permission-note">${activeLocale === "en-GB" ? "Assign from Role Templates" : "请在角色模板中分配"}</span>`}</div></td>
          <td><select data-project-user-field="status" data-user-index="${index}"><option value="active" ${user.status === "active" ? "selected" : ""}>启用</option><option value="disabled" ${user.status === "disabled" ? "selected" : ""}>停用</option></select></td>
          <td><div class="permission-row-actions">${actions}</div></td>
        </tr>
      `;
    }

    function renderPermissionRoleTemplatesTab(users) {
      const selectedUser = permissionSelectedDraftUser();

      permissionUiState.templateKey = selectedTemplate.key;
      const roleChips = selectedUser?.functionalRoles?.length
        ? selectedUser.functionalRoles.map((role) => `<span class="permission-role-chip">${functionalRoleLabel(role)}<button data-project-editor-action="remove-functional-role" data-functional-role="${role}" aria-label="移除角色">×</button></span>`).join("")
        : `<span class="permission-note">${activeLocale === "en-GB" ? "No functional roles assigned" : "尚未分配职能角色"}</span>`;
      return `<div class="permission-tab-panel" role="tabpanel">
        <div class="permission-control-bar"><div class="permission-control-field"><label>成员</label><select data-permission-ui-field="selectedUserId">${users.map((user) => `<option value="${user.id}" ${selectedUser?.id === user.id ? "selected" : ""}>${escapeProjectHtml(user.name)} · ${platformRoleLabel(user.platformRole)}</option>`).join("")}</select></div><div class="permission-control-field"><label>角色模板</label><select data-permission-ui-field="templateKey">${PERMISSION_ROLE_TEMPLATES.map((template) => `<option value="${template.key}" ${selectedTemplate.key === template.key ? "selected" : ""}>${activeLocale === "en-GB" ? template.en : template.zh}</option>`).join("")}</select></div><div class="permission-control-field"><label>应用方式</label><select data-permission-ui-field="applyMode"><option value="merge" ${permissionUiState.applyMode === "merge" ? "selected" : ""}>叠加权限</option><option value="replace" ${permissionUiState.applyMode === "replace" ? "selected" : ""}>替换权限</option></select></div><button class="btn primary" data-project-editor-action="apply-role-template">应用角色模板</button></div>
