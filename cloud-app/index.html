    function handleProjectFilterChange(event) {
      const target = event.target;
      const filter = target.getAttribute("data-project-filter");
      if (!filter) return false;
      projectState.filters[filter] = target.value;
      projectState.selectedProjectId = null;
      persistProjectState();
      renderProjectModule();
      return true;
    }

    function openProjectWorkstreamEditor(projectId, workstreamKey) {
      if (!canEditProjectWorkstream(workstreamKey, projectId)) {
        showProjectToast("当前账号没有该工作流的编辑权限。");
        return;
      }
      projectState.adminModal = "editor";
      projectState.editorProjectId = projectId;
      projectState.editorWorkstream = workstreamKey;
      projectState.editorDraft = createProjectEditorDraft(projectId, workstreamKey);
      renderProjectAdminModal();
    }

    function openProjectTransition(projectId, preferredTarget = "") {
      if (!canManageProjectLifecycle()) {
        showProjectToast("仅总管理员可以变更项目状态。");
        return;
      }
      const project = projectState.projects.find((item) => item.id === projectId);
      if (!project || !projectAllowedTransitions(project).length) return;
      const key = `project-transition:${projectId}`;
      const saved = projectState.formDrafts?.[key];
      projectState.adminModal = "project-transition";
      projectState.transitionDraft = structuredClone(saved && saved.fromStatus === projectLifecycleStatus(project) ? saved : createProjectTransitionDraft(projectId, preferredTarget));
      projectState.editorDraft = null;
      projectState.newProjectDraft = null;
      projectState.delayDraft = null;
      renderProjectAdminModal();
    }

    function handleProjectEditorAction(button) {
      const action = button.getAttribute("data-project-editor-action");
      if (!action) return;
      if (action === "close") {
        flushActiveProjectAutosave();
        projectState.adminModal = null;
        projectState.editorDraft = null;
        projectState.permissionDraft = null;
        projectState.newProjectDraft = null;
        projectState.delayDraft = null;
        projectState.transitionDraft = null;
        renderProjectAdminModal();
        return;
      }
      if (action === "open-ledger-project") {
        const projectId = button.getAttribute("data-project-id");
        projectState.adminModal = null;
        projectState.transitionDraft = null;
        projectState.selectedProjectId = projectId;
        projectState.selectedWorkstream = null;
        projectState.drawerTab = "overview";
        renderProjectAdminModal();
        renderProjectDrawer(projectId);
        return;
      }
      if (action === "manage-project-status") {
        openProjectTransition(button.getAttribute("data-project-id"));
        return;
      }
      if (action === "back-to-ledger") {
        flushAutosave("project-transition");
        projectState.adminModal = "project-ledger";
        projectState.transitionDraft = null;
        renderProjectAdminModal();
        return;
      }
      if (action === "apply-project-transition") {
        applyProjectLifecycleTransition();
        return;
      }
      if (action === "add-task") {
        projectState.editorDraft.tasks.push({
          name: "",
          status: "Not Started",
          owner: projectState.editorDraft.owner || "",
          dueISO: projectState.editorDraft.dueISO,
          due: projectISOToDue(projectState.editorDraft.dueISO),
          critical: false
        });
        scheduleProjectWorkstreamAutosave();
        renderProjectAdminModal();
        return;
      }
      if (action === "remove-task") {
        projectState.editorDraft.tasks.splice(Number(button.getAttribute("data-task-index")), 1);
        scheduleProjectWorkstreamAutosave();
        renderProjectAdminModal();
        return;
      }
      if (action === "save-draft") {
        const key = projectDraftKey(projectState.editorProjectId, projectState.editorWorkstream);
        projectState.drafts[key] = structuredClone(projectState.editorDraft);
        persistProjectDrafts();
        renderProjectAdminModal();
        showProjectToast("部门更新草稿已保存。");
        return;
      }
      if (action === "publish") {
        publishProjectWorkstreamUpdate();
        return;
      }
      if (action === "authorize-new-member") {
        savePermissionCloudMember(permissionCloudState.newEmail, permissionCloudState.newRole);
        return;
      }
      if (action === "authorize-existing-member" || action === "update-member-access") {
        const user = projectState.permissionDraft?.[Number(button.getAttribute("data-user-index"))];
        if (user) savePermissionCloudMember(user.email, user.cloudRole || "editor", { isUpdate: action === "update-member-access" });
        return;
      }
      if (action === "revoke-member-access") {
        revokePermissionCloudMember(Number(button.getAttribute("data-user-index")));
        return;
      }
      if (action === "add-user") {
        projectState.permissionDraft.push({
          id: "USR-" + Date.now(),
          name: "",
          email: "",
          department: "",
          workstream: "engineering",
          cloudRole: "editor",
          role: "department_editor",
          scope: "all",
          status: "active",
          lastLogin: "尚未登录"
        });
        scheduleProjectFormAutosave("project-permissions", "permissions", projectState.permissionDraft);
        renderProjectAdminModal();
        return;
      }
      if (action === "save-permissions") {
        const validAdmin = projectState.permissionDraft.some((user) => user.role === "super_admin" && user.status === "active");
        if (!validAdmin) {
          showProjectToast("至少需要保留一个启用状态的总管理员账号。");
          return;
        }
        projectState.users = structuredClone(projectState.permissionDraft);
        persistProjectUsers();
        cancelAutosave("project-permissions");
        clearProjectFormDraft("permissions");
        projectState.adminModal = null;
        projectState.permissionDraft = null;
        renderApp();
        renderProjectAdminModal();
        showProjectToast("成员职责与工具权限已保存。登录授权已即时生效。");
        return;
      }
      if (action === "create-project") {
        createNewProject();
        return;
      }
      if (action === "apply-delay") {
        applyProjectTimelineDelay();
      }
    }

    function handleProjectEditorFieldChange(event) {
      const target = event.target;
      const contextField = target.getAttribute("data-project-editor-context");
      if (contextField) {
        flushAutosave("project-workstream");
        if (contextField === "projectId") projectState.editorProjectId = target.value;
        if (contextField === "workstream") projectState.editorWorkstream = target.value;
        if (!canEditProjectWorkstream(projectState.editorWorkstream, projectState.editorProjectId)) {
          showProjectToast("当前账号没有该工作流的编辑权限。");
          return true;
        }
        projectState.editorDraft = createProjectEditorDraft(projectState.editorProjectId, projectState.editorWorkstream);
        renderProjectAdminModal();
        return true;
      }
      const field = target.getAttribute("data-project-editor-field");
      if (field && projectState.editorDraft) {
        projectState.editorDraft[field] = ["done", "total"].includes(field) ? Math.max(0, Number(target.value || 0)) : target.value;
        scheduleProjectWorkstreamAutosave();
        return true;
      }
      const taskField = target.getAttribute("data-project-task-field");
      if (taskField && projectState.editorDraft) {
        const task = projectState.editorDraft.tasks[Number(target.getAttribute("data-task-index"))];
        if (task) task[taskField] = taskField === "critical" ? target.checked : target.value;
        scheduleProjectWorkstreamAutosave();
        return true;
      }
      const permissionNewField = target.getAttribute("data-permission-new-field");
      if (permissionNewField) {
        if (permissionNewField === "email") permissionCloudState.newEmail = target.value;
        if (permissionNewField === "role") permissionCloudState.newRole = target.value;
        return true;
      }
      const userField = target.getAttribute("data-project-user-field");
      if (userField && projectState.permissionDraft) {
        const user = projectState.permissionDraft[Number(target.getAttribute("data-user-index"))];
        if (user) user[userField] = target.value;
        scheduleProjectFormAutosave("project-permissions", "permissions", projectState.permissionDraft);
        return true;
      }
      const newProjectField = target.getAttribute("data-new-project-field");
      if (newProjectField && projectState.newProjectDraft) {
        if (newProjectField === "productSource") {
          projectState.newProjectDraft.productSource = target.value;
          const product = state.products.find((item) => item.model === target.value);
          if (product) {
            Object.assign(projectState.newProjectDraft, {
              model: product.model,
              name: product.name,
              category: product.category,
              launchDate: product.launch,
              template: product.lifecycle === "New" ? "new_launch" : "product_refresh"
            });
          } else {
            Object.assign(projectState.newProjectDraft, { model: "", name: "", category: "Power Bank", template: "new_launch" });
          }
          scheduleProjectFormAutosave("project-add", "add-project", projectState.newProjectDraft);
          renderProjectAdminModal();
        } else {
          projectState.newProjectDraft[newProjectField] = target.value;
          scheduleProjectFormAutosave("project-add", "add-project", projectState.newProjectDraft);
        }
        return true;
      }
      const delayField = target.getAttribute("data-delay-field");
      if (delayField && projectState.delayDraft) {
        projectState.delayDraft[delayField] = target.value;
        const project = projectState.projects.find((item) => item.id === projectState.delayDraft.projectId);
        if (delayField === "sourceWorkstream") {
          const stream = project?.workstreams[target.value];
          projectState.delayDraft.responsibleOwner = stream?.owner || projectState.delayDraft.responsibleOwner;
        }
        if (delayField === "anchorGate" && project) {
          const gateIndex = PROJECT_GATES.indexOf(target.value);
          projectState.delayDraft.currentDate = projectGateISO(project, gateIndex);
          projectState.delayDraft.newDate = shiftProjectISO(projectState.delayDraft.currentDate, 7);
        }
        scheduleProjectFormAutosave("project-delay", `delay:${projectState.delayDraft.projectId}`, projectState.delayDraft);
        if (["sourceWorkstream", "anchorGate", "newDate", "propagation"].includes(delayField)) renderProjectAdminModal();
        return true;
      }
      const transitionField = target.getAttribute("data-project-transition-field");
      if (transitionField && projectState.transitionDraft) {
        const draft = projectState.transitionDraft;
        draft[transitionField] = transitionField === "closeoutConfirmed" ? target.checked : target.value;
        if (transitionField === "targetStatus") {
          const project = projectState.projects.find((item) => item.id === draft.projectId);
          const replacement = createProjectTransitionDraft(draft.projectId, target.value);
          projectState.transitionDraft = {
            ...replacement,
            reason: draft.reason,
            responsibleOwner: draft.responsibleOwner,
            effectiveDate: draft.effectiveDate,
            relatedProjectId: draft.relatedProjectId,
            note: draft.note,
            actualLaunchDate: replacement.actualLaunchDate || draft.actualLaunchDate
          };
          if (!projectAllowedTransitions(project).includes(target.value)) return true;
        }
        const activeDraft = projectState.transitionDraft;
        scheduleProjectFormAutosave("project-transition", `project-transition:${activeDraft.projectId}`, activeDraft);
        if (transitionField === "targetStatus") renderProjectAdminModal();
        return true;
      }
      return false;
    }

    function applyProjectTimelineDelay() {
      const draft = projectState.delayDraft;
      const project = projectState.projects.find((item) => item.id === draft?.projectId);
      if (!draft || !project) return;
      if (projectIsReadOnly(project)) {
        showProjectToast("历史项目为只读状态，请先恢复项目跟进。");
        return;
      }
      const preview = buildProjectDelayPreview(project, draft);
      if (!draft.reason.trim()) {
        showProjectToast("请填写延期原因。");
        return;
      }
      if (!draft.responsibleOwner.trim()) {
        showProjectToast("请填写责任人。");
        return;
      }
      if (!preview || preview.delayDays <= 0) {
        showProjectToast("新预测日期必须晚于当前预测日期。");
        return;
      }

      preview.gateChanges.forEach((change) => {
        const gate = project.gates[change.index];
        gate.baselineDueISO = gate.baselineDueISO || change.oldDate;
        gate.previousDueISO = change.oldDate;
        gate.dueISO = change.newDate;
        gate.date = projectISOToDue(change.newDate);
        gate.revisionCount = Number(gate.revisionCount || 0) + 1;
      });
      preview.workstreamChanges.forEach((change) => {
        const stream = project.workstreams[change.entityId];
        stream.baselineDueISO = stream.baselineDueISO || change.oldDate;
        stream.previousDueISO = change.oldDate;
        stream.dueISO = change.newDate;
        stream.due = projectISOToDue(change.newDate);
        stream.revisionCount = Number(stream.revisionCount || 0) + 1;
      });
      preview.taskChanges.forEach((change) => {
        const task = project.workstreams[change.workstreamKey]?.tasks[change.taskIndex];
        if (!task) return;
        task.baselineDueISO = task.baselineDueISO || change.oldDate;
        task.previousDueISO = change.oldDate;
        task.dueISO = change.newDate;
        task.due = projectISOToDue(change.newDate);
        task.revisionCount = Number(task.revisionCount || 0) + 1;
      });

      project.originalLaunchDate = project.originalLaunchDate || project.launchDate;
      project.launchDate = preview.newLaunchDate;
      project.nextDate = projectISOToDue(projectGateISO(project, project.gateIndex));
      project.timelineVersion = Number(project.timelineVersion || 1) + 1;
      const sourceStream = project.workstreams[draft.sourceWorkstream];
      if (sourceStream) {
        sourceStream.health = "red";
        sourceStream.blocker = draft.reason.trim();
        if (draft.mitigation.trim()) sourceStream.nextAction = draft.mitigation.trim();
      }
      const record = {
        id: `DL-${Date.now()}`,
        version: project.timelineVersion,
        createdAt: new Date().toISOString(),
        createdLabel: new Intl.DateTimeFormat("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).format(new Date()),
        createdBy: currentProjectUser()?.name || "Ivy",
        sourceWorkstream: draft.sourceWorkstream,
        category: draft.category,
        responsibleOwner: draft.responsibleOwner.trim(),
        reason: draft.reason.trim(),
        mitigation: draft.mitigation.trim(),
        impactNote: draft.impactNote.trim(),
        anchorGate: draft.anchorGate,
        propagation: draft.propagation,
        delayDays: preview.delayDays,
        oldLaunchDate: preview.oldLaunchDate,
        newLaunchDate: preview.newLaunchDate,
        firstBatchReviewRequired: Boolean(projectFirstBatchData(project)),
        changes: preview.allChanges.map((change) => ({ ...change }))
      };
      project.delayRecords = project.delayRecords || [];
      project.delayRecords.unshift(record);
      project.history.unshift({
        time: "刚刚",
        source: projectWorkstreamLabel(draft.sourceWorkstream),
        detail: `${projectWorkstreamLabel(draft.sourceWorkstream)}卡点导致时间线顺延${preview.delayDays}天，上市日期由${projectISODateLabel(preview.oldLaunchDate)}调整为${projectISODateLabel(preview.newLaunchDate)}`
      });
      project.updated = "just now";
      persistProjectData();
      cancelAutosave("project-delay");
      clearProjectFormDraft(`delay:${project.id}`);
      projectState.adminModal = null;
      projectState.delayDraft = null;
      projectState.selectedProjectId = project.id;
      projectState.selectedWorkstream = draft.sourceWorkstream;
      projectState.drawerTab = "delays";
      renderProjectModule();
      showProjectToast(`${project.model} 时间线已更新至 V${project.timelineVersion}，延期记录已归档。`);
    }

    function applyProjectLifecycleTransition() {
      const draft = projectState.transitionDraft;
      const project = projectState.projects.find((item) => item.id === draft?.projectId);
      if (!draft || !project || !canManageProjectLifecycle()) return;
      const currentStatus = projectLifecycleStatus(project);
      if (currentStatus !== draft.fromStatus || !projectAllowedTransitions(project).includes(draft.targetStatus)) {
        showProjectToast("项目状态已发生变化，请重新打开状态管理。");
        return;
      }
      if (!draft.reason.trim()) {
        showProjectToast("请填写本次状态变更的具体原因。");
        return;
      }
      if (!draft.responsibleOwner.trim() || !draft.effectiveDate) {
        showProjectToast("请完整填写责任人和生效日期。");
        return;
      }
      if (["closeout", "archived"].includes(draft.targetStatus) && !draft.actualLaunchDate) {
        showProjectToast("请填写实际上市日期。");
        return;
      }
      const closeout = projectCloseoutProgress(project);
      if (draft.targetStatus === "archived" && !draft.closeoutConfirmed) {
        showProjectToast("归档前请确认上市收尾已完成或已有明确交接。");
        return;
      }
      if (draft.targetStatus === "archived" && !closeout.ready && !draft.note.trim()) {
        showProjectToast("项目仍有未完成项，请填写承接人和后续完成安排。");
        return;
      }

      const firstBatch = projectFirstBatchData(project);
      if (firstBatch && ["closeout", "archived"].includes(draft.targetStatus)) {
        project.firstBatchSnapshot = { ...firstBatch, historical: true, capturedAt: new Date().toISOString() };
      }
      const now = new Date();
      const actor = currentProjectUser()?.name || "Ivy";
      const targetMeta = projectLifecycleMeta(draft.targetStatus);
      const relatedProject = projectState.projects.find((item) => item.id === draft.relatedProjectId);
      const record = {
        id: `PS-${Date.now()}`,
        fromStatus: currentStatus,
        toStatus: draft.targetStatus,
        reasonCode: draft.reasonCode,
        reasonType: projectTransitionReasonLabel(draft.reasonCode, draft.targetStatus),
        reason: draft.reason.trim(),
        responsibleOwner: draft.responsibleOwner.trim(),
        effectiveDate: draft.effectiveDate,
        actualLaunchDate: draft.actualLaunchDate || "",
        relatedProjectId: draft.relatedProjectId || "",
        relatedProjectLabel: relatedProject ? `${relatedProject.model} · ${relatedProject.name}` : "",
        note: draft.note.trim(),
        createdAt: now.toISOString(),
        createdBy: actor
      };

      project.projectStatus = draft.targetStatus;
      project.statusChangedAt = now.toISOString();
      project.statusChangedBy = actor;
      project.statusHistory = project.statusHistory || [];
      project.statusHistory.unshift(record);
      project.updated = "just now";
      if (["closeout", "archived"].includes(draft.targetStatus)) {
        project.actualLaunchDate = draft.actualLaunchDate;
        project.stage = "Launch";
        project.gateIndex = PROJECT_GATES.length - 1;
        project.nextMilestone = draft.targetStatus === "closeout" ? "Launch Closeout" : "Project Archived";
        project.nextDate = projectISOToDue(draft.actualLaunchDate);
        project.gates.forEach((gate) => { gate.state = "done"; });
        const product = state.products.find((item) => item.model === project.model);
        if (product) {
          product.lifecycle = "Launched";
          product.launch = draft.actualLaunchDate;
          persistState();
        }
      }
      if (["archived", "cancelled"].includes(draft.targetStatus)) {
        project.closedAt = draft.effectiveDate;
        project.closedBy = actor;
      } else if (draft.targetStatus === "active") {
        delete project.closedAt;
        delete project.closedBy;
      }
      project.history.unshift({
        time: "刚刚",
        source: "Product",
        detail: `项目状态由${projectLifecycleMeta(currentStatus).label}变更为${targetMeta.label}：${draft.reason.trim()}`
      });

      persistProjectData();
      cancelAutosave("project-transition");
      clearProjectFormDraft(`project-transition:${project.id}`);
      projectState.portfolioScope = targetMeta.scope;
      projectState.adminModal = "project-ledger";
      projectState.transitionDraft = null;
      projectState.selectedProjectId = null;
      projectState.selectedWorkstream = null;
      persistProjectState();
      renderProjectModule();
      showProjectToast(`${project.model} 已变更为“${targetMeta.label}”，状态记录已保存。`);
    }

    function createNewProject() {
      const draft = projectState.newProjectDraft;
      if (!draft) return;
      if (!draft.model.trim() || !draft.name.trim() || !draft.owner.trim() || !draft.launchDate) {
        showProjectToast("请完整填写产品型号、名称、负责人和上市日期。");
        return;
      }
      if (projectState.projects.some((project) => project.id === draft.id)) {
        showProjectToast("项目ID已存在，请重新打开新增项目页面。");
        return;
      }
      const project = buildProjectFromDraft(draft);
      projectState.projects.unshift(project);
      persistProjectData();
      cancelAutosave("project-add");
      clearProjectFormDraft("add-project");
      projectState.adminModal = null;
      projectState.newProjectDraft = null;
      projectState.selectedProjectId = project.id;
      projectState.selectedWorkstream = null;
      projectState.drawerTab = "overview";
      renderProjectModule();
      showProjectToast(`${project.model} 项目已创建。`);
    }

    function publishProjectWorkstreamUpdate() {
      const project = projectState.projects.find((item) => item.id === projectState.editorProjectId);
      const meta = PROJECT_WORKSTREAMS.find((item) => item.key === projectState.editorWorkstream);
      const draft = projectState.editorDraft;
      if (!project || !meta || !draft) return;
      if (projectIsReadOnly(project)) {
        showProjectToast("历史项目为只读状态，请先恢复项目跟进。");
        return;
      }
      if (!draft.owner.trim()) {
        showProjectToast("请填写工作流负责人。");
        return;
      }
      if (draft.done > draft.total) {
        showProjectToast("已完成任务数不能大于必需任务总数。");
        return;
      }
      const stream = project.workstreams[meta.key];
      Object.assign(stream, {
        health: draft.health,
        done: draft.done,
        total: draft.total,
        owner: draft.owner.trim(),
        dueISO: draft.dueISO,
        due: projectISOToDue(draft.dueISO),
        blocker: draft.blocker.trim(),
        nextAction: draft.nextAction.trim(),
        tasks: draft.tasks.map((task) => ({
          name: task.name.trim() || "未命名任务",
          status: task.status,
          owner: task.owner.trim() || draft.owner.trim(),
          dueISO: task.dueISO,
          due: projectISOToDue(task.dueISO),
          critical: Boolean(task.critical)
        }))
      });
      const note = draft.updateNote.trim() || `${meta.label}状态更新为${projectHealthLabel(draft.health)}`;
      project.history.unshift({ time: "刚刚", source: meta.label, detail: note });
      project.updated = "just now";
      delete projectState.drafts[projectDraftKey(project.id, meta.key)];
      cancelAutosave("project-workstream");
      persistProjectDrafts();
      persistProjectData();
      projectState.adminModal = null;
      projectState.editorDraft = null;
      renderProjectModule();
      showProjectToast(`${project.model} · ${meta.label}已发布更新。`);
    }

    function handleProjectAction(button) {
      const action = button.getAttribute("data-project-action");
      if (!action) return;
      if (action === "toggle-critical") {
        projectState.filters.onlyCritical = !projectState.filters.onlyCritical;
        persistProjectState();
        renderProjectModule();
        return;
      }
      if (action === "add-project") {
        if (currentProjectUser()?.role !== "super_admin") {
          showProjectToast("仅总管理员可以新增项目。");
          return;
        }
        projectState.adminModal = "add-project";
        projectState.newProjectDraft = structuredClone(projectState.formDrafts?.["add-project"] || createNewProjectDraft());
        projectState.delayDraft = null;
        projectState.transitionDraft = null;
        renderProjectAdminModal();
        return;
      }
      if (action === "project-ledger") {
        projectState.adminModal = "project-ledger";
        projectState.transitionDraft = null;
        projectState.editorDraft = null;
        projectState.newProjectDraft = null;
        projectState.delayDraft = null;
        projectState.transitionDraft = null;
        renderProjectAdminModal();
        return;
      }
      if (action === "manage-project-status") {
        openProjectTransition(button.getAttribute("data-project-id"));
        return;
      }
      if (action === "register-delay") {
        const workstreamKey = button.getAttribute("data-workstream");
        const delayProjectId = button.getAttribute("data-project-id");
        if (!canEditProjectWorkstream(workstreamKey, delayProjectId)) {
          showProjectToast("当前账号没有登记该工作流延期的权限。");
          return;
        }
        projectState.adminModal = "delay";
        projectState.delayDraft = structuredClone(projectState.formDrafts?.[`delay:${delayProjectId}`] || createProjectDelayDraft(delayProjectId, workstreamKey));
        projectState.newProjectDraft = null;
        projectState.editorDraft = null;
        projectState.transitionDraft = null;
        renderProjectAdminModal();
        return;
      }
      if (action === "permissions") {
        const cloudIdentity = window.cloudStore?.identity;
        if (currentProjectUser()?.role !== "super_admin" || (cloudIdentity && cloudIdentity.role !== "admin")) {
          showProjectToast("仅云端总管理员可以管理权限。");
          return;
        }
        projectState.adminModal = "permissions";
        projectState.permissionDraft = structuredClone(projectState.formDrafts?.permissions || projectState.users);
        permissionCloudState = createPermissionCloudState();
        projectState.newProjectDraft = null;
        projectState.delayDraft = null;
        projectState.transitionDraft = null;
        renderProjectAdminModal();
        loadPermissionCloudMembers();
        return;
      }
      if (action === "edit-workstream") {
        projectState.newProjectDraft = null;
        projectState.delayDraft = null;
        projectState.transitionDraft = null;
        openProjectWorkstreamEditor(button.getAttribute("data-project-id"), button.getAttribute("data-workstream"));
        return;
      }
      if (action === "open-project" || action === "open-workstream") {
        projectState.selectedProjectId = button.getAttribute("data-project-id");
        projectState.selectedWorkstream = action === "open-workstream" ? button.getAttribute("data-workstream") : null;
        projectState.drawerTab = action === "open-workstream" ? "tasks" : "overview";
        renderProjectDrawer(projectState.selectedProjectId);
        return;
      }
      if (action === "close-drawer") {
        projectState.selectedProjectId = null;
        projectState.selectedWorkstream = null;
        renderProjectDrawer(null);
        return;
      }
      if (action === "select-workstream") {
        projectState.selectedWorkstream = button.getAttribute("data-workstream") || null;
        projectState.drawerTab = projectState.selectedWorkstream ? "tasks" : "overview";
        renderProjectDrawer(projectState.selectedProjectId);
        return;
      }
      if (action === "drawer-tab") {
        projectState.drawerTab = button.getAttribute("data-tab") || "overview";
        renderProjectDrawer(projectState.selectedProjectId);
        return;
      }
      if (action === "sync") {
        projectState.syncing = true;
        renderProjectModule();
        setTimeout(() => {
          projectState.syncing = false;
          projectState.syncedAt = "just now";
          persistProjectState();
          renderProjectModule();
          const firstBatchCount = projectState.projects.filter((project) => projectFirstBatchData(project)).length;
          showProjectToast(`7个工作流和${firstBatchCount}条首批产销数据已同步。`);
        }, 650);
        return;
      }
      if (action === "export") {
        exportProjectPortfolio();
        return;
      }
      if (action === "open-source") {
        const project = projectState.projects.find((item) => item.id === button.getAttribute("data-project-id"));
        const stream = project?.workstreams[button.getAttribute("data-workstream")];
        if (project && stream?.sourceModule === "Sales & Inventory" && state.products.some((item) => item.model === project.model)) {
          state.filters.model = project.model;
          projectState.selectedProjectId = null;
          activeModule = "sales";
          renderApp();
          showProjectToast(`已进入产销管理并筛选型号 ${project.model}。`);
          return;
        }
        showProjectToast(`${projectSourceLabel(stream?.sourceModule || "Project Tracking")}尚未接入独立来源页面。`);
      }
    }

    function exportProjectPortfolio() {
      const rows = [["项目ID", "型号", "产品名称", "项目状态", "计划上市日期", "实际上市日期", "当前阶段", "项目健康状态", "准备度", "工作流", "工作流状态", "已完成", "必需任务", "最近截止", "负责人", "阻塞原因", "首批月份", "首批销售预测", "首批供应计划", "首批供需差"]];
      filteredProjects().forEach((project) => {
        const metrics = projectMetrics(project);
        PROJECT_WORKSTREAMS.forEach((meta) => {
          const stream = projectWorkstreamView(project, meta.key);
          rows.push([project.id, project.model, project.name, projectLifecycleMeta(project).label, project.launchDate, project.actualLaunchDate || "", projectStageLabel(project.stage), projectHealthLabel(metrics.health), metrics.readiness + "%", meta.label, projectHealthLabel(stream.health), stream.done, stream.total, stream.dueISO, stream.owner, projectText(stream.blocker), stream.firstBatch?.month || "", stream.firstBatch?.demand ?? "", stream.firstBatch?.supply ?? "", stream.firstBatch?.gap ?? ""]);
        });
      });
      const csv = rows.map((row) => row.map((value) => `"${String(value ?? "").replaceAll('"', '""')}"`).join(",")).join("\n");
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = "项目准备度.csv";
      link.click();
      URL.revokeObjectURL(url);
      showProjectToast("项目准备度数据已导出。");
    }

    function showProjectToast(message) {
      projectState.toast = message;
      const root = document.getElementById("toastRoot");
      root.innerHTML = `<div class="toast" role="status">${message}</div>`;
      setTimeout(() => {
        if (projectState.toast === message) {
          projectState.toast = "";
          root.innerHTML = "";
        }
      }, 2400);
    }

    function handleFilterChange(event) {
      const target = event.target;
      const filter = target.getAttribute("data-filter");
      if (!filter || filter === "period") return;
      state.filters[filter] = target.value;
      state.highlighted = null;
      render();
    }

    function handleToolAccessChange(event) {
      const target = event.target;
      if (!target.hasAttribute("data-tool-user")) return false;
      projectState.activeUserId = target.value;
      projectState.selectedProjectId = null;
      projectState.selectedWorkstream = null;
      state.modal = null;
      syncSalesAccessFromToolUser();
      persistProjectState();
      persistState();
      renderApp();
      renderProjectDrawer(null);
      renderProjectAdminModal();
      const user = currentProjectUser();
      showProjectToast(`已切换到 ${user?.name || "当前账号"} · ${projectRoleLabel(user?.role)}。`);
      return true;
    }

    function handleClick(event) {
      const projectEditorButton = event.target.closest("[data-project-editor-action]");
      if (projectEditorButton) {
        handleProjectEditorAction(projectEditorButton);
        return;
      }
      if (event.target.id === "projectEditorRoot") {
        flushActiveProjectAutosave();
        projectState.adminModal = null;
        projectState.editorDraft = null;
        projectState.permissionDraft = null;
        projectState.newProjectDraft = null;
        projectState.delayDraft = null;
        projectState.transitionDraft = null;
        renderProjectAdminModal();
        return;
      }
      const moduleButton = event.target.closest("[data-module]");
      if (moduleButton) {
        flushActiveProjectAutosave();
        flushAutosave("sales-plan");
        flushAutosave("month-closing");
        activeModule = moduleButton.getAttribute("data-module") || "sales";
        state.modal = null;
        projectState.selectedProjectId = null;
        projectState.adminModal = null;
        projectState.editorDraft = null;
        projectState.permissionDraft = null;
        projectState.newProjectDraft = null;
        projectState.delayDraft = null;
        projectState.transitionDraft = null;
        renderApp();
        renderProjectAdminModal();
        return;
      }
      const projectScopeButton = event.target.closest("[data-project-scope]");
      if (projectScopeButton) {
        projectState.portfolioScope = projectScopeButton.getAttribute("data-project-scope") || "current";
        projectState.selectedProjectId = null;
        projectState.selectedWorkstream = null;
        persistProjectState();
        renderProjectModule();
        return;
      }
      const projectViewButton = event.target.closest("[data-project-view]");
      if (projectViewButton) {
        projectState.view = projectViewButton.getAttribute("data-project-view") || "matrix";
        persistProjectState();
        renderProjectModule();
        return;
      }
      const projectButton = event.target.closest("[data-project-action]");
      if (projectButton) {
        handleProjectAction(projectButton);
        return;
      }
      if (event.target.id === "projectDrawerRoot") {
        projectState.selectedProjectId = null;
        projectState.selectedWorkstream = null;
        renderProjectDrawer(null);
        return;
      }
      const button = event.target.closest("[data-action], [data-view], [data-lifecycle]");
      if (!button) return;
      const action = button.getAttribute("data-action");
      const view = button.getAttribute("data-view");
      const lifecycle = button.getAttribute("data-lifecycle");
      if (view) {
        state.view = view;
        render();
        return;
      }
      if (lifecycle) {
        state.filters.lifecycle = lifecycle;
        render();
        return;
      }
      if (action === "toggle-gap") state.filters.onlyGap = !state.filters.onlyGap;
      if (action === "toggle-first-batch") state.filters.firstBatchOnly = !state.filters.firstBatchOnly;
      if (action === "edit-plan") {
        state.modal = "editor";
        state.editorTab = "overview";
        state.editorMode = state.workflow.status === "sales_in_progress"
          ? "sales"
          : state.workflow.status === "supply_in_progress"
            ? "supply"
            : "review";
        state.showPaste = false;
        state.editorDrawer = null;
      }
      if (action === "pull-history") state.modal = "history";
      if (action === "forecast-archive") state.modal = "archive";
      if (action === "month-closing") state.modal = "closing";
      if (action === "close-modal") {
        flushAutosave(state.modal === "closing" ? "month-closing" : "sales-plan");
        state.modal = null;
        state.showPaste = false;
        state.editorDrawer = null;
      }
      if (action === "editor-tab") {
        state.editorTab = button.getAttribute("data-tab");
        state.editorDrawer = null;
      }
      if (action === "open-plan-entry") {
        state.editorTab = "grid";
        state.editorMode = button.getAttribute("data-mode") || "review";
        if (state.editorMode === "review") {
          state.editorFilters.gapOnly = true;
          state.editorFilters.firstBatchOnly = false;
        }
        state.editorDrawer = null;
      }
      if (action === "editor-mode") state.editorMode = button.getAttribute("data-mode") || "review";
      if (action === "editor-filter") {
        const filter = button.getAttribute("data-filter");
        state.editorFilters[filter] = !state.editorFilters[filter];
        state.editorPage = 1;
      }
      if (action === "editor-page") state.editorPage = Math.max(1, Number(button.getAttribute("data-page") || 1));
      if (action === "toggle-paste") {
        if (!canEditPlanField("demand") && !canEditPlanField("supply")) {
          state.showPaste = false;
          showProjectToast("当前模式为只读，需重新打开对应部门流程后录入。");
        } else {
          state.showPaste = !state.showPaste;
        }
      }
      if (action === "import-grid") {
        const input = document.getElementById("fileInput");
        if (input) input.click();
      }
      if (action === "apply-paste") applyPasteArea();
      if (action === "select-sku") toggleSelectedSku(button.getAttribute("data-model"), button.checked);
      if (action === "select-page-skus") togglePageSelection(button.checked);
      if (action === "open-note") state.editorDrawer = { type: "note", model: button.getAttribute("data-model") };
      if (action === "open-bulk") {
        if (!canEditPlanField("demand") && !canEditPlanField("supply")) {
          showProjectToast("当前模式没有可批量调整的字段。");
          render();
          return;
        }
        state.bulkDraft = state.bulkDraft || { month: MONTHS[0].key, field: state.editorMode === "supply" ? "supply" : "demand", value: 0, reason: "" };
        state.editorDrawer = { type: "bulk" };
      }
      if (action === "close-editor-drawer") {
        flushAutosave("sales-plan");
        state.editorDrawer = null;
      }
      if (action === "save-notes") saveProductNotes(button.getAttribute("data-model"));
      if (action === "confirm-bulk-apply") confirmBulkApply();
      if (["version-compare", "version-detail", "version-restore"].includes(action) && state.modal !== "editor") {
        state.modal = "editor";
        state.editorTab = "history";
      }
      if (action === "version-compare") state.editorDrawer = { type: "compare", versionId: button.getAttribute("data-version-id") };
      if (action === "version-detail") state.editorDrawer = { type: "detail", versionId: button.getAttribute("data-version-id") };
      if (action === "version-restore") state.editorDrawer = { type: "restore", versionId: button.getAttribute("data-version-id") };
      if (action === "confirm-version-restore") restoreVersionAsDraft(button.getAttribute("data-version-id"));
      if (action === "log-filter") state.logFilter = button.getAttribute("data-filter") || "all";
      if (action === "toggle-batch") state.expandedBatchId = state.expandedBatchId === button.getAttribute("data-batch-id") ? null : button.getAttribute("data-batch-id");
      if (action === "new-temporary-change") {
        const product = state.products[0];
        state.temporaryChangeDraft = state.temporaryChangeDraft || { model: product.model, month: MONTHS[0].key, field: "demand", value: product.plans[MONTHS[0].key].demand, urgency: "normal", reason: "" };
        state.editorDrawer = { type: "temporary" };
      }
      if (action === "submit-temporary-change") submitTemporaryChange();
      if (["submit-step", "review-submit-step"].includes(action)) {
        const step = button.getAttribute("data-step");
        state.editorDrawer = { type: "submit", step };
      }
      if (action === "reopen-step") {
        if (state.collaborationRole !== "admin") {
          showProjectToast("仅总管理员可以重新打开已提交环节。");
        } else {
          const step = button.getAttribute("data-step");
          state.reopenDraft = { step, reason: "" };
          state.editorDrawer = { type: "reopen", step };
        }
      }
      if (action === "confirm-submit-step") {
        confirmWorkflowSubmission(button.getAttribute("data-step")).then(render);
        return;
      }
      if (action === "confirm-reopen-step") reopenWorkflowStep(button.getAttribute("data-step"));
      if (action === "approve-review") approveWorkflowReview();
      if (action === "save-draft") {
        saveDraft().then(render);
        return;
      }
      if (action === "publish-snapshot") {
        publishSnapshot().then(render);
        return;
      }
      if (action === "confirm-month-closing") {
        flushAutosave("month-closing").then(() => {
          persistState();
          state.modal = null;
          showProjectToast("8月实际数据已确认并完成关账。" );
          render();
        });
        return;
      }
      if (action === "sync-history") {
        syncHistory().then(render);
        return;
      }
      if (action === "jump-exception") jumpToException(button);
      render();
    }

    function toggleSelectedSku(model, checked) {
      if (!model) return;
      state.selectedSkus = checked
        ? Array.from(new Set([...state.selectedSkus, model]))
        : state.selectedSkus.filter((item) => item !== model);
    }

    function togglePageSelection(checked) {
      const products = editorVisibleProducts();
      const start = (state.editorPage - 1) * state.editorPageSize;
      const models = products.slice(start, start + state.editorPageSize).map((product) => product.model);
      state.selectedSkus = checked
        ? Array.from(new Set([...state.selectedSkus, ...models]))
        : state.selectedSkus.filter((model) => !models.includes(model));
    }

    function applyPasteArea() {
      const value = document.getElementById("pasteArea")?.value || "";
      if (!value.trim()) {
        showProjectToast("请先粘贴需要更新的数据。");
        return;
      }
      const updated = applyGridText(value);
      state.showPaste = false;
      state.pasteDraft = "";
      render();
      showProjectToast(updated ? `已更新 ${updated} 个可写字段。` : "粘贴数据中没有当前可编辑字段。");
    }

    function saveProductNotes(model) {
      const product = state.products.find((item) => item.model === model);
      if (!product) return;
      document.querySelectorAll(`[data-note-month][data-model="${model}"]`).forEach((textarea) => {
        const month = textarea.getAttribute("data-note-month");
        product.plans[month] = product.plans[month] || { demand: 0, supply: 0 };
        product.plans[month].comment = textarea.value;
      });
      state.editorDrawer = null;
      persistState();
      showProjectToast(`${model} 的月度备注已保存。`);
    }

    function confirmBulkApply() {
      const draft = state.bulkDraft;
      if (!draft || !state.selectedSkus.length) return;
      if (!canEditPlanField(draft.field)) {
        showProjectToast("当前部门字段已锁定，不能批量调整。");
        return;
      }
      if (!String(draft.reason || "").trim()) {
        showProjectToast("批量调整必须填写原因。");
        return;
      }
      const lines = [];
      state.selectedSkus.forEach((model) => {
        const product = state.products.find((item) => item.model === model);
        if (!product) return;
        const before = Number(product.plans[draft.month]?.[draft.field] || 0);
        const after = Number(draft.value || 0);
        if (before === after) return;
        product.plans[draft.month][draft.field] = after;
        lines.push({ sku: model, month: draft.month, field: draft.field, before, after, reason: draft.reason });
        addCellRevision(model, draft.month, draft.field, before, after, "当前用户");
      });
      if (lines.length) {
        state.changeBatches.unshift({
          id: "batch-bulk-" + Date.now(),
          title: `${monthLabel(draft.month)}批量${planFieldLabel(draft.field)}调整`,
          type: "temporary",
          function: draft.field === "demand" ? "sales" : "supply",
          status: "draft",
          owner: "当前用户",
          time: "刚刚",
          reason: draft.reason,
          lines
        });
      }
      state.editorDrawer = null;
      state.selectedSkus = [];
      schedulePlanAutosave();
      showProjectToast(`已批量更新 ${lines.length} 个SKU。`);
    }

    function restoreVersionAsDraft(versionId) {
      const version = versionRecord(versionId);
      if (!version?.products) return;
      state.products = cloneProducts(version.products);
      state.workflow = structuredClone(seedWorkflow);
      state.workflow.sales = { status: "in_progress", owner: "Ivy", time: "刚刚", note: `基于${version.name}重新更新预测` };
      state.workflow.supply = { status: "pending", owner: "Owen", time: "--", note: "等待销售预测提交" };
      state.workflow.review = { status: "pending", owner: "Julio", time: "--", note: "等待销售和供应提交" };
      state.workflow.publish = { status: "pending", owner: "Julio", time: "--", note: "审核后发布正式快照" };
      state.workflow.status = "sales_in_progress";
      state.editorMode = "sales";
      state.editorTab = "overview";
      state.editorDrawer = null;
      state.changeBatches.unshift({ id: "restore-" + Date.now(), title: `基于${version.name}创建草稿`, type: "temporary", function: "sales", status: "draft", owner: "Julio", time: "刚刚", reason: "历史版本恢复为新草稿", lines: [] });
      addWorkflowEvent("已创建新的协同草稿", `基于${version.name}重新启动销售预测`, "Julio", "active");
      persistState();
      showProjectToast(`已基于 ${version.name} 创建新草稿。`);
    }

    function submitTemporaryChange() {
      const draft = state.temporaryChangeDraft;
      if (!draft || !String(draft.reason || "").trim()) {
        showProjectToast("临时变更必须填写原因。");
        return;
      }
      const product = state.products.find((item) => item.model === draft.model);
      if (!product) return;
      const before = Number(product.plans[draft.month]?.[draft.field] || 0);
      const after = Number(draft.value || 0);
      product.plans[draft.month][draft.field] = after;
      addCellRevision(draft.model, draft.month, draft.field, before, after, "当前用户");
      state.changeBatches.unshift({
        id: "change-temp-" + Date.now(),
        title: `${draft.model} ${planFieldLabel(draft.field)}临时变更`,
        type: "temporary",
        function: draft.field === "demand" ? "sales" : "supply",
        status: "pending",
        owner: "当前用户",
        time: "刚刚",
        reason: draft.reason,
        urgency: draft.urgency,
        lines: [{ sku: draft.model, month: draft.month, field: draft.field, before, after, reason: draft.reason }]
      });
      state.workflow.review = { status: "pending", owner: "Julio", time: "--", note: "有临时变更等待审批" };
      state.editorDrawer = null;
      state.expandedBatchId = state.changeBatches[0].id;
      state.editorTab = "log";
      persistState();
      showProjectToast("临时变更已加入草稿并提交审批。");
    }

    function addWorkflowEvent(action, detail, user = "当前用户", tone = "active") {
      state.workflowEvents = state.workflowEvents || [];
      state.workflowEvents.unshift({ id: "workflow-" + Date.now(), action, detail, user, time: "刚刚", tone });
      state.workflowEvents = state.workflowEvents.slice(0, 20);
    }

    function submitWorkflowStep(step) {
      if (!step || !state.workflow[step]) return;
      const allowedRoles = step === "sales" ? ["admin", "sales"] : ["admin", "supply"];
      if (!allowedRoles.includes(state.collaborationRole) || state.workflow[step].status !== "in_progress") {
        showProjectToast("当前身份或流程状态不允许提交该环节。");
        return;
      }
      state.workflow[step] = { ...state.workflow[step], status: "submitted", time: "刚刚", note: step === "sales" ? "销售预测已提交并锁定" : "供应计划已提交并锁定" };
      if (step === "sales") {
        state.workflow.supply = { ...state.workflow.supply, status: "in_progress", time: "刚刚", note: "正在响应已提交的销售预测" };
        state.workflow.status = "supply_in_progress";
        state.editorMode = "supply";
        addWorkflowEvent("销售预测已提交", workflowChangeScope("sales"), state.workflow.sales.owner, "complete");
      } else {
        state.workflow.review = { ...state.workflow.review, status: "reviewing", time: "刚刚", note: "销售与供应数据等待联合复核" };
        state.workflow.status = "reviewing";
        state.editorMode = "review";
        addWorkflowEvent("供应计划已提交", workflowChangeScope("supply"), state.workflow.supply.owner, "complete");
      }
      state.changeBatches.forEach((batch) => {
        if (batch.function === step && ["draft", "in_progress"].includes(batch.status)) {
          batch.status = "submitted";
          batch.time = "刚刚";
        }
      });
      state.editorTab = "overview";
      state.editorDrawer = null;
      persistState();
      showProjectToast(step === "sales" ? "销售预测已提交，供应链可以开始响应。" : "供应计划已提交，进入联合复核。" );
    }

    async function confirmWorkflowSubmission(step) {
      const allowedRoles = step === "sales" ? ["admin", "sales"] : ["admin", "supply"];
      if (!allowedRoles.includes(state.collaborationRole) || state.workflow[step]?.status !== "in_progress") {
        showProjectToast("当前身份或流程状态不允许提交该环节。");
        return;
      }
      await flushAutosave("sales-plan");
      await saveDraft(false);
      submitWorkflowStep(step);
    }

    function reopenWorkflowStep(step) {
      if (!step || !state.workflow[step] || state.collaborationRole !== "admin") return;
      const reason = String(state.reopenDraft?.reason || "").trim();
      if (!reason) {
        showProjectToast("请填写重新打开原因。");
        return;
      }
      state.workflow[step] = { ...state.workflow[step], status: "in_progress", time: "刚刚", note: `总管理员重新打开：${reason}` };
      if (step === "sales") {
        state.workflow.supply = { ...state.workflow.supply, status: "pending", time: "--", note: "等待销售预测重新提交" };
        state.workflow.review = { ...state.workflow.review, status: "pending", time: "--", note: "等待销售和供应重新提交" };
        state.workflow.publish = { ...state.workflow.publish, status: "pending", time: "--", note: "审核后发布正式快照" };
        state.editorMode = "sales";
        state.workflow.status = "sales_in_progress";
      } else {
        state.workflow.review = { ...state.workflow.review, status: "pending", time: "--", note: "等待供应重新提交" };
        state.workflow.publish = { ...state.workflow.publish, status: "pending", time: "--", note: "审核后发布正式快照" };
        state.editorMode = "supply";
        state.workflow.status = "supply_in_progress";
      }
      addWorkflowEvent(`${step === "sales" ? "销售预测" : "供应计划"}已重新打开`, reason, "Julio", "active");
      state.editorTab = "overview";
      state.editorDrawer = null;
      state.reopenDraft = null;
      persistState();
      showProjectToast(`${step === "sales" ? "销售预测" : "供应计划"}已重新打开。`);
    }

    function approveWorkflowReview() {
      if (state.collaborationRole !== "admin" || state.workflow.supply.status !== "submitted") return;
      state.workflow.review = { ...state.workflow.review, status: "approved", time: "刚刚", note: "联合复核已完成" };
      state.workflow.publish = { ...state.workflow.publish, status: "in_progress", time: "刚刚", note: "可以发布正式快照" };
      state.workflow.status = "ready_to_publish";
      state.editorTab = "overview";
      addWorkflowEvent("联合复核已完成", workflowChangeScope("review"), "Julio", "complete");
      persistState();
      showProjectToast("联合复核已完成，可以发布正式版本。" );
    }

    function handleEditChange(event, finalize = true) {
      const target = event.target;
      const field = target.getAttribute("data-edit-field");
      if (!field) return;
      if (!canEditPlanField(field)) return;
      const model = target.getAttribute("data-model");
      const month = target.getAttribute("data-month");
      const product = state.products.find((item) => item.model === model);
      if (!product) return;
      product.plans[month] = product.plans[month] || { demand: 0, supply: 0 };
      if (target.value === "") return;
      const oldValue = target.getAttribute("data-original-value") ?? product.plans[month][field] ?? "";
      if (field === "demand" || field === "supply") {
        product.plans[month][field] = Number(target.value || 0);
      } else {
        product.plans[month][field] = target.value;
      }
      if (finalize && String(oldValue) !== String(product.plans[month][field])) {
        addCellRevision(model, month, field, oldValue, product.plans[month][field], "当前用户");
        upsertLiveChangeBatch(model, month, field, oldValue, product.plans[month][field]);
      }
      schedulePlanAutosave();
      if (finalize) setTimeout(render, 0);
    }

    function addCellRevision(model, month, field, before, after, user) {
      state.revisions.unshift({
        sku: model,
        month: monthLabel(month),
        field: planFieldLabel(field),
        before: String(before ?? ""),
        after: String(after ?? ""),
        user,
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      });
      state.revisions = state.revisions.slice(0, 60);
    }

    function upsertLiveChangeBatch(model, month, field, before, after) {
      const functionName = field === "demand" ? "sales" : "supply";
      const batchId = `live-${functionName}-2026-08`;
      let batch = state.changeBatches.find((item) => item.id === batchId);
      if (!batch) {
        batch = {
          id: batchId,
          title: functionName === "sales" ? "当前销售预测草稿" : "当前供应计划草稿",
          type: "monthly",
          function: functionName,
          status: "draft",
          owner: "当前用户",
          time: "刚刚",
          reason: "当前月度更新中尚未提交的修改",
          lines: []
        };
        state.changeBatches.unshift(batch);
      }
      const line = batch.lines.find((item) => item.sku === model && item.month === month && item.field === field);
      if (line) {
        line.after = Number(after || 0);
        line.reason = "直接编辑";
      } else {
        batch.lines.push({ sku: model, month, field, before: Number(before || 0), after: Number(after || 0), reason: "直接编辑" });
      }
      batch.time = "刚刚";
    }

    function handleFileChange(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const updated = applyGridText(String(reader.result || ""));
        showProjectToast(updated ? `已从CSV更新 ${updated} 个可写字段。` : "CSV中没有当前可编辑字段。");
      };
      reader.readAsText(file);
    }

    function applyGridText(text) {
      const lines = text.trim().split(/\r?\n/);
      let updated = 0;
      lines.forEach((line) => {
        const parts = line.split(/\t|,/).map((part) => part.trim());
        const [sku, rawMonth, demand, supply, comment] = parts;
        const month = MONTHS.find((item) => item.key === rawMonth || item.label === rawMonth || item.short === rawMonth || item.legacyLabel === rawMonth || item.legacyShort === rawMonth)?.key;
        const product = state.products.find((item) => item.model === sku);
        if (!product || !month) return;
        product.plans[month] = product.plans[month] || {};
        if (canEditPlanField("demand") && demand !== "" && demand !== undefined) {
          const before = Number(product.plans[month].demand || 0);
          const after = Number(demand);
          if (before !== after) {
            product.plans[month].demand = after;
            addCellRevision(sku, month, "demand", before, after, "批量导入");
            upsertLiveChangeBatch(sku, month, "demand", before, after);
            updated += 1;
          }
        }
        if (canEditPlanField("supply") && supply !== "" && supply !== undefined) {
          const before = Number(product.plans[month].supply || 0);
          const after = Number(supply);
          if (before !== after) {
            product.plans[month].supply = after;
            addCellRevision(sku, month, "supply", before, after, "批量导入");
            upsertLiveChangeBatch(sku, month, "supply", before, after);
            updated += 1;
          }
        }
        if (comment) product.plans[month].comment = comment;
      });
      schedulePlanAutosave();
      render();
      return updated;
    }

    async function saveDraft(showToast = true) {
      updateAutosaveStatus("sales-plan", "saving", "正在保存...");
      await connectors.saveDraft({ draftId: "aug-draft-v4", products: cloneProducts() });
      persistState();
      updateAutosaveStatus("sales-plan", "saved", "刚刚自动保存");
      if (showToast) showProjectToast("当前协同草稿已保存。" );
    }

    async function publishSnapshot() {
      if (state.collaborationRole !== "admin" || state.workflow.review.status !== "approved") {
        showProjectToast("仅总管理员可在联合复核完成后发布正式版本。");
        return;
      }
      await connectors.publishSnapshot({ products: cloneProducts(), note: "已发布8月至10月滚动计划" });
      state.workflow.publish = { ...state.workflow.publish, status: "published", time: "刚刚", note: "正式计划快照已发布" };
      state.workflow.status = "published";
      state.editorTab = "overview";
      state.editorDrawer = null;
      addWorkflowEvent("8月正式计划已发布", "已生成不可覆盖的正式版本快照", "Julio", "complete");
      persistState();
      showProjectToast("正式计划快照已发布，历史版本已生成。" );
    }

    async function syncHistory() {
      const result = await connectors.pullHistory("2026-07");
      state.historySynced = "2026年7月";
      state.revisions.unshift({
        sku: "SYSTEM",
        month: "2026年7月",
        field: "历史数据同步",
        before: "同步前",
        after: result.records.length + "条记录",
        user: "连接器",
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      });
      state.modal = null;
      persistState();
    }

    function jumpToException(button) {
      const model = button.getAttribute("data-model");
      const rawMonth = button.getAttribute("data-month");
      const month = rawMonth === "Recurring"
        ? allEnrichedProducts().find((product) => product.model === model)?.months.find((item) => item.gap < 0)?.key
        : rawMonth;
      state.highlighted = { model, month };
      state.view = "matrix";
      setTimeout(() => {
        const cell = document.querySelector(`[data-cell="${model}:${month}"]`);
        if (cell) cell.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
      }, 80);
    }

    function handleSalesEditorFormChange(event) {
      const target = event.target;
      const closingField = target.getAttribute("data-closing-field");
      if (closingField) {
        const model = target.getAttribute("data-model");
        state.closingDraft = state.closingDraft || {};
        state.closingDraft[model] = state.closingDraft[model] || {};
        state.closingDraft[model][closingField] = Math.max(0, Number(target.value || 0));
        scheduleAutosave("month-closing", () => persistState());
        return true;
      }
      const noteMonth = target.getAttribute("data-note-month");
      if (noteMonth) {
        const product = state.products.find((item) => item.model === target.getAttribute("data-model"));
        if (product) {
          product.plans[noteMonth] = product.plans[noteMonth] || { demand: 0, supply: 0 };
          product.plans[noteMonth].comment = target.value;
          schedulePlanAutosave();
        }
        return true;
      }
      if (target.id === "pasteArea") {
        state.pasteDraft = target.value;
        schedulePlanAutosave();
        return true;
      }
      const reopenField = target.getAttribute("data-reopen-field");
      if (reopenField) {
        state.reopenDraft = state.reopenDraft || {};
        state.reopenDraft[reopenField] = target.value;
        schedulePlanAutosave();
        return true;
      }
      const bulkField = target.getAttribute("data-bulk-field");
      if (bulkField) {
        state.bulkDraft = state.bulkDraft || {};
        state.bulkDraft[bulkField] = bulkField === "value" ? Number(target.value || 0) : target.value;
        schedulePlanAutosave();
        return true;
      }
      const tempField = target.getAttribute("data-temp-field");
      if (tempField) {
        state.temporaryChangeDraft = state.temporaryChangeDraft || {};
        state.temporaryChangeDraft[tempField] = tempField === "value" ? Number(target.value || 0) : target.value;
        schedulePlanAutosave();
        if (["model", "month", "field"].includes(tempField)) {
          const draft = state.temporaryChangeDraft;
          const product = state.products.find((item) => item.model === draft.model);
          draft.value = Number(product?.plans?.[draft.month]?.[draft.field] || 0);
          renderModal();
        }
        return true;
      }
      return false;
    }

    document.addEventListener("change", (event) => {
      if (event.target.id === "fileInput") {
        handleFileChange(event);
        return;
      }
      if (handleToolAccessChange(event)) return;
      if (handleProjectEditorFieldChange(event)) return;
      if (handleProjectFilterChange(event)) return;
      if (handleSalesEditorFormChange(event)) return;
      handleFilterChange(event);
      const field = event.target.getAttribute("data-edit-field");
      if (field) handleEditChange(event);
    });

    document.addEventListener("click", handleClick);

    let projectSearchTimer = null;
    let editorSearchTimer = null;
    document.addEventListener("input", (event) => {
      if (handleProjectEditorFieldChange(event)) return;
      if (event.target.hasAttribute("data-plan-input")) {
        handleEditChange(event, false);
        return;
      }
      if (event.target.getAttribute("data-editor-filter") === "search") {
        state.editorFilters.search = event.target.value;
        state.editorPage = 1;
        clearTimeout(editorSearchTimer);
        editorSearchTimer = setTimeout(() => {
          renderModal();
          const search = document.getElementById("editorSearch");
          if (search) {
            search.focus();
            search.setSelectionRange(search.value.length, search.value.length);
          }
        }, 120);
        return;
      }
      if (handleSalesEditorFormChange(event)) return;
      if (event.target.getAttribute("data-project-filter") !== "search") return;
      projectState.filters.search = event.target.value;
      clearTimeout(projectSearchTimer);
      projectSearchTimer = setTimeout(() => {
        persistProjectState();
        renderProjectModule();
        const search = document.getElementById("projectSearch");
        if (search) {
          search.focus();
          search.setSelectionRange(search.value.length, search.value.length);
        }
      }, 140);
    });

    document.addEventListener("keydown", (event) => {
      if (event.target.matches?.("[data-plan-input]") && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter"].includes(event.key)) {
        const input = event.target;
        const row = input.closest("tr");
        const rowInputs = Array.from(row?.querySelectorAll("[data-plan-input]") || []);
        const rows = Array.from(input.closest("tbody")?.querySelectorAll("tr") || []);
        const rowIndex = rows.indexOf(row);
        const columnIndex = rowInputs.indexOf(input);
        let next = null;
        if (event.key === "ArrowLeft") next = rowInputs[columnIndex - 1];
        if (event.key === "ArrowRight") next = rowInputs[columnIndex + 1];
        if (event.key === "ArrowUp") next = rows[rowIndex - 1]?.querySelectorAll("[data-plan-input]")[columnIndex];
        if (["ArrowDown", "Enter"].includes(event.key)) next = rows[rowIndex + 1]?.querySelectorAll("[data-plan-input]")[columnIndex];
        if (next) {
          event.preventDefault();
          next.focus();
          next.select();
          return;
        }
      }
      if (event.key === "Escape" && projectState.adminModal) {
        flushActiveProjectAutosave();
        projectState.adminModal = null;
        projectState.editorDraft = null;
        projectState.permissionDraft = null;
        projectState.newProjectDraft = null;
        projectState.delayDraft = null;
        projectState.transitionDraft = null;
        renderProjectAdminModal();
        return;
      }
      if (event.key === "Escape" && projectState.selectedProjectId) {
        projectState.selectedProjectId = null;
        projectState.selectedWorkstream = null;
        renderProjectDrawer(null);
        return;
      }
      if (event.key === "Escape" && state.modal) {
        if (state.editorDrawer) {
          flushAutosave("sales-plan");
          state.editorDrawer = null;
          renderModal();
          return;
        }
        flushAutosave(state.modal === "closing" ? "month-closing" : "sales-plan");
        state.modal = null;
        render();
      }
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s" && state.modal === "editor") {
        event.preventDefault();
        saveDraft().then(render);
      }
    });

    renderApp();
    if (window.cloudStore?.enabled) {
      if (!window.cloudStore.hasDocument(STORAGE_KEY)) persistState();
      if (!window.cloudStore.hasDocument(PROJECT_STORAGE_KEY)) persistProjectState();
      if (!window.cloudStore.hasDocument(PROJECT_DATA_STORAGE_KEY)) persistProjectData();
      if (!window.cloudStore.hasDocument(PROJECT_ACCESS_STORAGE_KEY)) persistProjectUsers();
      else if (cloudIdentityNeedsSync) persistProjectUsers();
      if (!window.cloudStore.hasDocument(PROJECT_DRAFT_STORAGE_KEY)) persistProjectDrafts();
      if (!window.cloudStore.hasDocument(PROJECT_FORM_DRAFT_STORAGE_KEY)) persistProjectFormDrafts();
      window.cloudStore.captureAll();
    }
    })();
  </script>
</body>
</html>
