<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产销计划管理工具</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-soft: #fbfcff;
      --line: #dce3ef;
      --line-strong: #c7d2e2;
      --text: #172033;
      --muted: #65738a;
      --soft: #8a97aa;
      --blue: #225be8;
      --blue-soft: #edf3ff;
      --green: #11845b;
      --green-soft: #eaf8f1;
      --red: #e4232f;
      --red-soft: #fff0f1;
      --orange: #d96a00;
      --orange-soft: #fff5e8;
      --shadow: 0 18px 48px rgba(26, 36, 55, 0.16);
      --radius: 8px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .app {
      min-width: 1080px;
      padding: 10px 12px 14px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      letter-spacing: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 10px;
      white-space: nowrap;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .filterbar {
      display: flex;
      align-items: end;
      gap: 7px;
      padding: 8px 10px;
      margin-bottom: 8px;
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .filterbar .toggle {
      flex: 0 0 auto;
    }

    .control {
      display: grid;
      gap: 3px;
      min-width: 108px;
      flex: 0 0 auto;
    }

    .control label {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    select,
    .btn,
    .segmented,
    .toggle {
      border: 1px solid var(--line-strong);
      background: var(--panel);
      border-radius: 6px;
      min-height: 30px;
    }

    select {
      padding: 0 26px 0 8px;
      color: var(--text);
      font-size: 11px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 10px;
      color: var(--text);
      font-weight: 700;
      font-size: 11px;
      white-space: nowrap;
    }

    .btn:hover,
    select:hover,
    .segmented button:hover {
      border-color: #9fb1cd;
      background: #fcfdff;
    }

    .btn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .btn.subtle {
      background: var(--blue-soft);
      border-color: #bdd0ff;
      color: var(--blue);
    }

    .btn.danger {
      background: #fff8f8;
      border-color: #ffb4b6;
      color: var(--red);
    }

    .segmented {
      display: inline-flex;
      overflow: hidden;
    }

    .segmented button {
      min-width: 48px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 0 9px;
      font-weight: 700;
      font-size: 11px;
    }

    .segmented button:last-child {
      border-right: 0;
    }

    .segmented button.active {
      background: var(--blue);
      color: #fff;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
      border-color: transparent;
      background: transparent;
      color: var(--text);
      white-space: nowrap;
      font-size: 11px;
    }

    .switch {
      width: 30px;
      height: 16px;
      border-radius: 999px;
      background: #cbd4e1;
      position: relative;
      flex: 0 0 auto;
    }

    .switch::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      top: 2px;
      left: 2px;
      border-radius: 50%;
      background: #fff;
      transition: transform 160ms ease;
    }

    .toggle.active .switch {
      background: var(--blue);
    }

    .toggle.active .switch::after {
      transform: translateX(14px);
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .kpi {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 11px;
      min-height: 68px;
      display: grid;
      gap: 2px;
    }

    .kpi-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 9px;
      font-weight: 800;
    }

    .kpi-value {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .delta {
      font-size: 10px;
      border-radius: 999px;
      padding: 2px 6px;
      font-weight: 800;
      background: var(--red-soft);
      color: var(--red);
    }

    .kpi-foot {
      color: var(--muted);
      font-size: 10px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 316px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      gap: 10px;
    }

    .panel-title {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-weight: 800;
      font-size: 10px;
      margin-left: 4px;
    }

    .chips {
      display: flex;
      gap: 5px;
      padding: 7px 9px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }

    .chip {
      min-height: 24px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--panel);
      color: var(--blue);
      padding: 0 7px;
      font-weight: 800;
      font-size: 10px;
    }

    .chip.active {
      color: var(--blue);
      border-color: #9ab6f5;
      background: #f2f6ff;
    }

    .chip.danger {
      color: var(--red);
      border-color: #ffbdc1;
      background: #fff8f8;
    }

    .chip.warn {
      color: var(--orange);
      border-color: #ffc780;
      background: #fffaf2;
    }

    .matrix-table,
    .history-table,
    .edit-grid,
    .archive-table,
    .heatmap-table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      vertical-align: middle;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    th {
      background: #f8fafd;
      color: #52617a;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.03em;
      font-weight: 800;
      padding: 7px 5px;
      text-align: center;
    }

    .exception-panel {
      position: sticky;
      top: 8px;
    }

    .exception-summary {
      color: var(--muted);
      font-size: 9px;
      white-space: nowrap;
    }

    .exception-list {
      max-height: calc(100vh - 250px);
      min-height: 280px;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }

    .exception-item {
      width: 100%;
      display: grid;
      gap: 4px;
      padding: 8px 10px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      text-align: left;
      transition: background 140ms ease;
    }

    .exception-item:hover,
    .exception-item:focus-visible {
      background: #f7faff;
      outline: 0;
    }

    .exception-item:last-child {
      border-bottom: 0;
    }

    .exception-topline,
    .exception-mainline,
    .exception-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .exception-type {
      display: inline-flex;
      align-items: center;
      min-height: 18px;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 9px;
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
      border: 1px solid currentColor;
      white-space: nowrap;
    }

    .type-stockout,
    .type-1st-batch-risk {
      color: var(--red);
      background: #fff7f7;
    }

    .type-gap,
    .type-1st-batch-watch {
      color: var(--orange);
      background: #fff9f1;
    }

    .type-1st-batch-ok {
      color: var(--green);
      background: #f4fff9;
    }

    .exception-month {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .exception-mainline .sku-main {
      min-width: 0;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .exception-issue {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 900;
    }

    .exception-metrics {
      justify-content: flex-start;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .exception-metrics span {
      white-space: nowrap;
    }

    .exception-empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
    }

    .sku-main {
      font-weight: 800;
      color: var(--text);
      font-size: 11px;
    }

    .sku-sub {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
      margin-top: 2px;
    }

    .issue-main {
      font-weight: 800;
    }

    .issue-main.negative {
      color: var(--red);
    }

    .issue-main.warn {
      color: var(--orange);
    }

    .issue-main.ok {
      color: var(--green);
    }

    .view-shell {
      display: none;
    }

    .view-shell.active {
      display: block;
    }

    .matrix-wrap {
      overflow-x: auto;
    }

    .matrix-table {
      min-width: 1020px;
      table-layout: fixed;
    }

    .matrix-table td {
      padding: 6px 5px;
      text-align: center;
      height: 66px;
    }

    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--panel);
    }

    .sticky-product {
      position: sticky;
      left: 78px;
      z-index: 2;
      background: var(--panel);
    }

    th.sticky-col,
    th.sticky-product {
      z-index: 3;
      background: #f8fafd;
    }

    .model-cell {
      width: 78px;
      font-weight: 900;
    }

    .product-cell {
      width: 126px;
      text-align: left;
    }

    .small-col {
      width: 72px;
    }

    .month-col {
      width: 118px;
    }

    .total-col {
      width: 122px;
      background: #eef3fb;
      border-left: 2px solid #b8c7dd;
    }

    .risk-col {
      width: 74px;
    }

    .lifecycle-pill,
    .risk-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      border-radius: 5px;
      padding: 3px 5px;
      border: 1px solid var(--line-strong);
      font-weight: 800;
      font-size: 10px;
    }

    .lifecycle-pill.new {
      background: var(--green-soft);
      color: var(--green);
      border-color: #b9dfcd;
    }

    .lifecycle-pill.launched {
      background: var(--blue-soft);
      color: var(--blue);
      border-color: #bfd0ff;
    }

    .risk-pill.stockout,
    .risk-pill.high {
      background: #fff8f8;
      border-color: #ffaaa8;
      color: var(--red);
    }

    .risk-pill.watch {
      background: #fffaf2;
      border-color: #ffc780;
      color: var(--orange);
    }

    .risk-pill.low {
      background: var(--green-soft);
      border-color: #b9dfcd;
      color: var(--green);
    }

    .month-card {
      position: relative;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 6px;
      padding: 6px 7px;
      min-height: 56px;
      display: grid;
      gap: 2px;
    }

    .month-card.severe {
      border-color: #ffb4b6;
      background: var(--red-soft);
    }

    .month-card.warn {
      border-color: #ffd09a;
      background: var(--orange-soft);
    }

    .month-card.ok {
      border-color: #cae9da;
      background: #fbfffd;
    }

    .month-card.first-batch::before {
      content: "";
      position: absolute;
      z-index: 1;
      top: -1px;
      right: -1px;
      left: -1px;
      height: 4px;
      border-radius: 6px 6px 0 0;
      background: var(--fb-color);
    }

    .month-card.first-batch.fb-risk {
      --fb-color: var(--red);
    }

    .month-card.first-batch.fb-watch {
      --fb-color: var(--orange);
    }

    .month-card.first-batch.fb-ok {
      --fb-color: var(--green);
    }

    .month-card.total-card {
      background: #f4f7fc;
      border-color: #b8c7dd;
      align-content: center;
    }

    .metric-line {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      line-height: 1.1;
    }

    .metric-line .label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      min-width: 22px;
    }

    .metric-line .value {
      color: var(--text);
      font-weight: 800;
      font-size: 11px;
    }

    .metric-line.gap .label,
    .metric-line.gap .value {
      font-size: 11px;
      color: var(--red);
      font-weight: 900;
    }

    .metric-line.gap.positive .label,
    .metric-line.gap.positive .value,
    .metric-line.eoh.positive .label,
    .metric-line.eoh.positive .value {
      color: var(--green);
    }

    .metric-line.eoh .label,
    .metric-line.eoh .value {
      color: var(--red);
      font-weight: 900;
    }

    .fb-edge-key {
      width: 28px;
      height: 13px;
      border: 1px solid var(--line-strong);
      border-top: 4px solid currentColor;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 5px;
      background: #fff;
      vertical-align: middle;
    }

    .fb-edge-key.risk {
      color: var(--red);
    }

    .fb-edge-key.watch {
      color: var(--orange);
    }

    .fb-edge-key.ok {
      color: var(--green);
    }

    .matrix-total-row td {
      background: #eef3fb;
      border-top: 2px solid #9fb1cd;
      border-bottom: 0;
      font-weight: 800;
    }

    .matrix-total-row .sticky-col,
    .matrix-total-row .sticky-product {
      background: #eef3fb;
      z-index: 3;
    }

    .total-label {
      color: #17305f;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .number-negative {
      color: var(--red);
      font-weight: 900;
    }

    .number-positive {
      color: var(--green);
      font-weight: 900;
    }

    .highlight-cell {
      outline: 3px solid rgba(34, 91, 232, 0.35);
      outline-offset: 2px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 9px;
      flex-wrap: wrap;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .trend-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(430px, 0.85fr);
      gap: 8px;
    }

    .chart-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      min-height: 250px;
    }

    .chart-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }

    .chart-title h3 {
      margin: 0;
      font-size: 13px;
    }

    .chart-note {
      color: var(--muted);
      font-size: 10px;
    }

    svg text {
      font-family: inherit;
    }

    .heatmap-table td,
    .heatmap-table th {
      padding: 7px 6px;
      text-align: center;
    }

    .heatmap-table .sku-col {
      text-align: left;
      font-weight: 900;
      width: 96px;
    }

    .heat-severe {
      background: #ffd7d9;
      color: var(--red);
      font-weight: 900;
    }

    .heat-warn {
      background: #ffefd9;
      color: var(--orange);
      font-weight: 900;
    }

    .heat-ok {
      background: #e9f8f1;
      color: var(--green);
      font-weight: 900;
    }

    .heat-first-batch {
      box-shadow: inset 0 4px var(--fb-color);
    }

    .heat-first-batch.fb-risk {
      --fb-color: var(--red);
    }

    .heat-first-batch.fb-watch {
      --fb-color: var(--orange);
    }

    .heat-first-batch.fb-ok {
      --fb-color: var(--green);
    }

    .action-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .action-card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 9px;
      display: grid;
      gap: 3px;
    }

    .action-card.high {
      border-color: #ffb4b6;
      background: #fff8f8;
    }

    .action-card.medium {
      border-color: #ffd09a;
      background: #fffaf4;
    }

    .action-rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-weight: 900;
      margin-right: 5px;
    }

    .action-head {
      font-weight: 900;
      color: var(--text);
    }

    .action-copy {
      color: var(--muted);
      font-size: 10px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 31, 49, 0.2);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      width: min(820px, 92vw);
      max-height: 88vh;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .modal.large {
      width: min(980px, 94vw);
    }

    .modal.planner-modal {
      width: min(1480px, calc(100vw - 40px));
      height: min(760px, 94vh);
      max-height: 94vh;
      flex: 0 0 auto;
    }

    .planner-modal .modal-body {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }

    .planner-context {
      flex: 0 0 auto;
      padding: 8px 12px 0;
      border-bottom: 1px solid var(--line);
      background: #fbfcff;
    }

    .planner-context .meta-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin-bottom: 5px;
    }

    .planner-context .meta-box {
      padding: 3px 7px;
    }

    .planner-context .tabs {
      margin-bottom: 0;
    }

    .planner-tab-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 9px 12px 12px;
    }

    .editor-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 6px;

      line-height: 1.4;
    }

    .template-grid {

      grid-template-columns: repeat(3, minmax(0, 1fr));

    }

      display: grid;
      gap: 4px;
      min-height: 72px;
      padding: 9px 10px 9px 32px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }

      background: var(--blue-soft);
      box-shadow: 0 0 0 1px rgba(34, 91, 232, 0.08);
    }

    .template-option input {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 14px;
      height: 14px;
      min-height: 0;
      accent-color: var(--blue);

    }

    .template-option span {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.4;
    }

      bottom: 18px;

      border-radius: 6px;
      background: #172033;
      color: #fff;
      box-shadow: var(--shadow);
      font-size: 10px;
      font-weight: 800;

    function updateAutosaveStatus(scope, status, text) {
      const entry = autosaveEntry(scope);
      entry.status = status;
      entry.text = text;
      document.querySelectorAll(`[data-autosave-status="${scope}"]`).forEach((node) => {
        node.classList.remove("saving", "saved", "error");
        node.classList.add(status);
        const label = node.querySelector("[data-autosave-text]");
        if (label) label.textContent = text;
      });
    }

    async function performAutosave(scope) {
      const entry = autosaveEntry(scope);
      const saver = entry.saver;
      entry.timer = null;
      if (!saver) return;
      updateAutosaveStatus(scope, "saving", "正在保存...");
      try {
        await saver();
        if (!entry.timer && entry.saver === saver) updateAutosaveStatus(scope, "saved", "刚刚自动保存");
      } catch (error) {
        updateAutosaveStatus(scope, "error", "自动保存失败");
      }
    }

    function scheduleAutosave(scope, saver, delay = 450) {
      const entry = autosaveEntry(scope);
      if (entry.timer) clearTimeout(entry.timer);
      entry.saver = saver;
      updateAutosaveStatus(scope, "saving", "等待自动保存...");
      entry.timer = setTimeout(() => performAutosave(scope), delay);
    }

    async function flushAutosave(scope) {
      const entry = autosaveEntry(scope);
      if (!entry.timer) return;
      clearTimeout(entry.timer);
      entry.timer = null;
      await performAutosave(scope);
    }

    function projectCloseoutProgress(project) {
      const activeStreams = PROJECT_WORKSTREAMS.map((meta) => project.workstreams[meta.key]).filter((stream) => stream && stream.health !== "grey");
      const remaining = activeStreams.reduce((sum, stream) => sum + Math.max(0, Number(stream.total || 0) - Number(stream.done || 0)), 0);
      const blockers = activeStreams.reduce((sum, stream) => sum + stream.tasks.filter((task) => task.status === "Blocked").length, 0);
      return { remaining, blockers, ready: remaining === 0 && blockers === 0 };
    }

    function buildProjectDelayPreview(project, draft) {
      if (!project || !draft) return null;
      const anchorIndex = Math.max(0, PROJECT_GATES.indexOf(draft.anchorGate));
      const oldAnchorDate = projectGateISO(project, anchorIndex);
      const delayDays = projectDelayDays(oldAnchorDate, draft.newDate);
      const gateIndexes = draft.propagation === "anchor_only"
        ? [anchorIndex]
        : PROJECT_GATES.map((gate, index) => index).filter((index) => index >= anchorIndex);
      const gateChanges = gateIndexes.map((index) => {
        const oldDate = projectGateISO(project, index);
        return { entityType: "gate", entityId: PROJECT_GATES[index], index, label: projectStageLabel(PROJECT_GATES[index]), oldDate, newDate: shiftProjectISO(oldDate, delayDays) };
      });
      const workstreamChanges = [];
      const taskChanges = [];
      if (draft.propagation === "all_downstream") {
        const sourceWorkstreamIndex = PROJECT_WORKSTREAMS.findIndex((meta) => meta.key === draft.sourceWorkstream);
        PROJECT_WORKSTREAMS.forEach((meta, workstreamIndex) => {
          const stream = project.workstreams[meta.key];
          if (!stream || stream.health === "grey" || stream.done >= stream.total) return;
          const oldDate = stream.dueISO || projectDueToISO(stream.due);
          const isDownstreamWorkstream = sourceWorkstreamIndex >= 0 && workstreamIndex >= sourceWorkstreamIndex;
          if (!isDownstreamWorkstream && oldDate < oldAnchorDate) return;
          workstreamChanges.push({ entityType: "workstream", entityId: meta.key, label: meta.label, oldDate, newDate: shiftProjectISO(oldDate, delayDays) });
          stream.tasks.forEach((task, taskIndex) => {
            if (task.status === "Completed") return;
            const taskOldDate = task.dueISO || projectDueToISO(task.due);
            if (!isDownstreamWorkstream && taskOldDate < oldAnchorDate) return;
            taskChanges.push({ entityType: "task", entityId: `${meta.key}:${taskIndex}`, workstreamKey: meta.key, taskIndex, label: projectText(task.name), oldDate: taskOldDate, newDate: shiftProjectISO(taskOldDate, delayDays) });
          });
        });
      }
      const launchChange = gateChanges.find((item) => item.entityId === "Launch");
      return {
        anchorIndex,
        oldAnchorDate,
        delayDays,
        gateChanges,
        workstreamChanges,
        taskChanges,
        oldLaunchDate: project.launchDate,
        newLaunchDate: launchChange?.newDate || project.launchDate,
        allChanges: [...gateChanges, ...workstreamChanges, ...taskChanges]
      };
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(value);
    }

    function compact(value) {
      const abs = Math.abs(value);
      if (abs >= 1000) {
        const rounded = Math.round((value / 1000) * 10) / 10;
        return rounded.toFixed(Math.abs(rounded) >= 10 || Number.isInteger(rounded) ? 0 : 1) + "K";
      }
      return String(value);
    }

    function signed(value) {
      if (value > 0) return "+" + compact(value);
      return compact(value);
    }

    function monthLabel(key) {
      return MONTHS.find((month) => month.key === key)?.label || key;
    }

    function firstBatchMonth(product) {
      if (product.lifecycle !== "New") return null;
      const match = MONTHS.find((month) => Number(product.plans[month.key]?.supply || 0) > 0);
      return match ? match.key : null;
    }

    function enrichedProduct(product) {
      let eoh = Number(product.currentInventory || 0);
      const fbMonth = firstBatchMonth(product);
      const months = MONTHS.map((month) => {
        const plan = product.plans[month.key] || { demand: 0, supply: 0 };
        const demand = Number(plan.demand || 0);
        const supply = Number(plan.supply || 0);
        const gap = supply - demand;
        eoh += gap;
        const isFirstBatch = product.lifecycle === "New" && fbMonth === month.key;
        const fbStatus = isFirstBatch ? firstBatchStatus(gap, eoh) : null;
        return {
          key: month.key,
          label: month.label,
          demand,
          supply,
          gap,
          eoh,
          isFirstBatch,
          fbStatus
        };
      });
      const totalDemand = months.reduce((sum, item) => sum + item.demand, 0);
      const totalSupply = months.reduce((sum, item) => sum + item.supply, 0);
      const totalGap = totalSupply - totalDemand;
      const minEoh = Math.min(...months.map((item) => item.eoh));
      const severeGap = months.some((item) => item.gap < 0 && Math.abs(item.gap) >= Math.max(100, item.demand * 0.1));
      const recurringGap = months.filter((item) => item.gap < 0).length >= 2;
      const risk = minEoh < 0 ? "Stockout" : severeGap || recurringGap ? "High" : totalGap < 0 ? "Watch" : "Low";
      return {
        ...product,
        months,
        totalDemand,
        totalSupply,
        totalGap,
        minEoh,
        risk
      };
    }

    function firstBatchStatus(gap, eoh) {
      if (gap <= -100 || eoh < 0) return "risk";
      if (gap < 0) return "watch";
      return "ok";
    }

    function filteredProducts() {
      return state.products.map(enrichedProduct).filter((product) => {
        if (state.filters.model !== "All Models" && product.model !== state.filters.model) return false;
        if (state.filters.category !== "All Categories" && product.category !== state.filters.category) return false;
        if (state.filters.lifecycle !== "All" && product.lifecycle !== state.filters.lifecycle) return false;
        if (state.filters.onlyGap && !product.months.some((month) => month.gap < 0 || month.eoh < 0)) return false;
        if (state.filters.firstBatchOnly && !(product.lifecycle === "New" && product.months.some((month) => month.isFirstBatch))) return false;
        return true;
      });
    }

    function allEnrichedProducts() {
      return state.products.map(enrichedProduct);
    }

    function kpiData(products) {
      const demand = products.reduce((sum, product) => sum + product.totalDemand, 0);
      const supply = products.reduce((sum, product) => sum + product.totalSupply, 0);
      const monthly = MONTHS.map((month) => {
        const monthDemand = products.reduce((sum, product) => {
          const item = product.months.find((entry) => entry.key === month.key);
          return sum + (item?.demand || 0);
        }, 0);
        const monthSupply = products.reduce((sum, product) => {
          const item = product.months.find((entry) => entry.key === month.key);
          return sum + (item?.supply || 0);
        }, 0);
        return { ...month, demand: monthDemand, supply: monthSupply, gap: monthSupply - monthDemand };
      });
      const worst = monthly.reduce((current, item) => (item.gap < current.gap ? item : current), monthly[0]);
      const stockoutSku = products.filter((product) => product.months.some((month) => month.eoh < 0)).length;
      return { demand, supply, gap: supply - demand, monthly, worst, stockoutSku };
    }

    function exceptionRows(products) {
      const rows = [];
      products.forEach((product) => {
        const stockout = product.months.find((month) => month.eoh < 0);
        if (stockout) {
          rows.push({
            type: "Stockout",
            priority: 1,
            model: product.model,
            name: product.name,
            lifecycle: product.lifecycle,
            month: stockout.key,
            issue: "EOH " + signed(stockout.eoh),
            detail: "缺货风险",
            demand: stockout.demand,
            supply: stockout.supply,
            gap: stockout.gap,
            eoh: stockout.eoh
          });
        }
        product.months.forEach((month) => {
          if (month.isFirstBatch) {
            const type = month.fbStatus === "risk" ? "1st Batch Risk" : month.fbStatus === "watch" ? "1st Batch Watch" : "1st Batch OK";
            rows.push({
              type,
              priority: month.fbStatus === "risk" ? 2 : 4,
              model: product.model,
              name: product.name,
              lifecycle: product.lifecycle,
              month: month.key,
              issue: month.fbStatus === "ok" ? "首批正常" : "供需差 " + signed(month.gap),
              detail: month.fbStatus === "ok" ? "首批供需正常" : "检查首批供需",
              demand: month.demand,
              supply: month.supply,
              gap: month.gap,
              eoh: month.eoh
            });
          }
        });
        const negativeMonths = product.months.filter((month) => month.gap < 0);
        if (negativeMonths.length >= 2) {
          const worstMonth = negativeMonths.reduce((worst, month) => month.gap < worst.gap ? month : worst, negativeMonths[0]);
          rows.push({
            type: "Gap",
            priority: 3,
            model: product.model,
            name: product.name,
            lifecycle: product.lifecycle,
            month: worstMonth.key,
            issue: "供需差 " + signed(worstMonth.gap),
            detail: `${MONTHS.length}个月中有${negativeMonths.length}个月供应低于需求`,
            demand: worstMonth.demand,
            supply: worstMonth.supply,
            gap: worstMonth.gap,
            eoh: worstMonth.eoh
          });
        }
      });
      return rows.sort((a, b) => a.priority - b.priority || a.model.localeCompare(b.model));
    }

    function setValueChainOutput(key, value) {

    function calculateValueChainFromDom() {
      const inputs = Array.from(document.querySelectorAll("[data-vc-input]"));
      if (!inputs.length) return;
      const values = Object.fromEntries(inputs.map((input) => [input.getAttribute("data-vc-input"), Number(input.value || 0)]));
      const rrp = Math.max(0, values.rrp);
      const discountRate = Math.min(100, Math.max(0, values.discount)) / 100;
      const vatRate = Math.max(0, values.vat) / 100;
      const channelRate = Math.min(100, Math.max(0, values.channel)) / 100;
      const consumerPrice = rrp * (1 - discountRate);
      const discountValue = rrp - consumerPrice;
      const netConsumer = consumerPrice / (1 + vatRate);
      const vatValue = consumerPrice - netConsumer;
      const channelValue = netConsumer * channelRate;
      const netRevenue = netConsumer - channelValue;
      const product = Math.max(0, values.product);
      const logistics = Math.max(0, values.logistics);
      const warranty = Math.max(0, values.warranty);
      const marketing = Math.max(0, values.marketing);
      const variableCost = product + logistics + warranty + marketing;
      const contribution = netRevenue - variableCost;
      const margin = netRevenue ? contribution / netRevenue * 100 : 0;
      const money = (value) => `${value < 0 ? "-" : ""}EUR ${Math.abs(value).toFixed(2)}`;
      const cost = (value) => `-EUR ${Math.abs(value).toFixed(2)}`;
      const share = (value) => `${(netRevenue ? value / netRevenue * 100 : 0).toFixed(1)}%`;
      setValueChainOutput("consumer-price", money(consumerPrice));
      setValueChainOutput("variable-cost", money(variableCost));
      setValueChainOutput("rrp", money(rrp));
      setValueChainOutput("discount-value", cost(discountValue));
      setValueChainOutput("discount-share", share(discountValue));
      setValueChainOutput("vat-value", cost(vatValue));
      setValueChainOutput("vat-share", share(vatValue));
      setValueChainOutput("net-consumer", money(netConsumer));
      setValueChainOutput("net-consumer-share", share(netConsumer));
      setValueChainOutput("channel-value", cost(channelValue));
      setValueChainOutput("channel-share", share(channelValue));
      setValueChainOutput("net-revenue", money(netRevenue));
      setValueChainOutput("product-value", cost(product));
      setValueChainOutput("product-share", share(product));
      setValueChainOutput("logistics-value", cost(logistics));
      setValueChainOutput("logistics-share", share(logistics));
      setValueChainOutput("warranty-value", cost(warranty));
      setValueChainOutput("warranty-share", share(warranty));
      setValueChainOutput("marketing-value", cost(marketing));
      setValueChainOutput("marketing-share", share(marketing));
      setValueChainOutput("contribution", money(contribution));
      setValueChainOutput("margin", `${margin.toFixed(1)}%`);
      document.querySelectorAll('[data-vc-output="contribution"], [data-vc-output="margin"]').forEach((node) => {
        node.classList.toggle("number-negative", contribution < 0);
        node.classList.toggle("number-positive", contribution >= 0);
      });
    }

    function loadMarketingAssetsState() {
      const defaults = structuredClone(seedMarketingAssets);
      try {
        const saved = JSON.parse(localStorage.getItem(MARKETING_ASSET_STORAGE_KEY) || "null");
        if (!saved) return defaults;
        const savedProjects = Array.isArray(saved.projects) ? saved.projects : [];
        const projects = defaults.projects.map((project) => {
          const stored = savedProjects.find((item) => item.model === project.model);
          return stored ? {
            ...project,
            ...stored,
            assets: { ...project.assets, ...(stored.assets || {}) },
            special: { ...project.special, ...(stored.special || {}) }
          } : project;
        });
        savedProjects.forEach((project) => {
          if (!projects.some((item) => item.model === project.model)) projects.push(project);
        });
        return {
          ...defaults,
          ...saved,
          filters: { ...defaults.filters, ...(saved.filters || {}) },
          specialMaterials: Array.isArray(saved.specialMaterials) ? saved.specialMaterials : defaults.specialMaterials,
          projects,
          modal: null,
          draft: null
        };
      } catch (error) {
        return defaults;
      }
    }

    function syncMarketingAssetProjectsFromTracking() {
      if (!projectState?.projects?.length) return;
      const existing = marketingAssetsState.projects || [];
      const used = new Set();
      let changed = false;
      const synced = projectState.projects.map((source) => {
        const current = existing.find((item) => item.projectId === source.id)
          || existing.find((item) => !used.has(item) && item.model === source.model);
        if (!current) {
          changed = true;
          return createMarketingAssetProject(source);
        }
        used.add(current);
        const meta = {
          projectId: source.id,
          model: source.model,
          name: source.name,
          launchDate: source.launchDate,
          stage: source.stage,
          lifecycleStatus: projectLifecycleStatus(source),
          synced: true
        };
        if (Object.entries(meta).some(([key, value]) => current[key] !== value)) changed = true;
        return { ...current, ...meta };
      });
      const retained = existing.filter((item) => !used.has(item) && !synced.some((project) => project === item || project.model === item.model)).map((item) => {
        if (item.synced !== false) changed = true;
        return { ...item, synced: false };
      });
      const next = [...synced, ...retained];
      if (next.length !== existing.length || next.some((item, index) => {
        const previous = existing[index];
        return !previous || (item.projectId || item.model) !== (previous.projectId || previous.model);
      })) changed = true;
      marketingAssetsState.projects = next;
      if (changed) persistMarketingAssets();
    }

    function marketingAssetProjectItems(project) {
      const standard = STANDARD_MARKETING_ASSET_TYPES.map((type) => ({ ...type, item: project.assets?.[type.key] || null, special: false }));
      const special = marketingAssetsState.specialMaterials.map((type) => ({ key: type.id, name: activeLocale === "en-GB" ? type.nameEn : type.nameZh, item: project.special?.[type.id] || null, special: true }));
      return [...standard, ...special];
    }

    function marketingAssetProjectMetrics(project) {
      const configured = marketingAssetProjectItems(project).filter((entry) => entry.item);
      const done = configured.filter((entry) => entry.item.status === "done").length;
      const missing = configured.filter((entry) => entry.item.status === "missing").length;
      const overdue = configured.filter((entry) => entry.item.status === "overdue").length;
      const attention = configured.filter((entry) => ["in_progress", "review"].includes(entry.item.status)).length;
      const notStarted = configured.filter((entry) => entry.item.status === "not_started").length;
      const progress = configured.length ? Math.round(configured.reduce((sum, entry) => sum + Number(entry.item.progress || 0), 0) / configured.length) : 0;
      const health = overdue || missing ? "Risk" : attention ? "Warning" : "On Track";
      return { configured: configured.length, done, missing, overdue, attention, notStarted, progress, health };
    }

    function filteredMarketingAssetProjects() {
      const filters = marketingAssetsState.filters;
      const query = String(filters.search || "").trim().toLowerCase();
      return activeMarketingAssetProjects().filter((project) => {
        const metrics = marketingAssetProjectMetrics(project);
        const items = marketingAssetProjectItems(project).filter((entry) => entry.item);
        if (query && !`${project.model} ${project.name}`.toLowerCase().includes(query)) return false;
        if (filters.launchMonth !== "All" && !project.launchDate.startsWith(filters.launchMonth)) return false;
        if (filters.stage !== "All" && project.stage !== filters.stage) return false;
        if (filters.owner !== "All" && !items.some((entry) => entry.item.owner === filters.owner)) return false;
        if (filters.health !== "All" && metrics.health !== filters.health) return false;
        return true;

      const entries = marketingAssetProjectItems(source).filter((entry) => entry.item);
      const metrics = marketingAssetProjectMetrics(source);
      const open = entries.filter((entry) => entry.item.status !== "done").sort((a, b) => String(a.item.ddl || "9999").localeCompare(String(b.item.ddl || "9999")));
      const risk = entries.filter((entry) => ["missing", "overdue"].includes(entry.item.status));
      const next = open[0];
      stream.done = metrics.done;
      stream.total = metrics.configured;
      stream.health = risk.length ? "red" : metrics.attention ? "amber" : metrics.configured ? "green" : "grey";
      stream.owner = next?.item.owner || entries[0]?.item.owner || stream.owner;
      stream.dueISO = next?.item.ddl || stream.dueISO;
      stream.due = projectISOToDue(stream.dueISO);
      stream.blocker = risk.map((entry) => marketingAssetMaterialName(entry.key, entry.special)).join(", ");
      stream.nextAction = next ? `${marketingAssetMaterialName(next.key, next.special)} · ${next.item.owner || "--"}` : marketAssetsText("全部物料已完成", "All materials completed");
      stream.tasks = entries.map((entry) => ({
        name: marketingAssetMaterialName(entry.key, entry.special),
        status: { done: "Completed", in_progress: "In Progress", review: "In Review", missing: "Blocked", overdue: "Blocked", not_started: "Not Started" }[entry.item.status] || "Not Started",
        owner: entry.item.owner,
        dueISO: entry.item.ddl,
        due: projectISOToDue(entry.item.ddl),
        critical: ["missing", "overdue"].includes(entry.item.status)
      }));
      project.updated = "just now";
      persistProjectData();
    }

    function saveMarketingAssetItem() {
      if (!canEditMarketingAssets()) return;
      const draft = marketingAssetsState.draft;
      const project = marketingAssetsState.projects.find((item) => item.model === draft?.model);
      if (!draft || !project) return;
      if (!draft.owner.trim() || !draft.ddl) {
        showProjectToast(marketAssetsText("请填写负责人和DDL。", "Enter an owner and DDL."));
        return;
      }
      const item = {
        status: draft.status,
        progress: Math.max(0, Math.min(100, Number(draft.progress || 0))),
        ddl: draft.ddl,
        owner: draft.owner.trim(),
        note: draft.note.trim()
      };
      if (item.status === "done") item.progress = 100;
      if (["not_started", "missing"].includes(item.status) && item.progress < 0) item.progress = 0;
      if (draft.special) {
        project.special = project.special || {};
        project.special[draft.key] = item;
      } else {
        project.assets[draft.key] = item;
      }
      persistMarketingAssets();
      syncMarketingAssetProject(project.model);
      clearMarketingAssetDraft();
      marketingAssetsState.modal = null;
      marketingAssetsState.draft = null;
      renderMarketingAssetModal();
      renderWorkspaceModule("market-assets");
      window.operationsI18n?.apply(document.getElementById("workspaceModule"));
      showProjectToast(`${project.model} · ${marketingAssetMaterialName(draft.key, draft.special)} ${marketAssetsText("已更新。", "updated.")}`);
    }

    function marketingAssetIdFromName(name) {
      const slug = String(name || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      return slug || `special-material-${Date.now()}`;
    }

    function saveSpecialMarketingAsset() {
      if (!canEditMarketingAssets()) return;
      const draft = marketingAssetsState.draft;
      if (!draft?.nameZh.trim() || !draft.nameEn.trim() || !draft.owner.trim() || !draft.ddl) {
        showProjectToast(marketAssetsText("请完整填写中英文名称、负责人和DDL。", "Complete both names, owner and DDL."));
        return;
      }
      if (/[A-Z]/.test(draft.nameEn) && draft.nameEn === draft.nameEn.toUpperCase()) {
        showProjectToast(marketAssetsText("英文物料名称请使用标题式写法，不要全部大写。", "Use title case for the English material name; do not use all caps."));
        return;
      }
      if (!draft.projectIds.length) {
        showProjectToast(marketAssetsText("请至少选择一个适用项目。", "Select at least one applicable project."));
        return;
      }
      const id = draft.specialId || marketingAssetIdFromName(draft.nameEn);
      const duplicate = marketingAssetsState.specialMaterials.find((item) => item.id !== draft.specialId && (item.id === id || item.nameEn.toLowerCase() === draft.nameEn.trim().toLowerCase()));
      if (duplicate) {
        showProjectToast(marketAssetsText("该特殊物料已存在。", "This special material already exists."));
        return;
      }
      const definition = { id, nameZh: draft.nameZh.trim(), nameEn: draft.nameEn.trim(), createdAt: new Date().toISOString(), createdBy: currentProjectUser()?.name || "--" };
      const existingIndex = marketingAssetsState.specialMaterials.findIndex((item) => item.id === draft.specialId);
      if (existingIndex >= 0) marketingAssetsState.specialMaterials[existingIndex] = { ...marketingAssetsState.specialMaterials[existingIndex], ...definition };
      else marketingAssetsState.specialMaterials.push(definition);
      activeMarketingAssetProjects().forEach((project) => {
        project.special = project.special || {};
        if (draft.projectIds.includes(project.model)) {
          project.special[id] = project.special[id] || { status: "not_started", progress: 0, ddl: draft.ddl, owner: draft.owner.trim(), note: "" };
          if (draft.specialId && draft.specialId !== id) delete project.special[draft.specialId];
        } else {
          project.special[id] = null;
          if (draft.specialId && draft.specialId !== id) delete project.special[draft.specialId];
        }
      });
      persistMarketingAssets();
      activeMarketingAssetProjects().forEach((project) => syncMarketingAssetProject(project.model));
      clearMarketingAssetDraft();
      marketingAssetsState.modal = null;
      marketingAssetsState.draft = null;
      renderMarketingAssetModal();
      renderWorkspaceModule("market-assets");
      window.operationsI18n?.apply(document.getElementById("workspaceModule"));
      showProjectToast(`${definition.nameZh} ${marketAssetsText("已保存。", "saved.")}`);

    function exportMarketingAssets() {
      const headers = [marketAssetsText("项目", "Project"), marketAssetsText("产品", "Product"), marketAssetsText("上市日期", "Launch date"), ...STANDARD_MARKETING_ASSET_TYPES.map((type) => type.name), ...marketingAssetsState.specialMaterials.map((type) => activeLocale === "en-GB" ? type.nameEn : type.nameZh)];
      const rows = [headers];
      filteredMarketingAssetProjects().forEach((project) => {
        const values = [project.model, project.name, project.launchDate];
        STANDARD_MARKETING_ASSET_TYPES.forEach((type) => {
          const item = project.assets?.[type.key];
          const meta = marketingAssetStatusMeta(item?.status || "not_configured");
          values.push(`${activeLocale === "en-GB" ? meta.en : meta.zh} | DDL ${item?.ddl || "--"} | ${item?.owner || "--"}`);
        });
        marketingAssetsState.specialMaterials.forEach((type) => {
          const item = project.special?.[type.id];
          const meta = marketingAssetStatusMeta(item?.status || "not_configured");
          values.push(`${activeLocale === "en-GB" ? meta.en : meta.zh} | DDL ${item?.ddl || "--"} | ${item?.owner || "--"}`);
        });
        rows.push(values);
      });
      const csv = rows.map((row) => row.map((value) => `"${String(value ?? "").replaceAll('"', '""')}"`).join(",")).join("\n");
      const url = URL.createObjectURL(new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" }));

      link.download = activeLocale === "en-GB" ? "marketing-asset-delivery.csv" : "营销物料交付矩阵.csv";

      URL.revokeObjectURL(url);

    function handleMarketingAssetAction(button) {
      const action = button.getAttribute("data-market-asset-action");
      if (!action) return false;
      if (action === "add-special") openSpecialMaterialModal();
      if (action === "edit-special") openSpecialMaterialModal(button.getAttribute("data-special-id"));
      if (action === "edit-item") openMarketingAssetItemModal(button.getAttribute("data-model"), button.getAttribute("data-material-key"), button.getAttribute("data-special") === "true");
      if (action === "project-summary") openMarketingAssetProjectSummary(button.getAttribute("data-model"));
      if (action === "manage-specials") openMarketingAssetSpecialManager();
      if (action === "export") exportMarketingAssets();
      if (action === "reset-filters") {
        marketingAssetsState.filters = { search: "", launchMonth: "All", stage: "All", owner: "All", health: "All" };
        persistMarketingAssets();
        renderWorkspaceModule("market-assets");
        window.operationsI18n?.apply(document.getElementById("workspaceModule"));

      if (action === "close-modal") {
        flushAutosave("marketing-assets");
        marketingAssetsState.modal = null;
        marketingAssetsState.draft = null;
        renderMarketingAssetModal();
      }
      if (action === "save-item") saveMarketingAssetItem();
      if (action === "save-special") saveSpecialMarketingAsset();
      return true;
    }

    function handleMarketingAssetFieldChange(event) {
      const target = event.target;
      const filter = target.getAttribute("data-marketing-asset-filter");
      if (filter) {
        marketingAssetsState.filters[filter] = target.value;
        persistMarketingAssets();
        if (filter !== "search") {
          renderWorkspaceModule("market-assets");
          window.operationsI18n?.apply(document.getElementById("workspaceModule"));
        }
        return true;
      }
      const field = target.getAttribute("data-market-asset-draft-field");
      if (field && marketingAssetsState.draft) {
        marketingAssetsState.draft[field] = field === "progress" ? Number(target.value || 0) : target.value;
        if (field === "status" && target.value === "done") marketingAssetsState.draft.progress = 100;
        scheduleMarketingAssetDraftAutosave();
        return true;
      }
      const projectId = target.getAttribute("data-market-asset-project");
      if (projectId && marketingAssetsState.draft) {
        const ids = new Set(marketingAssetsState.draft.projectIds || []);
        if (target.checked) ids.add(projectId);
        else ids.delete(projectId);
        marketingAssetsState.draft.projectIds = [...ids];
        scheduleMarketingAssetDraftAutosave();
        return true;
      }
      return false;
    }

    function healthRank(health) {
      return { red: 0, amber: 1, green: 2, grey: 3 }[health] ?? 4;
    }

    function projectFirstBatchData(project, includeHistorical = false) {
      const product = state.products.find((item) => item.model === project.model);
      if (!product || product.lifecycle !== "New") return includeHistorical && project.firstBatchSnapshot ? { ...project.firstBatchSnapshot, historical: true } : null;
      const enriched = enrichedProduct(product);
      let month = enriched.months.find((item) => item.isFirstBatch);
      let planned = true;
      if (!month) {
        month = enriched.months.find((item) => item.demand > 0);
        planned = false;
      }
      if (!month) return null;
      const status = planned ? month.fbStatus : "risk";
      return {
        month: month.key,
        monthLabel: planned ? monthLabel(month.key) : "未排产",
        monthShort: planned ? `${Number(month.key.slice(5))}月` : "未排产",
        demand: month.demand,
        supply: month.supply,
        gap: month.gap,
        eoh: month.eoh,
        status,
        health: status === "risk" ? "red" : status === "watch" ? "amber" : "green",
        planned,
        source: "Sales & Inventory"
      };
    }

    function projectWorkstreamView(project, workstreamKey) {
      const stream = project.workstreams[workstreamKey];
      if (!stream || workstreamKey !== "supply") return stream;
      const firstBatch = projectFirstBatchData(project);
      if (!firstBatch) return stream;
      const effectiveHealth = healthRank(firstBatch.health) < healthRank(stream.health) ? firstBatch.health : stream.health;
      const firstBatchMonth = activeLocale === "en-GB"
        ? new Intl.DateTimeFormat("en-GB", { month: "short", year: "numeric", timeZone: "UTC" }).format(new Date(`${firstBatch.month}-01T00:00:00Z`))
        : firstBatch.monthShort;
      const firstBatchIssue = firstBatch.health === "green"
        ? ""
        : activeLocale === "en-GB"
          ? `First Batch ${firstBatchMonth}: forecast ${compact(firstBatch.demand)}, supply ${compact(firstBatch.supply)}, gap ${signed(firstBatch.gap)}`
          : `首批${firstBatch.monthShort}：预测${compact(firstBatch.demand)}，供应${compact(firstBatch.supply)}，供需差 ${signed(firstBatch.gap)}`;
      return {
        ...stream,
        health: effectiveHealth,
        blocker: [firstBatchIssue, projectText(stream.blocker)].filter(Boolean).join("；"),
        firstBatch
      };
    }

    function projectMetrics(project) {
      const streams = PROJECT_WORKSTREAMS.map((meta) => projectWorkstreamView(project, meta.key)).filter((item) => item && item.health !== "grey");
      const done = streams.reduce((sum, item) => sum + item.done, 0);
      const total = streams.reduce((sum, item) => sum + item.total, 0);
      const health = streams.reduce((worst, item) => healthRank(item.health) < healthRank(worst) ? item.health : worst, "green");
      const readiness = total ? Math.round((done / total) * 100) : 0;
      return { health, readiness, done, total };
    }

    function filteredProjects() {
      const search = projectState.filters.search.trim().toLowerCase();
      return projectState.projects.filter((project) => {
        const metrics = projectMetrics(project);
        if (!projectMatchesPortfolioScope(project)) return false;
        if (search && !`${project.model} ${project.name} ${project.category}`.toLowerCase().includes(search)) return false;
        if (projectState.filters.health !== "All" && metrics.health !== projectState.filters.health.toLowerCase()) return false;
        if (projectState.filters.stage !== "All" && project.stage !== projectState.filters.stage) return false;
        if (projectState.filters.owner !== "All" && project.owner !== projectState.filters.owner) return false;
        if (projectState.filters.onlyCritical && !Object.values(project.workstreams).some((item) => item.health === "red")) return false;
        return true;
      });
    }

    function projectExceptionRows(projects) {
      return projects.flatMap((project) => PROJECT_WORKSTREAMS.flatMap((meta) => {
        const stream = projectWorkstreamView(project, meta.key);
        if (!stream || !stream.blocker || !["red", "amber"].includes(stream.health)) return [];
        return [{
          projectId: project.id,
          model: project.model,
          projectName: project.name,
          workstream: meta.key,
          workstreamLabel: meta.label,
          health: stream.health,
          issue: stream.blocker,
          owner: stream.owner,
          due: stream.due,
          dueISO: stream.dueISO
        }];
      })).sort((a, b) => healthRank(a.health) - healthRank(b.health) || a.dueISO.localeCompare(b.dueISO));
    }

    function projectKpiData(projects) {
      const metrics = projects.map((project) => projectMetrics(project));
      const blockedTasks = projects.flatMap((project) => Object.values(project.workstreams).flatMap((item) => item.tasks)).filter((task) => task.status === "Blocked").length;
      const dueStart = new Date("2026-08-04T00:00:00Z");
      const dueEnd = new Date("2026-08-18T23:59:59Z");
      const dueNext14 = projects.flatMap((project) => Object.values(project.workstreams)).filter((item) => {
        const due = new Date(item.dueISO + "T00:00:00Z");
        return item.done < item.total && due >= dueStart && due <= dueEnd;
      }).length;
      const readiness = metrics.length ? Math.round(metrics.reduce((sum, item) => sum + item.readiness, 0) / metrics.length) : 0;
      return {
        active: projects.length,
        launchRisk: metrics.filter((item) => item.health === "red").length,
        blockedTasks,
        dueNext14,
        readiness
      };
    }
