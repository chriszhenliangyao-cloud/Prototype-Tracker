        <div class="permission-table-wrap"><table class="permission-table permission-template-table"><thead><tr><th>分类</th><th>角色模板</th><th>默认可见模块</th><th>关键操作</th><th>已分配</th></tr></thead><tbody>${PERMISSION_ROLE_TEMPLATES.map((template) => { const assigned = users.filter((user) => template.functionalRoles.length ? template.functionalRoles.some((role) => user.functionalRoles?.includes(role)) : user.platformRole === template.platformRole).length; return `<tr><td>${activeLocale === "en-GB" ? template.categoryEn : template.categoryZh}</td><td><strong>${activeLocale === "en-GB" ? template.en : template.zh}</strong></td><td>${activeLocale === "en-GB" ? template.modulesEn : template.modulesZh}</td><td>${activeLocale === "en-GB" ? template.actionsEn : template.actionsZh}</td><td><button class="btn" data-project-editor-action="choose-role-template" data-template-key="${template.key}">${assigned} ${activeLocale === "en-GB" ? "assigned" : "人"}</button></td></tr>`; }).join("")}</tbody></table></div>
      </div>`;
    }

    function renderPermissionMemberList(users, selectedUser) {
      return `<div class="permission-member-list">${users.map((user) => `<button class="permission-member-option ${selectedUser?.id === user.id ? "active" : ""}" data-project-editor-action="select-permission-user" data-user-id="${user.id}"><strong>${escapeProjectHtml(user.name || user.email || "--")}</strong><small>${platformRoleLabel(user.platformRole)} · ${escapeProjectHtml(user.department || "--")}</small></button>`).join("")}</div>`;
    }

    function renderPermissionScopesTab(users) {
      const selectedUser = permissionSelectedDraftUser();
      if (!selectedUser) return `<div class="permission-tab-panel"><div class="delay-warning">暂无可配置成员。</div></div>`;
      const groups = PERMISSION_SCOPE_DEFINITIONS.map((group) => `<section class="permission-scope-group"><h4>${activeLocale === "en-GB" ? group.en : group.zh}</h4><small>${activeLocale === "en-GB" ? group.noteEn : group.noteZh}</small><div class="permission-check-grid">${group.options.map(([value, zh, en]) => `<label class="permission-check"><input type="checkbox" data-permission-scope-field="${group.key}" data-scope-value="${value}" ${selectedUser.dataScopes?.[group.key]?.includes(value) ? "checked" : ""}><span>${activeLocale === "en-GB" ? en : zh}</span></label>`).join("")}</div></section>`).join("");
      return `<div class="permission-tab-panel" role="tabpanel"><div class="permission-control-bar compact"><div><strong>数据范围</strong><div class="permission-note">默认拒绝；“全部”与具体选项互斥。</div></div><div><strong>${escapeProjectHtml(selectedUser.name)} · ${permissionFunctionalSummary(selectedUser)}</strong><div class="permission-note">市场、客户、产品、项目、职能和财务主体共同决定最终可见数据。</div></div></div><div class="permission-scope-layout">${renderPermissionMemberList(users, selectedUser)}<div class="permission-scope-groups">${groups}</div></div></div>`;
    }

    function renderPermissionApprovalsTab(users) {
      const selectedUser = permissionSelectedDraftUser();
      if (!selectedUser) return `<div class="permission-tab-panel"><div class="delay-warning">暂无可配置成员。</div></div>`;
      const approvalChecks = PERMISSION_APPROVAL_DEFINITIONS.map(([key, zh, en]) => `<label class="permission-check"><input type="checkbox" data-permission-approval-type="${key}" ${selectedUser.approval.types.includes(key) ? "checked" : ""}><span>${activeLocale === "en-GB" ? en : zh}</span></label>`).join("");
      const authorityChecks = PERMISSION_AUTHORITY_DEFINITIONS.map(([key, zh, en]) => `<label class="permission-check"><input type="checkbox" data-permission-authority="${key}" ${selectedUser.approval.authorities.includes(key) ? "checked" : ""}><span>${activeLocale === "en-GB" ? en : zh}</span></label>`).join("");
      const audit = (projectState.permissionAudit || []).slice(0, 5);
      return `<div class="permission-tab-panel" role="tabpanel"><div class="permission-scope-layout">${renderPermissionMemberList(users, selectedUser)}<div><div class="permission-approval-groups"><section class="permission-scope-group"><h4>审批类型</h4><small>仅获得被勾选业务类型的审批权。</small><div class="permission-check-grid">${approvalChecks}</div></section><section class="permission-scope-group"><h4>发布与关闭权限</h4><small>发布、月结和归档必须单独授权。</small><div class="permission-check-grid">${authorityChecks}</div></section></div><div class="permission-approval-fields"><div class="permission-control-field"><label>单笔审批上限</label><input type="number" min="0" step="1000" data-permission-approval-field="limit" value="${selectedUser.approval.limit}"></div><div class="permission-control-field"><label>币种</label><select data-permission-approval-field="currency"><option value="EUR" ${selectedUser.approval.currency === "EUR" ? "selected" : ""}>EUR</option><option value="USD" ${selectedUser.approval.currency === "USD" ? "selected" : ""}>USD</option><option value="CNY" ${selectedUser.approval.currency === "CNY" ? "selected" : ""}>CNY</option></select></div><div class="permission-control-field"><label>替代审批人</label><select data-permission-approval-field="substitute"><option value="">无</option>${users.filter((user) => user.id !== selectedUser.id).map((user) => `<option value="${user.id}" ${selectedUser.approval.substitute === user.id ? "selected" : ""}>${escapeProjectHtml(user.name)}</option>`).join("")}</select></div><div class="permission-control-field"><label>有效期开始</label><input type="date" data-permission-approval-field="validFrom" value="${selectedUser.approval.validFrom}"></div><div class="permission-control-field"><label>有效期结束</label><input type="date" data-permission-approval-field="validTo" value="${selectedUser.approval.validTo}"></div></div><section class="editor-section"><div class="editor-section-head"><div><h3 class="editor-section-title">最近权限变更</h3><div class="permission-note">保存生效后生成不可覆盖的本地审计记录。</div></div></div><div class="permission-audit-list">${audit.length ? audit.map((item) => `<div class="permission-audit-item"><strong>${escapeProjectHtml(item.time)}</strong><span>${escapeProjectHtml(item.actor)}</span><span>${escapeProjectHtml(permissionAuditDisplayDetail(item))}</span></div>`).join("") : `<div class="permission-note">暂无权限变更记录。</div>`}</div></section></div></div></div>`;
    }

    function renderProjectPermissionModal() {
      const users = (projectState.permissionDraft || []).map(normalizePermissionUser);
      projectState.permissionDraft = users;
      const identity = window.cloudStore?.identity;
      const cloudReady = Boolean(window.cloudStore?.permissions && identity?.role === "admin");
      const authorizationMap = new Map(permissionCloudState.members.map((member) => [normalizePermissionEmail(member.email), member]));
      const messageClass = permissionCloudState.messageTone ? ` ${permissionCloudState.messageTone}` : "";
      const roleAssignments = users.reduce((sum, user) => sum + (user.functionalRoles?.length || 0), 0);
      const approvers = users.filter((user) => user.approval?.types?.length || user.approval?.authorities?.length).length;
      const body = permissionUiState.activeTab === "roles" ? renderPermissionRoleTemplatesTab(users) : permissionUiState.activeTab === "scopes" ? renderPermissionScopesTab(users) : permissionUiState.activeTab === "approvals" ? renderPermissionApprovalsTab(users) : renderPermissionMembersTab(users, authorizationMap, cloudReady, messageClass);
      return `<section class="modal project-editor-modal permission-manager-modal" role="dialog" aria-modal="true" aria-labelledby="permissionTitle"><div class="modal-head"><div><h2 class="modal-title" id="permissionTitle">权限管理</h2><p class="modal-subtitle">按平台角色、职能角色、数据范围和审批额度组合成员的最终权限</p></div><button class="icon-btn" data-project-editor-action="close" aria-label="关闭">×</button></div><div class="modal-body"><div class="admin-context-strip"><span>当前操作人：${currentProjectUser()?.name || "Ivy"} <span class="role-badge">${platformRoleLabel(currentProjectUser()?.platformRole || "super_admin")}</span></span><span>默认拒绝 · 最小权限 · 全程留痕</span></div><div class="permission-summary"><div class="permission-summary-item"><span>有效登录授权</span><strong>${permissionCloudState.loading ? "--" : permissionCloudState.members.length}</strong></div><div class="permission-summary-item"><span>工具内启用账号</span><strong>${users.filter((user) => user.status === "active").length}</strong></div><div class="permission-summary-item"><span>职能角色分配</span><strong>${roleAssignments}</strong></div><div class="permission-summary-item"><span>审批及发布用户</span><strong>${approvers}</strong></div></div>${renderPermissionTabs()}${body}</div><div class="modal-foot"><span>${autosaveStatusMarkup("project-permissions")} <span class="helper-note">登录授权即时生效；业务权限修改保存后生效。</span></span><div style="display:flex;gap:7px"><button class="btn" data-project-editor-action="close">暂存并关闭</button><button class="btn primary" data-project-editor-action="save-permissions">保存权限并生效</button></div></div></section>`;
    }

    function schedulePermissionAutosave() {
      scheduleProjectFormAutosave("project-permissions", "permissions", projectState.permissionDraft || []);
    }

    function applyPermissionRoleTemplate() {
      const user = permissionSelectedDraftUser();
      const template = PERMISSION_ROLE_TEMPLATES.find((item) => item.key === permissionUiState.templateKey);
      if (!user || !template) return;
      const replacing = permissionUiState.applyMode === "replace";
      if (replacing || template.platformRole !== "member") user.platformRole = template.platformRole;
      else if (!user.platformRole) user.platformRole = "member";
      user.functionalRoles = replacing ? [...template.functionalRoles] : Array.from(new Set([...(user.functionalRoles || []), ...template.functionalRoles]));
      user.approval.types = replacing ? [...(template.approvalTypes || [])] : Array.from(new Set([...(user.approval.types || []), ...(template.approvalTypes || [])]));
      user.approval.authorities = replacing ? [...(template.authorities || [])] : Array.from(new Set([...(user.approval.authorities || []), ...(template.authorities || [])]));
      Object.assign(user, normalizePermissionUser(user));
      schedulePermissionAutosave();
      renderProjectAdminModal();
      showProjectToast(`${user.name} 已应用${activeLocale === "en-GB" ? template.en : template.zh}模板。`);
    }

    function updatePermissionSelectionArray(targetArray, value, checked, exclusiveAll = false) {
      let next = [...(targetArray || [])];
      if (exclusiveAll && value === "all" && checked) return ["all"];
      if (exclusiveAll && value !== "all" && checked) next = next.filter((item) => item !== "all");
      next = checked ? Array.from(new Set([...next, value])) : next.filter((item) => item !== value);
      return next;
    }

    function permissionAuditDisplayDetail(item) {
      if (activeLocale !== "en-GB") return item.detailZh || item.detail || "";
      if (item.detailEn) return item.detailEn;
      const legacyMatch = String(item.detail || "").match(/^保存\s+(\d+)\s+个成员的角色、数据范围与审批权限$/);
      return legacyMatch ? `Applied roles, data scopes and approval access for ${legacyMatch[1]} members` : item.detail || "";
    }

    function recordPermissionAudit(detailZh, detailEn = "") {
      projectState.permissionAudit = projectState.permissionAudit || [];
      projectState.permissionAudit.unshift({
        id: `PA-${Date.now()}`,
        time: new Date().toLocaleString(activeLocale === "en-GB" ? "en-GB" : "zh-CN", { hour12: false }),
        actor: currentProjectUser()?.name || "Ivy",
        detail: detailZh,
        detailZh,
        detailEn
      });
      projectState.permissionAudit = projectState.permissionAudit.slice(0, 100);
      persistPermissionAudit();
    }

    function renderToolbar() {
      const models = ["All Models", ...state.products.map((product) => product.model)];
      const categories = ["All Categories", ...Array.from(new Set(state.products.map((product) => product.category)))];
      document.getElementById("historyBadge").innerHTML = `<span class="dot"></span>历史数据：${state.historySynced}`;
      document.getElementById("primaryActions").innerHTML = `
        <button class="btn subtle" data-action="pull-history">拉取历史数据</button>
        <button class="btn" data-action="edit-plan">计划协同</button>
        <button class="btn" data-action="forecast-archive">预测归档</button>
        <button class="btn primary" data-action="month-closing">月度关账</button>
      `;
      document.getElementById("filterToolbar").innerHTML = `
        ${renderSelect("model", "型号", models, state.filters.model)}
        ${renderSelect("category", "类别", categories, state.filters.category)}
        <div class="control">
          <label>生命周期</label>
          <div class="segmented" data-segment="lifecycle">
            ${["All", "New", "Launched"].map((item) => `<button class="${state.filters.lifecycle === item ? "active" : ""}" data-lifecycle="${item}">${salesText(item)}</button>`).join("")}
          </div>
        </div>
        <div class="control">
          <label>计划周期</label>
          <select data-filter="period" disabled>
            <option>${state.periodLabel}</option>
          </select>
        </div>
        <button class="toggle ${state.filters.onlyGap ? "active" : ""}" data-action="toggle-gap" aria-pressed="${state.filters.onlyGap}">
          <span class="switch"></span><span>仅看缺口</span>
        </button>
        <button class="toggle ${state.filters.firstBatchOnly ? "active" : ""}" data-action="toggle-first-batch" aria-pressed="${state.filters.firstBatchOnly}">
          <span class="switch"></span><span>仅看新品首批</span>
        </button>
        <div class="control">
          <label>视图</label>
          <div class="segmented" data-segment="view">
            <button class="${state.view === "matrix" ? "active" : ""}" data-view="matrix">矩阵</button>
            <button class="${state.view === "trend" ? "active" : ""}" data-view="trend">趋势</button>
          </div>
        </div>
      `;
    }

    function renderSelect(name, label, options, value) {
      return `
        <div class="control">
          <label>${label}</label>
          <select data-filter="${name}">
            ${options.map((option) => `<option value="${option}" ${option === value ? "selected" : ""}>${salesText(option)}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function renderKpis(products) {
      const kpi = kpiData(products);
      const gapPct = kpi.demand ? Math.round((kpi.gap / kpi.demand) * 1000) / 10 : 0;
      const cards = [
        { label: "三个月需求", value: compact(kpi.demand), foot: state.periodLabel },
        { label: "三个月供应", value: compact(kpi.supply), foot: state.periodLabel },
        { label: "净供需差", value: signed(kpi.gap), foot: state.periodLabel, delta: gapPct + "%" },
        { label: "缺口最大月份", value: kpi.worst.short + " " + signed(kpi.worst.gap), foot: "供需差" },
        { label: "缺货SKU", value: String(kpi.stockoutSku), foot: "三个月内任一月份", risk: kpi.stockoutSku > 0 }
      ];
      document.getElementById("kpiGrid").innerHTML = cards.map((card) => `
        <article class="kpi">
          <div class="kpi-label">${card.label}</div>
          <div class="kpi-value ${String(card.value).startsWith("-") || card.risk ? "number-negative" : ""}">
            ${card.value}${card.delta ? `<span class="delta">${card.delta}</span>` : ""}
          </div>
          <div class="kpi-foot">${card.foot}</div>
        </article>
      `).join("");
    }

    function renderMain(products) {
      const exceptions = exceptionRows(products);
      const exceptionPanel = renderExceptionBoard(exceptions);
      const view = state.view === "trend" ? renderTrendView(products) : renderMatrixView(products);
      document.getElementById("mainView").innerHTML = `
        <div class="content-grid">
          ${exceptionPanel}
          <section>${view}</section>
        </div>
      `;
    }

    function renderExceptionBoard(rows) {
      return `
        <aside class="panel exception-panel">
          <div class="panel-head">
            <h2 class="panel-title">异常看板 <span class="count-badge">${rows.length}</span></h2>
            <span class="exception-summary">点击定位数据</span>
          </div>
          <div class="chips">
            <button class="chip">全部 (${rows.length})</button>
            <button class="chip danger">缺货 (${rows.filter((row) => row.type === "Stockout").length})</button>
            <button class="chip danger">首批 (${rows.filter((row) => row.type.includes("Batch")).length})</button>
            <button class="chip warn">缺口 (${rows.filter((row) => row.type === "Gap").length})</button>
          </div>
          <div class="exception-list">
            ${rows.length ? rows.map((row) => `
              <button class="exception-item" data-action="jump-exception" data-model="${row.model}" data-month="${row.month}">
                <span class="exception-topline">
                  <span class="exception-type type-${row.type.toLowerCase().replaceAll(" ", "-")}">${salesText(row.type)}</span>
                  <span class="exception-month">${monthLabel(row.month)} · ${salesText(row.lifecycle)}</span>
                </span>
                <span class="exception-mainline">
                  <span class="sku-main">${row.model} · ${row.name}</span>
                  <span class="exception-issue ${row.issue.includes("-") ? "number-negative" : row.issue.includes("正常") ? "number-positive" : ""}">${row.issue}</span>
                </span>
                <span class="exception-metrics">
                  <span>需 ${compact(row.demand)}</span>
                  <span>供 ${compact(row.supply)}</span>
                  <span>差 ${signed(row.gap)}</span>
                  <span>${row.detail}</span>
                </span>
              </button>
            `).join("") : `<div class="exception-empty">当前筛选范围内没有异常。</div>`}
          </div>
        </aside>
      `;
    }

    function renderMatrixView(products) {
      const totals = matrixTotals(products);
      return `
        <section class="panel view-shell active">
          <div class="panel-head">
            <h2 class="panel-title">供需矩阵 <span class="chart-note">(${state.periodLabel})</span></h2>
            <span class="chart-note">所有数值单位：件</span>
          </div>
          <div class="matrix-wrap">
            <table class="matrix-table">
              <thead>
                <tr>
                  <th class="sticky-col model-cell">型号</th>
                  <th class="sticky-product product-cell">产品</th>
                  <th class="small-col">生命周期</th>
                  <th class="small-col">上市日期</th>
                  <th class="small-col">当前库存</th>
                  ${MONTHS.map((month) => `<th class="month-col">${month.label}</th>`).join("")}
                  <th class="total-col">三个月合计</th>
                  <th class="risk-col">风险</th>
                </tr>
              </thead>
              <tbody>
                ${products.map(renderProductRow).join("")}
              </tbody>
              <tfoot>
                ${renderMatrixTotalRow(totals)}
              </tfoot>
            </table>
          </div>
          ${renderLegend()}
        </section>
      `;
    }

    function renderProductRow(product) {
      return `
        <tr>
          <td class="sticky-col model-cell">${product.model}</td>
          <td class="sticky-product product-cell">
            <div class="sku-main">${product.name}</div>
            <div class="sku-sub">${salesText(product.category)}</div>
          </td>
          <td><span class="lifecycle-pill ${product.lifecycle.toLowerCase()}">${salesText(product.lifecycle)}</span></td>
          <td>${product.launch}</td>
          <td>${formatNumber(product.currentInventory)}</td>
          ${product.months.map((month) => `<td data-cell="${product.model}:${month.key}">${renderMonthCard(month, product.model)}</td>`).join("")}
          <td class="total-col">${renderTotalCard(product.totalDemand, product.totalSupply, product.totalGap)}</td>
          <td><span class="risk-pill ${product.risk.toLowerCase()}">${salesText(product.risk)}</span></td>
        </tr>
      `;
    }

    function renderMonthCard(month, model) {
      const cls = month.eoh < 0 || month.gap <= -1000 ? "severe" : month.gap < 0 ? "warn" : "ok";
      const firstBatchClass = month.isFirstBatch ? ` first-batch fb-${month.fbStatus}` : "";
      const firstBatchStatus = month.isFirstBatch ? `首批${month.fbStatus === "risk" ? "风险" : month.fbStatus === "watch" ? "关注" : "正常"}` : "";
      const highlighted = state.highlighted && state.highlighted.model === model && state.highlighted.month === month.key ? " highlight-cell" : "";
      return `
        <div class="month-card ${cls}${firstBatchClass}${highlighted}" ${firstBatchStatus ? `title="${firstBatchStatus}" aria-label="${firstBatchStatus}"` : ""}>
          <div class="metric-line"><span class="label">需</span><span class="value">${compact(month.demand)}</span></div>
          <div class="metric-line"><span class="label">供</span><span class="value">${compact(month.supply)}</span></div>
          <div class="metric-line gap ${month.gap >= 0 ? "positive" : ""}"><span class="label">差</span><span class="value">${signed(month.gap)}</span></div>
          <div class="metric-line eoh ${month.eoh >= 0 ? "positive" : ""}"><span class="label">EOH</span><span class="value">${compact(month.eoh)}</span></div>
        </div>
      `;
    }

    function renderTotalCard(demand, supply, gap) {
      return `
        <div class="month-card total-card">
          <div class="metric-line"><span class="label">需</span><span class="value">${compact(demand)}</span></div>
          <div class="metric-line"><span class="label">供</span><span class="value">${compact(supply)}</span></div>
          <div class="metric-line gap ${gap >= 0 ? "positive" : ""}"><span class="label">差</span><span class="value">${signed(gap)}</span></div>
        </div>
      `;
    }

    function matrixTotals(products) {
      const months = MONTHS.map((month) => {
        const entries = products.map((product) => product.months.find((item) => item.key === month.key));
        const demand = entries.reduce((sum, item) => sum + (item?.demand || 0), 0);
        const supply = entries.reduce((sum, item) => sum + (item?.supply || 0), 0);
        return { ...month, demand, supply, gap: supply - demand };
      });
      const currentInventory = products.reduce((sum, product) => sum + Number(product.currentInventory || 0), 0);
      const totalDemand = products.reduce((sum, product) => sum + product.totalDemand, 0);
      const totalSupply = products.reduce((sum, product) => sum + product.totalSupply, 0);
      const riskCount = products.filter((product) => product.risk !== "Low").length;
      return {
        currentInventory,
        months,
        totalDemand,
        totalSupply,
        totalGap: totalSupply - totalDemand,
        riskCount,
        skuCount: products.length
      };
    }

    function renderMatrixTotalRow(totals) {
      return `
        <tr class="matrix-total-row">
          <td class="sticky-col model-cell total-label">合计</td>
          <td class="sticky-product product-cell">
            <div class="sku-main">当前筛选产品</div>
            <div class="sku-sub">仅统计可见SKU</div>
          </td>
          <td><span class="total-label">${totals.skuCount}个SKU</span></td>
          <td>--</td>
          <td>${formatNumber(totals.currentInventory)}</td>

    function renderTrendView(products) {
      return `
        <div class="trend-grid">
          <section class="chart-panel">
            <div class="chart-title">

          <div>
            <section class="chart-panel" style="margin-bottom:12px">
              <div class="chart-title">
                <h3>SKU供需差热力图</h3>
                <span class="chart-note">供需差 = 供应 - 需求</span>
              </div>
              ${renderHeatmap(products)}
            </section>
            <section class="chart-panel">
              <div class="chart-title">
                <h3>EOH风险趋势</h3>

              </div>

          </div>
          <div class="action-strip">

              <article class="action-card ${index < 2 ? "high" : "medium"}">
                <div class="action-head"><span class="action-rank">${index + 1}</span>${row.model} · ${row.month === "Recurring" ? "持续发生" : monthLabel(row.month)} · ${row.issue}</div>

              </article>
            `).join("")}
          </div>
        </section>
      `;
    }

    function monthlyAggregates(products) {
      return MONTHS.map((month) => {
        const demand = products.reduce((sum, product) => sum + (product.months.find((item) => item.key === month.key)?.demand || 0), 0);
        const supply = products.reduce((sum, product) => sum + (product.months.find((item) => item.key === month.key)?.supply || 0), 0);
        return { ...month, demand, supply, gap: supply - demand };
      });
    }

    function renderMonthlyBars(products) {
      const data = monthlyAggregates(products);
      const width = 760;
      const height = 310;
      const top = 26;
      const bottom = 62;
      const mid = 190;
      const maxValue = Math.max(...data.flatMap((item) => [item.demand, item.supply, Math.abs(item.gap)]), 1);
      const scale = (height - bottom - top) / maxValue;
      const groupWidth = width / data.length;
      const eventLabels = firstBatchEvents(products);
      const bars = data.map((item, index) => {
        const x = index * groupWidth + 70;
        const demandH = item.demand * scale;
        const supplyH = item.supply * scale;
        const gapH = Math.abs(item.gap) * scale;
        const event = eventLabels.find((entry) => entry.month === item.key);
        return `
          <rect x="${x}" y="${mid - demandH}" width="42" height="${demandH}" rx="3" fill="#225be8"></rect>
          <rect x="${x + 58}" y="${mid - supplyH}" width="42" height="${supplyH}" rx="3" fill="#18a66b"></rect>
          <rect x="${x + 116}" y="${mid}" width="42" height="${gapH}" rx="3" fill="${item.gap < -1000 ? "#e4232f" : "#f27b16"}"></rect>
          <text x="${x + 21}" y="${mid - demandH - 7}" text-anchor="middle" font-size="12" font-weight="800" fill="#17305f">${compact(item.demand)}</text>
          <text x="${x + 79}" y="${mid - supplyH - 7}" text-anchor="middle" font-size="12" font-weight="800" fill="#0a6e4a">${compact(item.supply)}</text>
          <text x="${x + 137}" y="${mid + gapH + 16}" text-anchor="middle" font-size="12" font-weight="900" fill="#e4232f">${signed(item.gap)}</text>
          <text x="${x + 78}" y="288" text-anchor="middle" font-size="12" fill="#52617a">${item.label}</text>
          ${event ? `<text x="${x + 78}" y="306" text-anchor="middle" font-size="11" font-weight="900" fill="${event.color}">${event.label}</text>` : ""}
        `;
      }).join("");
      return `
        <svg viewBox="0 0 ${width} ${height}" width="100%" height="320" role="img" aria-label="月度需求、供应及供需差柱状图">
          <line x1="50" y1="${mid}" x2="${width - 20}" y2="${mid}" stroke="#1f2937" stroke-width="1"></line>
          <line x1="50" y1="28" x2="50" y2="260" stroke="#cbd4e1"></line>
          <text x="50" y="22" font-size="11" fill="#52617a">单位</text>
          <text x="34" y="${mid}" text-anchor="end" font-size="11" fill="#52617a">0</text>
          <text x="34" y="${mid - 10000 * scale}" text-anchor="end" font-size="11" fill="#52617a">10K</text>
          <text x="34" y="${mid + 5000 * scale}" text-anchor="end" font-size="11" fill="#52617a">-5K</text>
          ${bars}
          <rect x="270" y="10" width="10" height="10" rx="2" fill="#225be8"></rect>
          <text x="286" y="19" font-size="11" fill="#52617a">需求</text>
          <rect x="360" y="10" width="10" height="10" rx="2" fill="#18a66b"></rect>
          <text x="376" y="19" font-size="11" fill="#52617a">供应</text>
          <rect x="442" y="10" width="10" height="10" rx="2" fill="#e4232f"></rect>
          <text x="458" y="19" font-size="11" fill="#52617a">净供需差</text>
        </svg>
      `;
    }

    function firstBatchEvents(products) {
      return products.flatMap((product) => product.months.filter((month) => month.isFirstBatch).map((month) => {
        const map = {
          risk: { label: "首批! " + product.model, color: "#e4232f" },
          watch: { label: "首批~ " + product.model, color: "#d96a00" },
          ok: { label: "首批正常 " + product.model, color: "#11845b" }
        };
        return { month: month.key, ...map[month.fbStatus] };
      }));
    }

    function renderHeatmap(products) {
      return `
        <table class="heatmap-table">
          <thead>
            <tr>
              <th class="sku-col">SKU</th>
              ${MONTHS.map((month) => `<th>${month.short}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
            ${products.map((product) => `
              <tr>
                <td class="sku-col">${product.model}</td>
                ${product.months.map((month) => {
                  const cls = month.gap <= -1000 || month.eoh < 0 ? "heat-severe" : month.gap < 0 ? "heat-warn" : "heat-ok";
                  const firstBatchClass = month.isFirstBatch ? ` heat-first-batch fb-${month.fbStatus}` : "";
                  const firstBatchTitle = month.isFirstBatch ? ` title="首批${month.fbStatus === "risk" ? "风险" : month.fbStatus === "watch" ? "关注" : "正常"}"` : "";
                  return `<td class="${cls}${firstBatchClass}"${firstBatchTitle}>${signed(month.gap)}</td>`;
                }).join("")}
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderEohTrend(products) {
      const riskProducts = products
        .filter((product) => product.risk !== "Low" || product.lifecycle === "New")
        .slice(0, 5);
      const width = 520;
      const height = 230;
      const left = 48;
      const right = 30;
      const top = 22;
      const bottom = 32;
      const values = riskProducts.flatMap((product) => product.months.map((month) => month.eoh));
      const min = Math.min(-1000, ...values);
      const max = Math.max(3000, ...values);
      const x = (index) => left + index * ((width - left - right) / (MONTHS.length - 1));
      const y = (value) => top + (max - value) * ((height - top - bottom) / (max - min));
      const colors = ["#e4232f", "#225be8", "#11845b", "#d96a00", "#6b7280"];
      const zeroY = y(0);
      const lines = riskProducts.map((product, productIndex) => {
        const color = colors[productIndex % colors.length];
        const points = product.months.map((month, index) => `${x(index)},${y(month.eoh)}`).join(" ");
        const markers = product.months.map((month, index) => `
          <circle cx="${x(index)}" cy="${y(month.eoh)}" r="4" fill="${color}"></circle>
          <text x="${x(index)}" y="${y(month.eoh) - 8}" text-anchor="middle" font-size="10" font-weight="800" fill="${month.eoh < 0 ? "#e4232f" : color}">${compact(month.eoh)}</text>
        `).join("");
        return `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2"></polyline>${markers}`;
      }).join("");
      const legend = riskProducts.map((product, index) => `
        <span style="color:${colors[index % colors.length]};font-weight:800">${product.model}</span>
      `).join(" ");
      return `
        <div class="chart-note" style="margin-bottom:6px">${legend}</div>
        <svg viewBox="0 0 ${width} ${height}" width="100%" height="240" role="img" aria-label="EOH风险趋势">
          <line x1="${left}" y1="${zeroY}" x2="${width - right}" y2="${zeroY}" stroke="#6b7280" stroke-dasharray="4 4"></line>
          <text x="${width - right}" y="${zeroY - 5}" text-anchor="end" font-size="10" fill="#52617a">缺货线</text>
          <line x1="${left}" y1="${top}" x2="${left}" y2="${height - bottom}" stroke="#cbd4e1"></line>
          <line x1="${left}" y1="${height - bottom}" x2="${width - right}" y2="${height - bottom}" stroke="#cbd4e1"></line>
          ${MONTHS.map((month, index) => `<text x="${x(index)}" y="${height - 10}" text-anchor="middle" font-size="10" fill="#52617a">${month.short}</text>`).join("")}
          ${lines}
        </svg>
      `;
    }

    function renderModal() {
      const root = document.getElementById("modalRoot");
      if (!state.modal) {
        root.className = "modal-backdrop";
        root.innerHTML = "";
        root.setAttribute("aria-hidden", "true");
        return;
      }
      root.className = "modal-backdrop active";
      root.setAttribute("aria-hidden", "false");
      if (state.modal === "editor") root.innerHTML = renderEditorModal();
      if (state.modal === "history") root.innerHTML = renderHistoryModal();
      if (state.modal === "archive") root.innerHTML = renderArchiveModal();
      if (state.modal === "closing") root.innerHTML = renderClosingModal();
    }

    function planFieldLabel(field) {
      return field === "demand" ? "销售预测" : field === "supply" ? "供应计划" : "备注";
    }

    function workflowStatusLabel(status) {
      return {
        pending: "待开始",
        in_progress: "进行中",
        submitted: "已提交",
        reviewing: "复核中",
        approved: "已审批",
        published: "已发布",
        draft: "草稿"
      }[status] || status;
    }

    function workflowStatusClass(status) {
      if (["submitted", "approved", "published"].includes(status)) return "complete";
      if (["in_progress", "reviewing"].includes(status)) return "active";
      return "pending";
    }

    function baselinePlanValue(model, month, field) {
      const product = state.baselineProducts.find((item) => item.model === model);
      return Number(product?.plans?.[month]?.[field] || 0);
    }

    function isPlanCellChanged(model, month, field, value) {
      return Number(value || 0) !== baselinePlanValue(model, month, field);
    }

    function productHasPlanChanges(product) {
      return MONTHS.some((month) => ["demand", "supply"].some((field) => isPlanCellChanged(product.model, month.key, field, product.plans[month.key]?.[field])));
    }

    function editorVisibleProducts() {
      const filters = state.editorFilters;
      const search = String(filters.search || "").trim().toLowerCase();
      return state.products.map(enrichedProduct).filter((product) => {
        if (search && !`${product.model} ${product.name} ${salesText(product.category)}`.toLowerCase().includes(search)) return false;
        if (filters.changedOnly && !productHasPlanChanges(product)) return false;
        if (filters.gapOnly && !product.months.some((month) => month.gap < 0 || month.eoh < 0)) return false;
        if (filters.firstBatchOnly && !(product.lifecycle === "New" && product.months.some((month) => month.isFirstBatch))) return false;
        return true;
      });
    }

    function editorImpactSummary() {
      const changedSkus = new Set();
      const demandChangedSkus = new Set();
      const supplyChangedSkus = new Set();
      let demandDelta = 0;
      let supplyDelta = 0;
      state.products.forEach((product) => {
        MONTHS.forEach((month) => {
          ["demand", "supply"].forEach((field) => {
            const current = Number(product.plans[month.key]?.[field] || 0);
            const baseline = baselinePlanValue(product.model, month.key, field);
            if (current !== baseline) {
              changedSkus.add(product.model);
              if (field === "demand") demandChangedSkus.add(product.model);
              if (field === "supply") supplyChangedSkus.add(product.model);
            }
            if (field === "demand") demandDelta += current - baseline;
            if (field === "supply") supplyDelta += current - baseline;
          });
        });
      });
      const products = state.products.map(enrichedProduct);
      const stockoutCount = products.filter((product) => product.minEoh < 0).length;
      const firstBatchRisks = products.filter((product) => product.months.some((month) => month.isFirstBatch && month.fbStatus !== "ok")).length;
      return {
        changedSkus: changedSkus.size,
        demandChangedSkus: demandChangedSkus.size,
        supplyChangedSkus: supplyChangedSkus.size,
        demandDelta,
        supplyDelta,
        stockoutCount,
        firstBatchRisks
      };
    }

    function canEditPlanField(field) {
      const role = state.collaborationRole || "admin";
      if (role === "viewer") return false;
      if (state.editorMode === "sales") return field === "demand" && state.workflow.sales.status === "in_progress" && ["admin", "sales"].includes(role);
      if (state.editorMode === "supply") return field === "supply" && state.workflow.supply.status === "in_progress" && ["admin", "supply"].includes(role);
      return false;
    }

    function versionRecords() {
      return [
        {
          id: "current-draft",
          name: "8月协同草稿 v4",
          status: "Draft",
          date: "今天",
          note: "当前月度协同计划",
          owner: "当前团队",
          products: state.products
        },
        ...state.snapshots
      ];
    }

    function versionRecord(versionId) {
      return versionRecords().find((item) => item.id === versionId) || versionRecords()[0];
    }

    function versionDiff(baseProducts, targetProducts) {
      const rows = [];
      const baseEnriched = baseProducts.map(enrichedProduct);
      const targetEnriched = targetProducts.map(enrichedProduct);
      targetProducts.forEach((product) => {
        const baseProduct = baseProducts.find((item) => item.model === product.model);
        MONTHS.forEach((month) => {
          ["demand", "supply"].forEach((field) => {
            const before = Number(baseProduct?.plans?.[month.key]?.[field] || 0);
            const after = Number(product.plans?.[month.key]?.[field] || 0);
            if (before === after) return;
            const baseMetric = baseEnriched.find((item) => item.model === product.model)?.months.find((item) => item.key === month.key);
            const targetMetric = targetEnriched.find((item) => item.model === product.model)?.months.find((item) => item.key === month.key);
            rows.push({
              sku: product.model,
              month: month.key,
              field,
              before,
              after,
              delta: after - before,
              eohDelta: Number(targetMetric?.eoh || 0) - Number(baseMetric?.eoh || 0)
            });
          });
        });
      });
      return rows;
    }

    function batchSummary(batch) {
      const lines = batch.lines || [];
      const skus = new Set(lines.map((line) => line.sku)).size;
      const delta = lines.reduce((sum, line) => sum + Number(line.after || 0) - Number(line.before || 0), 0);
      const scope = batch.function === "sales" ? "预测" : "供应";
      return `${skus}个SKU · ${scope}${signed(delta)}`;
    }

    function collaborationRoleLabel(role) {
      return {
        admin: "总管理员",
        sales: "销售",
        supply: "供应",
        viewer: "查看者"
      }[role] || role;
    }

    function workflowOverallLabel() {
      return {
        sales_in_progress: "销售预测更新中",
        supply_in_progress: "供应响应中",
        reviewing: "联合复核中",
        ready_to_publish: "待发布",
        published: "已发布"
      }[state.workflow.status] || "月度协同中";
    }

    function collaborationSteps() {
      return [
        { key: "sales", label: "销售更新预测", department: "销售", deadline: "8月3日" },
        { key: "supply", label: "供应响应", department: "供应", deadline: "8月6日" },

      ];
    }

    function workflowChangeScope(key, impact = editorImpactSummary()) {
      if (["sales", "supply"].includes(key)) {
        const batch = state.changeBatches.find((item) => item.type === "monthly" && item.function === key);
        return batch ? batchSummary(batch) : `${key === "sales" ? impact.demandChangedSkus : impact.supplyChangedSkus}个SKU`;
      }
      if (key === "review") return `${impact.stockoutCount}个缺货 · ${impact.firstBatchRisks}个首批关注`;

    }

    function collaborationFocus() {
      const role = state.collaborationRole || "admin";
      const status = state.workflow.status;
      if (role === "viewer") {
        return { eyebrow: "当前权限 · 查看者", title: "查看本轮计划与流程状态", detail: "所有预测和供应字段只读", action: "open-plan-entry", mode: "review", label: "查看计划矩阵" };
      }
      if (role === "sales") {
        if (state.workflow.sales.status === "in_progress") return { eyebrow: "当前待办 · 销售", title: "完成8月至10月销售预测", detail: "截止8月3日 · 提交后预测字段将锁定", action: "open-plan-entry", mode: "sales", label: "进入销售预测录入" };
        return { eyebrow: "销售环节已完成", title: "销售预测已提交，等待供应响应", detail: state.workflow.sales.time, action: "open-plan-entry", mode: "sales", label: "查看已提交预测" };
      }
      if (role === "supply") {
        if (state.workflow.supply.status === "in_progress") return { eyebrow: "当前待办 · 供应", title: "根据已提交预测完成供应计划", detail: "截止8月6日 · 当前有2个SKU供应变化", action: "open-plan-entry", mode: "supply", label: "进入供应计划录入" };
        if (state.workflow.supply.status === "pending") return { eyebrow: "等待上游", title: "等待销售预测提交", detail: "销售提交后将自动开放供应计划", action: null, label: "等待销售提交" };
        return { eyebrow: "供应环节已完成", title: "供应计划已提交，等待联合复核", detail: state.workflow.supply.time, action: "open-plan-entry", mode: "supply", label: "查看已提交供应" };
      }
      if (status === "sales_in_progress") return { eyebrow: "当前流程 · 销售预测更新", title: "销售需要完成本轮预测并提交", detail: "总管理员可查看录入进度或重新分配负责人", action: "open-plan-entry", mode: "sales", label: "查看销售预测录入" };
      if (status === "supply_in_progress") return { eyebrow: "当前流程 · 供应响应", title: "供应需要根据已提交预测更新供应计划", detail: "截止8月6日 · 供应完成后进入联合复核", action: "open-plan-entry", mode: "supply", label: "进入供应计划录入" };
      if (status === "reviewing") return { eyebrow: "当前待办 · 总管理员", title: "检查供需缺口与首批风险", detail: "供应已提交 · 复核完成后方可发布正式版本", action: "open-plan-entry", mode: "review", label: "开始联合复核" };
      if (status === "ready_to_publish") return { eyebrow: "当前待办 · 总管理员", title: "联合复核已完成，可以发布正式版本", detail: "发布后将生成不可覆盖的历史快照", action: "publish-snapshot", label: "发布正式版本" };
      return { eyebrow: "本轮协同已完成", title: "8月正式计划已发布", detail: "需要调整时请创建临时变更或基于历史版本创建新草稿", action: "editor-tab", tab: "history", label: "查看正式版本" };
    }

    function renderCollaborationPrimaryAction(focus) {
      if (!focus.action) return `<button class="btn" disabled>${focus.label}</button>`;
      if (focus.action === "open-plan-entry") return `<button class="btn primary" data-action="open-plan-entry" data-mode="${focus.mode}">${focus.label}</button>`;
      if (focus.action === "editor-tab") return `<button class="btn primary" data-action="editor-tab" data-tab="${focus.tab}">${focus.label}</button>`;

    function activeEntryStep() {

      if (state.editorMode === "supply" && state.workflow.supply.status === "in_progress" && ["admin", "supply"].includes(state.collaborationRole)) return "supply";

    function renderPlanningFooter() {
      const step = activeEntryStep();
      const submitLabel = step === "sales" ? "提交销售预测" : "提交供应计划";
      if (state.editorTab === "grid") {
        return `
          <span>${autosaveStatusMarkup("sales-plan")} <span class="helper-note">所有修改先保存为草稿，提交后当前部门字段锁定。</span></span>

            <button class="btn" data-action="close-modal">暂存并关闭</button>
            <button class="btn" data-action="editor-tab" data-tab="overview">返回协同总览</button>
            ${step ? `<button class="btn primary" data-action="review-submit-step" data-step="${step}">${submitLabel}</button>` : ""}
          </div>
        `;
      }
      return `
        <span>${autosaveStatusMarkup("sales-plan")} <span class="helper-note">历史正式版本不可覆盖。</span></span>
        <div style="display:flex;gap:7px">
          <button class="btn" data-action="close-modal">关闭</button>
          ${state.editorTab === "overview" ? "" : `<button class="btn primary" data-action="editor-tab" data-tab="overview">返回协同总览</button>`}
        </div>
      `;
    }

    function renderEditorModal() {
      const tabLabels = { overview: "协同总览", grid: "计划录入", history: "版本记录", log: "变更记录" };
      return `
        <section class="modal planner-modal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
          <div class="modal-head">
            <div>
              <h2 class="modal-title" id="editorTitle">月度产销计划协同</h2>
              <p class="modal-subtitle">按销售预测、供应响应、联合复核和正式发布完成本月滚动计划。</p>
            </div>
            <button class="icon-btn" data-action="close-modal" aria-label="关闭">×</button>
          </div>
          <div class="modal-body">
            <div class="planner-context">
              <div class="meta-grid">
                <div class="meta-box"><div class="meta-label">计划周期</div><div class="meta-value">2026年8月</div></div>
                <div class="meta-box"><div class="meta-label">滚动窗口</div><div class="meta-value">${state.periodLabel}</div></div>
                <div class="meta-box"><div class="meta-label">当前状态</div><div class="meta-value">${workflowOverallLabel()}</div></div>
                <div class="meta-box"><div class="meta-label">当前草稿</div><div class="meta-value">v4 · ${autosaveStatusMarkup("sales-plan")}</div></div>
                <div class="meta-box"><div class="meta-label">上月正式版本</div><div class="meta-value">7月正式版 v3</div></div>
              </div>
              <div class="tabs">
                ${Object.entries(tabLabels).map(([tab, label]) => `<button class="tab ${state.editorTab === tab ? "active" : ""}" data-action="editor-tab" data-tab="${tab}">${label}</button>`).join("")}
              </div>
            </div>
            <div class="planner-tab-content">
              ${state.editorTab === "overview" ? renderCollaborationOverviewTab() : state.editorTab === "grid" ? renderEditorGridTab() : state.editorTab === "history" ? renderVersionHistoryTab() : renderChangeLogTab()}
            </div>
            ${renderEditorDrawer()}
          </div>
          <div class="modal-foot">
            ${renderPlanningFooter()}
          </div>
        </section>
      `;
    }

    function renderCollaborationOverviewTab() {
      const impact = editorImpactSummary();
      const focus = collaborationFocus();
      const steps = collaborationSteps();
      return `
        <div class="collab-focus-band">
          <div class="collab-focus-copy">
            <div class="collab-focus-eyebrow">${focus.eyebrow}</div>
            <div class="collab-focus-title">${focus.title}</div>
            <div class="collab-focus-detail">${focus.detail}</div>
          </div>
          <div class="collab-focus-actions">
            ${renderCollaborationPrimaryAction(focus)}
          </div>
        </div>
        <div class="collab-section-head"><h3>本月流程</h3><span class="helper-note">当前账号：${currentProjectUser()?.name || "--"} · ${collaborationRoleLabel(state.collaborationRole)}</span></div>
        <div class="workflow-steps">
          ${steps.map((step, index) => {
            const item = state.workflow[step.key];
            return `
              <div class="workflow-step ${workflowStatusClass(item.status)}">
                <div class="workflow-step-index"><span>步骤 ${index + 1} · ${step.deadline}</span><span class="status-tag ${workflowStatusClass(item.status)}">${workflowStatusLabel(item.status)}</span></div>
                <div class="workflow-step-title">${step.label}</div>
                <div class="workflow-step-meta">${step.department} · ${item.owner} · ${item.time}</div>
                <div class="workflow-step-scope">${workflowChangeScope(step.key, impact)}</div>
                <div class="workflow-step-action">${renderWorkflowAction(step.key, item.status)}</div>
              </div>
            `;
          }).join("")}
        </div>
        <div class="collab-process-note">
          <span>已提交环节自动锁定；重新打开必须填写原因。正式版本与全部字段变化分别保留在版本记录和变更记录中。</span>
          <span class="collab-process-links"><button class="chip" data-action="editor-tab" data-tab="history">查看版本</button><button class="chip" data-action="editor-tab" data-tab="log">查看变更</button></span>
        </div>
      `;
    }

    function renderEditorGridTab() {
      const impact = editorImpactSummary();
      const products = editorVisibleProducts();
      const pageCount = Math.max(1, Math.ceil(products.length / state.editorPageSize));
      state.editorPage = Math.min(Math.max(1, state.editorPage), pageCount);
      const start = (state.editorPage - 1) * state.editorPageSize;
      const rows = products.slice(start, start + state.editorPageSize);
      const allSelected = rows.length > 0 && rows.every((product) => state.selectedSkus.includes(product.model));
      const hasWritableField = canEditPlanField("demand") || canEditPlanField("supply");
      return `
        <div class="editor-summary">
          <div class="editor-summary-item"><div class="editor-summary-label">本次变化SKU</div><div class="editor-summary-value">${impact.changedSkus}</div></div>
          <div class="editor-summary-item"><div class="editor-summary-label">预测净变化</div><div class="editor-summary-value ${impact.demandDelta >= 0 ? "number-positive" : "number-negative"}">${signed(impact.demandDelta)}</div></div>
          <div class="editor-summary-item"><div class="editor-summary-label">缺货SKU</div><div class="editor-summary-value ${impact.stockoutCount ? "number-negative" : ""}">${impact.stockoutCount}</div></div>
          <div class="editor-summary-item"><div class="editor-summary-label">首批需关注</div><div class="editor-summary-value ${impact.firstBatchRisks ? "number-negative" : ""}">${impact.firstBatchRisks}</div></div>
        </div>
        <div class="editor-toolbar">
          <div class="editor-mode-switch" aria-label="录入模式">
            ${[["sales", "销售预测"], ["supply", "供应计划"], ["review", "联合复核"]].map(([mode, label]) => `<button class="${state.editorMode === mode ? "active" : ""}" data-action="editor-mode" data-mode="${mode}">${label}</button>`).join("")}
          </div>
          <input class="editor-search" id="editorSearch" data-editor-filter="search" value="${escapeProjectHtml(state.editorFilters.search)}" placeholder="搜索SKU或产品">
          <button class="chip ${state.editorFilters.changedOnly ? "active" : ""}" data-action="editor-filter" data-filter="changedOnly">仅看有变化</button>
          <button class="chip ${state.editorFilters.gapOnly ? "danger" : ""}" data-action="editor-filter" data-filter="gapOnly">仅看缺口</button>
          <button class="chip ${state.editorFilters.firstBatchOnly ? "warn" : ""}" data-action="editor-filter" data-filter="firstBatchOnly">仅看首批</button>
          <span class="editor-toolbar-spacer"></span>
          <button class="btn" data-action="toggle-paste" ${hasWritableField ? "" : "disabled"}>粘贴表格</button>
          <button class="btn" data-action="import-grid" ${hasWritableField ? "" : "disabled"}>导入CSV</button>
          <button class="btn" data-action="open-bulk" ${state.selectedSkus.length && hasWritableField ? "" : "disabled"}>批量调整 (${state.selectedSkus.length})</button>
        </div>
        <div class="paste-area ${state.showPaste ? "active" : ""}" style="min-height:0">
          <textarea id="pasteArea" style="width:100%;min-height:70px;border:0;resize:vertical" placeholder="SKU,月份,需求,供应,备注">${escapeProjectHtml(state.pasteDraft || "")}</textarea>
          <div class="helper-note" style="margin-top:5px">仅应用当前部门可编辑字段；已锁定字段自动跳过。</div>
          <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:6px"><button class="btn" data-action="toggle-paste">取消</button><button class="btn primary" data-action="apply-paste">校验并应用</button></div>
        </div>
        <input class="hidden-input" id="fileInput" type="file" accept=".csv,.tsv">
        <div class="plan-matrix-wrap">
          <table class="plan-edit-matrix">
            <thead>
              <tr>
                <th class="select-col" rowspan="2"><input type="checkbox" data-action="select-page-skus" ${allSelected ? "checked" : ""} aria-label="选择当前页全部SKU"></th>
                <th class="sku-col" rowspan="2">SKU / 产品</th>
                <th class="inventory-col" rowspan="2">当前库存</th>
                ${MONTHS.map((month) => `<th class="month-group" colspan="4">${month.label}</th>`).join("")}
                <th class="risk-col-edit" rowspan="2">风险</th>
              </tr>
              <tr>${MONTHS.map(() => `<th class="metric-col">预测</th><th class="metric-col">供应</th><th class="metric-col">差</th><th class="metric-col">EOH</th>`).join("")}</tr>
            </thead>
            <tbody>
              ${rows.map((product) => renderPlanMatrixRow(product)).join("") || `<tr><td colspan="16" style="padding:28px;text-align:center;color:var(--muted)">当前筛选范围内没有产品。</td></tr>`}
            </tbody>
          </table>
        </div>
        ${renderEditorMatrixLegend()}
        <div class="editor-pagination">
          <span>显示 ${products.length ? start + 1 : 0}-${Math.min(start + state.editorPageSize, products.length)} / ${products.length} 个SKU · 每页${state.editorPageSize}</span>
          <span><button class="chip" data-action="editor-page" data-page="${state.editorPage - 1}" ${state.editorPage <= 1 ? "disabled" : ""}>上一页</button> <strong>${state.editorPage}/${pageCount}</strong> <button class="chip" data-action="editor-page" data-page="${state.editorPage + 1}" ${state.editorPage >= pageCount ? "disabled" : ""}>下一页</button></span>
        </div>
      `;
    }

    function renderPlanMatrixRow(product) {
      const selected = state.selectedSkus.includes(product.model);
      const hasNote = MONTHS.some((month) => Boolean(product.plans[month.key]?.comment));
      return `
        <tr>
          <td class="select-col"><input type="checkbox" data-action="select-sku" data-model="${product.model}" ${selected ? "checked" : ""} aria-label="选择${product.model}"></td>
          <td class="sku-col">
            <div class="sku-edit-mainline"><strong>${product.model}</strong><button class="note-icon-btn ${hasNote ? "has-note" : ""}" data-action="open-note" data-model="${product.model}" title="编辑月度备注">注</button></div>
            <div class="sku-sub">${product.name} · ${salesText(product.lifecycle)}</div>
          </td>
          <td class="inventory-col">${formatNumber(product.currentInventory)}</td>
          ${product.months.map((metric) => {
            const plan = product.plans[metric.key] || { demand: 0, supply: 0 };
            const firstBatchClass = metric.isFirstBatch ? `first-batch-edit fb-${metric.fbStatus}` : "";
            return `${renderPlanEditorCell(product.model, metric.key, "demand", plan.demand, firstBatchClass)}${renderPlanEditorCell(product.model, metric.key, "supply", plan.supply, firstBatchClass)}<td class="${firstBatchClass} ${metric.gap < 0 ? "number-negative" : "number-positive"}">${signed(metric.gap)}</td><td class="${firstBatchClass} ${metric.eoh < 0 ? "number-negative" : "number-positive"}">${compact(metric.eoh)}</td>`;
          }).join("")}
          <td><span class="risk-pill ${product.risk.toLowerCase()}">${salesText(product.risk)}</span></td>
        </tr>
      `;
    }

    function renderPlanEditorCell(model, month, field, value, cellClass = "") {
      const changed = isPlanCellChanged(model, month, field, value);
      if (canEditPlanField(field)) {
        return `<td class="${cellClass}"><input class="plan-cell-input ${changed ? "changed" : ""}" data-plan-input data-edit-field="${field}" data-model="${model}" data-month="${month}" data-original-value="${Number(value || 0)}" inputmode="numeric" value="${Number(value || 0)}"></td>`;
      }
      return `<td class="${cellClass} plan-readonly-cell"><span class="plan-cell-readonly ${changed ? "changed" : ""}">${compact(Number(value || 0))}</span></td>`;
    }

    function renderEditorMatrixLegend() {
      return `
        <div class="editor-matrix-legend" aria-label="计划录入表格颜色与数据标识说明">
          <span><span class="legend-change-sample"></span>蓝色/蓝边：相较上月正式版本有变化</span>
          <span><span class="legend-readonly-sample"></span>只读：非当前部门可编辑字段</span>
          <span><span class="legend-dot" style="background:var(--red)"></span>红色数值：供需差或EOH为负</span>
          <span><span class="legend-dot" style="background:var(--green)"></span>绿色数值：供需差或EOH非负</span>
          <span><span class="fb-edge-key risk"></span>顶部红线：首批风险</span>
          <span><span class="fb-edge-key watch"></span>顶部橙线：首批关注</span>
          <span><span class="fb-edge-key ok"></span>顶部绿线：首批正常</span>
          <span>差 = 供应 - 预测</span>
          <span>EOH = 月末库存</span>
        </div>
      `;
    }

    function renderWorkflowAction(key, status) {
      const role = state.collaborationRole || "admin";
      const isAdmin = role === "admin";
      if (key === "sales") {
        if (status === "submitted") return isAdmin ? `<button class="chip" data-action="reopen-step" data-step="sales">重新打开</button>` : `<span class="helper-note">已提交</span>`;
        if (status === "in_progress" && ["admin", "sales"].includes(role)) return `<button class="chip" data-action="open-plan-entry" data-mode="sales">继续录入</button>`;
        return `<span class="helper-note">仅查看</span>`;
      }
      if (key === "supply") {
        if (status === "submitted") return isAdmin ? `<button class="chip" data-action="reopen-step" data-step="supply">重新打开</button>` : `<span class="helper-note">已提交</span>`;
        if (status === "in_progress" && ["admin", "supply"].includes(role)) return `<button class="chip" data-action="open-plan-entry" data-mode="supply">继续录入</button>`;
        return `<span class="helper-note">${status === "pending" ? "等待销售" : "仅查看"}</span>`;
      }
      if (key === "review") {
        if (status === "approved") return `<span class="helper-note">已完成</span>`;
        if (isAdmin) return `<button class="chip" data-action="approve-review" ${state.workflow.supply.status !== "submitted" ? "disabled" : ""}>完成复核</button>`;
        return `<span class="helper-note">仅管理员操作</span>`;
      }
      if (status === "published") return `<span class="helper-note">已发布</span>`;
      if (isAdmin) return `<button class="chip" data-action="publish-snapshot" ${state.workflow.review.status !== "approved" ? "disabled" : ""}>发布正式版本</button>`;
      return `<span class="helper-note">仅管理员操作</span>`;
    }

    function renderVersionHistoryTab() {
      return `
        <div class="editor-toolbar"><span class="helper-note">选择历史版本与当前草稿对比；恢复操作只会创建新草稿。</span><span class="editor-toolbar-spacer"></span><button class="btn" data-action="version-compare" data-version-id="${state.snapshots[0]?.id || "current-draft"}">对比上月版本与当前草稿</button></div>
        <table class="archive-table">
          <thead><tr><th>版本</th><th>状态</th><th>日期</th><th>发布人</th><th>说明</th><th>操作</th></tr></thead>
          <tbody>
            ${versionRecords().map((snapshot) => `
              <tr>
                <td><strong>${salesText(snapshot.name)}</strong></td>
                <td><span class="status-tag ${snapshot.id === "current-draft" ? "active" : "published"}">${snapshot.id === "current-draft" ? "协同草稿" : salesText(snapshot.status)}</span></td>
                <td>${salesText(snapshot.date)}</td>
                <td>${snapshot.owner || "--"}</td>
                <td>${salesText(snapshot.note)}</td>
                <td><button class="chip" data-action="version-compare" data-version-id="${snapshot.id}">对比</button> <button class="chip" data-action="version-detail" data-version-id="${snapshot.id}">查看记录</button>${snapshot.id !== "current-draft" ? ` <button class="chip warn" data-action="version-restore" data-version-id="${snapshot.id}">创建草稿</button>` : ""}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderChangeLogTab() {
      const batches = state.changeBatches.filter((batch) => state.logFilter === "all" || batch.type === state.logFilter);
      return `
        <div class="editor-toolbar">
          <div class="editor-mode-switch">${[["all", "全部"], ["monthly", "月度更新"], ["temporary", "临时变更"]].map(([filter, label]) => `<button class="${state.logFilter === filter ? "active" : ""}" data-action="log-filter" data-filter="${filter}">${label}</button>`).join("")}</div>
          <span class="helper-note">默认按提交批次归组，展开后查看单元格明细。</span>
          <span class="editor-toolbar-spacer"></span>
          <button class="btn primary" data-action="new-temporary-change">发起临时变更</button>
        </div>
        <table class="batch-table">
          <thead><tr><th>更新批次</th><th>类型</th><th>影响范围</th><th>变化摘要</th><th>提交人</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
          <tbody>
            ${batches.map((batch) => `
              <tr><td><strong>${batch.title}</strong><div class="sku-sub">${batch.reason}</div></td><td>${batch.type === "temporary" ? "临时变更" : batch.function === "sales" ? "月度预测" : "月度供应"}</td><td>${new Set((batch.lines || []).map((line) => line.sku)).size}个SKU / ${(batch.lines || []).length}项</td><td>${batchSummary(batch)}</td><td>${batch.owner}</td><td><span class="status-tag ${batch.type === "temporary" ? "temporary" : workflowStatusClass(batch.status)}">${batch.status === "approved" ? "已审批" : workflowStatusLabel(batch.status)}</span></td><td>${batch.time}</td><td><button class="chip" data-action="toggle-batch" data-batch-id="${batch.id}">${state.expandedBatchId === batch.id ? "收起" : "展开"}</button></td></tr>
              ${state.expandedBatchId === batch.id ? `<tr class="batch-detail-row"><td colspan="8">${renderBatchDetails(batch)}</td></tr>` : ""}
            `).join("") || `<tr><td colspan="8" style="padding:24px;text-align:center;color:var(--muted)">当前筛选范围内没有变更批次。</td></tr>`}
          </tbody>
        </table>
      `;
    }

    function renderBatchDetails(batch) {
      return `<div class="batch-detail"><table class="version-diff-table"><thead><tr><th>SKU</th><th>月份</th><th>字段</th><th>修改前</th><th>修改后</th><th>变化</th><th>原因</th></tr></thead><tbody>${(batch.lines || []).map((line) => `<tr><td><strong>${line.sku}</strong></td><td>${monthLabel(line.month)}</td><td>${planFieldLabel(line.field)}</td><td>${formatNumber(line.before)}</td><td>${formatNumber(line.after)}</td><td class="${Number(line.after) - Number(line.before) >= 0 ? "number-positive" : "number-negative"}">${signed(Number(line.after) - Number(line.before))}</td><td>${line.reason || batch.reason}</td></tr>`).join("")}</tbody></table></div>`;
    }

    function renderEditorDrawer() {
      const drawer = state.editorDrawer;
      if (!drawer) return "";
      if (drawer.type === "compare") return renderVersionCompareDrawer(drawer.versionId);
      if (drawer.type === "detail") return renderVersionDetailDrawer(drawer.versionId, false);
      if (drawer.type === "restore") return renderVersionDetailDrawer(drawer.versionId, true);
      if (drawer.type === "note") return renderNoteDrawer(drawer.model);
      if (drawer.type === "bulk") return renderBulkDrawer();
      if (drawer.type === "temporary") return renderTemporaryChangeDrawer();
      if (drawer.type === "reopen") return renderReopenDrawer(drawer.step);
      if (drawer.type === "submit") return renderSubmitConfirmationDrawer(drawer.step);
      return "";
    }

    function editorDrawerShell(title, subtitle, body, footer = "") {
      return `<div class="editor-drawer-scrim" data-action="close-editor-drawer"></div><aside class="editor-side-drawer" role="dialog" aria-modal="true" aria-label="${title}"><div class="editor-drawer-head"><div><strong>${title}</strong><div class="sku-sub">${subtitle}</div></div><button class="icon-btn" data-action="close-editor-drawer" aria-label="关闭">×</button></div><div class="editor-drawer-body">${body}</div>${footer ? `<div class="editor-drawer-foot">${footer}</div>` : ""}</aside>`;
    }

    function renderVersionCompareDrawer(versionId) {
      const base = versionRecord(versionId === "current-draft" ? state.snapshots[0]?.id : versionId);
      const target = versionRecord("current-draft");
      const rows = versionDiff(base.products || state.baselineProducts, target.products);
      const demandDelta = rows.filter((row) => row.field === "demand").reduce((sum, row) => sum + row.delta, 0);
      const supplyDelta = rows.filter((row) => row.field === "supply").reduce((sum, row) => sum + row.delta, 0);
      const skus = new Set(rows.map((row) => row.sku)).size;
      const body = `<div class="diff-summary"><div><div class="meta-label">变化SKU</div><div class="meta-value">${skus}</div></div><div><div class="meta-label">预测变化</div><div class="meta-value">${signed(demandDelta)}</div></div><div><div class="meta-label">供应变化</div><div class="meta-value">${signed(supplyDelta)}</div></div></div><table class="version-diff-table"><thead><tr><th>SKU</th><th>月份</th><th>字段</th><th>原值</th><th>新值</th><th>变化</th><th>EOH影响</th></tr></thead><tbody>${rows.map((row) => `<tr><td><strong>${row.sku}</strong></td><td>${monthLabel(row.month)}</td><td>${planFieldLabel(row.field)}</td><td>${formatNumber(row.before)}</td><td>${formatNumber(row.after)}</td><td class="${row.delta >= 0 ? "number-positive" : "number-negative"}">${signed(row.delta)}</td><td class="${row.eohDelta >= 0 ? "number-positive" : "number-negative"}">${signed(row.eohDelta)}</td></tr>`).join("") || `<tr><td colspan="7">两个版本没有差异。</td></tr>`}</tbody></table>`;
      return editorDrawerShell("版本对比", `${base.name} → ${target.name}`, body, `<span class="helper-note">共 ${rows.length} 项字段变化</span><button class="btn" data-action="close-editor-drawer">完成</button>`);
    }

    function renderVersionDetailDrawer(versionId, restoreMode) {
      const version = versionRecord(versionId);
      const related = state.changeBatches.filter((batch) => versionId === "current-draft" || batch.status === "submitted" || batch.status === "approved");

    function renderNoteDrawer(model) {

    function renderTemporaryChangeDrawer() {
      const draft = state.temporaryChangeDraft || { model: state.products[0].model, month: MONTHS[0].key, field: "demand", value: state.products[0].plans[MONTHS[0].key].demand, urgency: "normal", reason: "" };
      state.temporaryChangeDraft = draft;
      const product = state.products.find((item) => item.model === draft.model);
      const before = Number(product?.plans?.[draft.month]?.[draft.field] || 0);
      const delta = Number(draft.value || 0) - before;
      const body = `<div class="drawer-form-grid"><div class="drawer-form-field"><label>SKU</label><select data-temp-field="model">${state.products.map((item) => `<option value="${item.model}" ${item.model === draft.model ? "selected" : ""}>${item.model} · ${item.name}</option>`).join("")}</select></div><div class="drawer-form-field"><label>影响月份</label><select data-temp-field="month">${MONTHS.map((month) => `<option value="${month.key}" ${month.key === draft.month ? "selected" : ""}>${month.label}</option>`).join("")}</select></div><div class="drawer-form-field"><label>变更字段</label><select data-temp-field="field"><option value="demand" ${draft.field === "demand" ? "selected" : ""}>销售预测</option><option value="supply" ${draft.field === "supply" ? "selected" : ""}>供应计划</option></select></div><div class="drawer-form-field"><label>紧急程度</label><select data-temp-field="urgency"><option value="normal" ${draft.urgency === "normal" ? "selected" : ""}>常规</option><option value="urgent" ${draft.urgency === "urgent" ? "selected" : ""}>紧急</option></select></div><div class="drawer-form-field"><label>当前值</label><input value="${before}" disabled></div><div class="drawer-form-field"><label>调整后</label><input type="number" min="0" data-temp-field="value" value="${draft.value}"></div><div class="drawer-form-field span-2"><label>变更原因</label><textarea data-temp-field="reason" placeholder="说明临时变化原因、责任人和业务影响">${escapeProjectHtml(draft.reason)}</textarea></div></div><div class="delay-warning" style="margin-top:9px">本次变化 ${signed(delta)}。提交后加入当前草稿并进入管理员审批，不直接覆盖已发布版本。</div>`;

    function renderReopenDrawer(step) {
      const draft = state.reopenDraft || { step, reason: "" };
      state.reopenDraft = draft;
      const isSales = step === "sales";
      const title = isSales ? "重新打开销售预测" : "重新打开供应计划";
      const impact = isSales
        ? "销售预测重新开放后，供应响应将退回待开始，联合复核结果同时失效。"

    function submissionReviewData(step) {
      const field = step === "sales" ? "demand" : "supply";
      const rows = versionDiff(state.baselineProducts, state.products).filter((row) => row.field === field);
      const changedSkus = new Set(rows.map((row) => row.sku)).size;
      const netDelta = rows.reduce((sum, row) => sum + row.delta, 0);
      const missingNotes = rows.filter((row) => {
        const product = state.products.find((item) => item.model === row.sku);
        return !String(product?.plans?.[row.month]?.comment || "").trim();
      }).length;
      const impact = editorImpactSummary();
      return { rows, changedSkus, netDelta, missingNotes, impact };
    }

    function renderSubmitConfirmationDrawer(step) {
      const isSales = step === "sales";
      const review = submissionReviewData(step);
      const title = isSales ? "提交销售预测" : "提交供应计划";
      const body = `
        <div class="delay-warning">确认后系统会先保存最后修改，再提交并锁定${isSales ? "销售预测" : "供应计划"}字段。后续修改需要由总管理员重新打开。</div>
        <div class="submit-review-grid" style="margin-top:10px">
          <div class="submit-review-item"><div class="submit-review-label">变化SKU</div><div class="submit-review-value">${review.changedSkus}</div></div>
          <div class="submit-review-item"><div class="submit-review-label">变化字段</div><div class="submit-review-value">${review.rows.length}</div></div>
          <div class="submit-review-item"><div class="submit-review-label">净变化</div><div class="submit-review-value ${review.netDelta >= 0 ? "number-positive" : "number-negative"}">${signed(review.netDelta)}</div></div>
          <div class="submit-review-item"><div class="submit-review-label">未填写备注</div><div class="submit-review-value ${review.missingNotes ? "number-negative" : ""}">${review.missingNotes}</div></div>
        </div>
        <div class="submit-review-list">
          <div class="submit-review-row"><strong>三个月缺货SKU</strong><span class="${review.impact.stockoutCount ? "number-negative" : "number-positive"}">${review.impact.stockoutCount} 个</span></div>
          <div class="submit-review-row"><strong>首批需关注</strong><span class="${review.impact.firstBatchRisks ? "number-negative" : "number-positive"}">${review.impact.firstBatchRisks} 个</span></div>
          <div class="submit-review-row"><strong>提交后下一环节</strong><span>${isSales ? "供应响应" : "联合复核"}</span></div>
        </div>
        ${review.missingNotes ? `<div class="helper-note" style="margin-top:9px">缺少备注不会阻止提交，但建议为重要变化补充原因和负责人。</div>` : ""}
      `;
      const footer = `<span>${autosaveStatusMarkup("sales-plan")}</span><span style="display:flex;gap:7px"><button class="btn" data-action="close-editor-drawer">返回检查</button><button class="btn primary" data-action="confirm-submit-step" data-step="${step}">确认提交并锁定</button></span>`;
      return editorDrawerShell(title, `${isSales ? "销售" : "供应"}月度更新 · 提交前检查`, body, footer);
    }

        actualSupply: product.months[0].supply
