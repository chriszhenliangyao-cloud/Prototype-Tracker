<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产销计划管理工具</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-soft: #fbfcff;
      --line: #dce3ef;
      --line-strong: #c7d2e2;
      --text: #172033;
      --muted: #65738a;
      --soft: #8a97aa;
      --blue: #225be8;
      --blue-soft: #edf3ff;
      --green: #11845b;
      --green-soft: #eaf8f1;
      --red: #e4232f;
      --red-soft: #fff0f1;
      --orange: #d96a00;
      --orange-soft: #fff5e8;
      --shadow: 0 18px 48px rgba(26, 36, 55, 0.16);
      --radius: 8px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .app {
      min-width: 1080px;
      padding: 10px 12px 14px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      letter-spacing: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 10px;
      white-space: nowrap;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .filterbar {
      display: flex;
      align-items: end;
      gap: 7px;
      padding: 8px 10px;
      margin-bottom: 8px;
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .filterbar .toggle {
      flex: 0 0 auto;
    }

    .control {
      display: grid;
      gap: 3px;
      min-width: 108px;
      flex: 0 0 auto;
    }

    .control label {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    select,
    .btn,
    .segmented,
    .toggle {
      border: 1px solid var(--line-strong);
      background: var(--panel);
      border-radius: 6px;
      min-height: 30px;
    }

    select {
      padding: 0 26px 0 8px;
      color: var(--text);
      font-size: 11px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 10px;
      color: var(--text);
      font-weight: 700;
      font-size: 11px;
      white-space: nowrap;
    }

    .btn:hover,
    select:hover,
    .segmented button:hover {
      border-color: #9fb1cd;
      background: #fcfdff;
    }

    .btn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .btn.subtle {
      background: var(--blue-soft);
      border-color: #bdd0ff;
      color: var(--blue);
    }

    .btn.danger {
      background: #fff8f8;
      border-color: #ffb4b6;
      color: var(--red);
    }

    .segmented {
      display: inline-flex;
      overflow: hidden;
    }

    .segmented button {
      min-width: 48px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 0 9px;
      font-weight: 700;
      font-size: 11px;
    }

    .segmented button:last-child {
      border-right: 0;
    }

    .segmented button.active {
      background: var(--blue);
      color: #fff;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
      border-color: transparent;
      background: transparent;
      color: var(--text);
      white-space: nowrap;
      font-size: 11px;
    }

    .switch {
      width: 30px;
      height: 16px;
      border-radius: 999px;
      background: #cbd4e1;
      position: relative;
      flex: 0 0 auto;
    }

    .switch::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      top: 2px;
      left: 2px;
      border-radius: 50%;
      background: #fff;
      transition: transform 160ms ease;
    }

    .toggle.active .switch {
      background: var(--blue);
    }

    .toggle.active .switch::after {
      transform: translateX(14px);
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .kpi {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 11px;
      min-height: 68px;
      display: grid;
      gap: 2px;
    }

    .kpi-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 9px;
      font-weight: 800;
    }

    .kpi-value {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .delta {
      font-size: 10px;
      border-radius: 999px;
      padding: 2px 6px;
      font-weight: 800;
      background: var(--red-soft);
      color: var(--red);
    }

    .kpi-foot {
      color: var(--muted);
      font-size: 10px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 316px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      gap: 10px;
    }

    .panel-title {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-weight: 800;
      font-size: 10px;
      margin-left: 4px;
    }

    .chips {
      display: flex;
      gap: 5px;
      padding: 7px 9px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }

    .chip {
      min-height: 24px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--panel);
      color: var(--blue);
      padding: 0 7px;
      font-weight: 800;
      font-size: 10px;
    }

    .chip.active {
      color: var(--blue);
      border-color: #9ab6f5;
      background: #f2f6ff;
    }

    .chip.danger {
      color: var(--red);
      border-color: #ffbdc1;
      background: #fff8f8;
    }

    .chip.warn {
      color: var(--orange);
      border-color: #ffc780;
      background: #fffaf2;
    }

    .matrix-table,
    .history-table,
    .edit-grid,
    .archive-table,
    .heatmap-table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      vertical-align: middle;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    th {
      background: #f8fafd;
      color: #52617a;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.03em;
      font-weight: 800;
      padding: 7px 5px;
      text-align: center;
    }

    .exception-panel {
      position: sticky;
      top: 8px;
    }

    .exception-summary {
      color: var(--muted);
      font-size: 9px;
      white-space: nowrap;
    }

    .exception-list {
      max-height: calc(100vh - 250px);
      min-height: 280px;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }

    .exception-item {
      width: 100%;
      display: grid;
      gap: 4px;
      padding: 8px 10px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      text-align: left;
      transition: background 140ms ease;
    }

    .exception-item:hover,
    .exception-item:focus-visible {
      background: #f7faff;
      outline: 0;
    }

    .exception-item:last-child {
      border-bottom: 0;
    }

    .exception-topline,
    .exception-mainline,
    .exception-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .exception-type {
      display: inline-flex;
      align-items: center;
      min-height: 18px;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 9px;
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
      border: 1px solid currentColor;
      white-space: nowrap;
    }

    .type-stockout,
    .type-1st-batch-risk {
      color: var(--red);
      background: #fff7f7;
    }

    .type-gap,
    .type-1st-batch-watch {
      color: var(--orange);
      background: #fff9f1;
    }

    .type-1st-batch-ok {
      color: var(--green);
      background: #f4fff9;
    }

    .exception-month {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .exception-mainline .sku-main {
      min-width: 0;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .exception-issue {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 900;
    }

    .exception-metrics {
      justify-content: flex-start;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .exception-metrics span {
      white-space: nowrap;
    }

    .exception-empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
    }

    .sku-main {
      font-weight: 800;
      color: var(--text);
      font-size: 11px;
    }

    .sku-sub {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
      margin-top: 2px;
    }

    .issue-main {
      font-weight: 800;
    }

    .issue-main.negative {
      color: var(--red);
    }

    .issue-main.warn {
      color: var(--orange);
    }

    .issue-main.ok {
      color: var(--green);
    }

    .view-shell {
      display: none;
    }

    .view-shell.active {
      display: block;
    }

    .matrix-wrap {
      overflow-x: auto;
    }

    .matrix-table {
      min-width: 1020px;
      table-layout: fixed;
    }

    .matrix-table td {
      padding: 6px 5px;
      text-align: center;
      height: 66px;
    }

    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--panel);
    }

    .sticky-product {
      position: sticky;
      left: 78px;
      z-index: 2;
      background: var(--panel);
    }

    th.sticky-col,
    th.sticky-product {
      z-index: 3;
      background: #f8fafd;
    }

    .model-cell {
      width: 78px;
      font-weight: 900;
    }

    .product-cell {
      width: 126px;
      text-align: left;
    }

    .small-col {
      width: 72px;
    }

    .month-col {
      width: 118px;
    }

    .total-col {
      width: 122px;
      background: #eef3fb;
      border-left: 2px solid #b8c7dd;
    }

    .risk-col {
      width: 74px;
    }

    .lifecycle-pill,
    .risk-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      border-radius: 5px;
      padding: 3px 5px;
      border: 1px solid var(--line-strong);
      font-weight: 800;
      font-size: 10px;
    }

    .lifecycle-pill.new {
      background: var(--green-soft);
      color: var(--green);
      border-color: #b9dfcd;
    }

    .lifecycle-pill.launched {
      background: var(--blue-soft);
      color: var(--blue);
      border-color: #bfd0ff;
    }

    .risk-pill.stockout,
    .risk-pill.high {
      background: #fff8f8;
      border-color: #ffaaa8;
      color: var(--red);
    }

    .risk-pill.watch {
      background: #fffaf2;
      border-color: #ffc780;
      color: var(--orange);
    }

    .risk-pill.low {
      background: var(--green-soft);
      border-color: #b9dfcd;
      color: var(--green);
    }

    .month-card {
      position: relative;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 6px;
      padding: 6px 7px;
      min-height: 56px;
      display: grid;
      gap: 2px;
    }

    .month-card.severe {
      border-color: #ffb4b6;
      background: var(--red-soft);
    }

    .month-card.warn {
      border-color: #ffd09a;
      background: var(--orange-soft);
    }

    .month-card.ok {
      border-color: #cae9da;
      background: #fbfffd;
    }

    .month-card.first-batch::before {
      content: "";
      position: absolute;
      z-index: 1;
      top: -1px;
      right: -1px;
      left: -1px;
      height: 4px;
      border-radius: 6px 6px 0 0;
      background: var(--fb-color);
    }

    .month-card.first-batch.fb-risk {
      --fb-color: var(--red);
    }

    .month-card.first-batch.fb-watch {
      --fb-color: var(--orange);
    }

    .month-card.first-batch.fb-ok {
      --fb-color: var(--green);
    }

    .month-card.total-card {
      background: #f4f7fc;
      border-color: #b8c7dd;
      align-content: center;
    }

    .metric-line {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      line-height: 1.1;
    }

    .metric-line .label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      min-width: 22px;
    }

    .metric-line .value {
      color: var(--text);
      font-weight: 800;
      font-size: 11px;
    }

    .metric-line.gap .label,
    .metric-line.gap .value {
      font-size: 11px;
      color: var(--red);
      font-weight: 900;
    }

    .metric-line.gap.positive .label,
    .metric-line.gap.positive .value,
    .metric-line.eoh.positive .label,
    .metric-line.eoh.positive .value {
      color: var(--green);
    }

    .metric-line.eoh .label,
    .metric-line.eoh .value {
      color: var(--red);
      font-weight: 900;
    }

    .fb-edge-key {
      width: 28px;
      height: 13px;
      border: 1px solid var(--line-strong);
      border-top: 4px solid currentColor;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 5px;
      background: #fff;
      vertical-align: middle;
    }

    .fb-edge-key.risk {
      color: var(--red);
    }

    .fb-edge-key.watch {
      color: var(--orange);
    }

    .fb-edge-key.ok {
      color: var(--green);
    }

    .matrix-total-row td {
      background: #eef3fb;
      border-top: 2px solid #9fb1cd;
      border-bottom: 0;
      font-weight: 800;
    }

    .matrix-total-row .sticky-col,
    .matrix-total-row .sticky-product {
      background: #eef3fb;
      z-index: 3;
    }

    .total-label {
      color: #17305f;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .number-negative {
      color: var(--red);
      font-weight: 900;
    }

    .number-positive {
      color: var(--green);
      font-weight: 900;
    }

    .highlight-cell {
      outline: 3px solid rgba(34, 91, 232, 0.35);
      outline-offset: 2px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 9px;
      flex-wrap: wrap;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .trend-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(430px, 0.85fr);
      gap: 8px;
    }

    .chart-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      min-height: 250px;
    }

    .chart-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }

    .chart-title h3 {
      margin: 0;
      font-size: 13px;
    }

    .chart-note {
      color: var(--muted);
      font-size: 10px;
    }

    svg text {
      font-family: inherit;
    }

    .heatmap-table td,
    .heatmap-table th {
      padding: 7px 6px;
      text-align: center;
    }

    .heatmap-table .sku-col {
      text-align: left;
      font-weight: 900;
      width: 96px;
    }

    .heat-severe {
      background: #ffd7d9;
      color: var(--red);
      font-weight: 900;
    }

    .heat-warn {
      background: #ffefd9;
      color: var(--orange);
      font-weight: 900;
    }

    .heat-ok {
      background: #e9f8f1;
      color: var(--green);
      font-weight: 900;
    }

    .heat-first-batch {
      box-shadow: inset 0 4px var(--fb-color);
    }

    .heat-first-batch.fb-risk {
      --fb-color: var(--red);
    }

    .heat-first-batch.fb-watch {
      --fb-color: var(--orange);
    }

    .heat-first-batch.fb-ok {
      --fb-color: var(--green);
    }

    .action-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .action-card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 9px;
      display: grid;
      gap: 3px;
    }

    .action-card.high {
      border-color: #ffb4b6;
      background: #fff8f8;
    }

    .action-card.medium {
      border-color: #ffd09a;
      background: #fffaf4;
    }

    .action-rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-weight: 900;
      margin-right: 5px;
    }

    .action-head {
      font-weight: 900;
      color: var(--text);
    }

    .action-copy {
      color: var(--muted);
      font-size: 10px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 31, 49, 0.2);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      width: min(820px, 92vw);
      max-height: 88vh;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .modal.large {
      width: min(980px, 94vw);
    }

    .modal.planner-modal {
      width: min(1480px, calc(100vw - 40px));
      height: min(760px, 94vh);
      max-height: 94vh;
      flex: 0 0 auto;
    }

    .planner-modal .modal-body {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }

    .planner-context {
      flex: 0 0 auto;
      padding: 8px 12px 0;
      border-bottom: 1px solid var(--line);
      background: #fbfcff;
    }

    .planner-context .meta-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin-bottom: 5px;
    }

    .planner-context .meta-box {
      padding: 5px 7px;
    }

    .planner-context .tabs {
      margin-bottom: 0;
    }

    .planner-tab-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 9px 12px 12px;
    }

    .editor-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 6px;

    function updateAutosaveStatus(scope, status, text) {
      const entry = autosaveEntry(scope);
      entry.status = status;
      entry.text = text;
      document.querySelectorAll(`[data-autosave-status="${scope}"]`).forEach((node) => {
        node.classList.remove("saving", "saved", "error");
        node.classList.add(status);
        const label = node.querySelector("[data-autosave-text]");
        if (label) label.textContent = text;
      });
    }

    async function performAutosave(scope) {
      const entry = autosaveEntry(scope);
      const saver = entry.saver;
      entry.timer = null;
      if (!saver) return;
      updateAutosaveStatus(scope, "saving", "正在保存...");
      try {
        await saver();
        if (!entry.timer && entry.saver === saver) updateAutosaveStatus(scope, "saved", "刚刚自动保存");
      } catch (error) {
        updateAutosaveStatus(scope, "error", "自动保存失败");
      }
    }

    function scheduleAutosave(scope, saver, delay = 450) {
      const entry = autosaveEntry(scope);
      if (entry.timer) clearTimeout(entry.timer);
      entry.saver = saver;
      updateAutosaveStatus(scope, "saving", "等待自动保存...");
      entry.timer = setTimeout(() => performAutosave(scope), delay);
    }

    async function flushAutosave(scope) {
      const entry = autosaveEntry(scope);
      if (!entry.timer) return;
      clearTimeout(entry.timer);
      entry.timer = null;
      await performAutosave(scope);
    }

    function projectCloseoutProgress(project) {
      const activeStreams = PROJECT_WORKSTREAMS.map((meta) => project.workstreams[meta.key]).filter((stream) => stream && stream.health !== "grey");
      const remaining = activeStreams.reduce((sum, stream) => sum + Math.max(0, Number(stream.total || 0) - Number(stream.done || 0)), 0);
      const blockers = activeStreams.reduce((sum, stream) => sum + stream.tasks.filter((task) => task.status === "Blocked").length, 0);
      return { remaining, blockers, ready: remaining === 0 && blockers === 0 };
    }

    function buildProjectDelayPreview(project, draft) {
      if (!project || !draft) return null;
      const anchorIndex = Math.max(0, PROJECT_GATES.indexOf(draft.anchorGate));
      const oldAnchorDate = projectGateISO(project, anchorIndex);
      const delayDays = projectDelayDays(oldAnchorDate, draft.newDate);
      const gateIndexes = draft.propagation === "anchor_only"
        ? [anchorIndex]
        : PROJECT_GATES.map((gate, index) => index).filter((index) => index >= anchorIndex);
      const gateChanges = gateIndexes.map((index) => {
        const oldDate = projectGateISO(project, index);
        return { entityType: "gate", entityId: PROJECT_GATES[index], index, label: projectStageLabel(PROJECT_GATES[index]), oldDate, newDate: shiftProjectISO(oldDate, delayDays) };
      });
      const workstreamChanges = [];
      const taskChanges = [];
      if (draft.propagation === "all_downstream") {
        const sourceWorkstreamIndex = PROJECT_WORKSTREAMS.findIndex((meta) => meta.key === draft.sourceWorkstream);
        PROJECT_WORKSTREAMS.forEach((meta, workstreamIndex) => {
          const stream = project.workstreams[meta.key];
          if (!stream || stream.health === "grey" || stream.done >= stream.total) return;
          const oldDate = stream.dueISO || projectDueToISO(stream.due);
          const isDownstreamWorkstream = sourceWorkstreamIndex >= 0 && workstreamIndex >= sourceWorkstreamIndex;
          if (!isDownstreamWorkstream && oldDate < oldAnchorDate) return;
          workstreamChanges.push({ entityType: "workstream", entityId: meta.key, label: meta.label, oldDate, newDate: shiftProjectISO(oldDate, delayDays) });
          stream.tasks.forEach((task, taskIndex) => {
            if (task.status === "Completed") return;
            const taskOldDate = task.dueISO || projectDueToISO(task.due);
            if (!isDownstreamWorkstream && taskOldDate < oldAnchorDate) return;
            taskChanges.push({ entityType: "task", entityId: `${meta.key}:${taskIndex}`, workstreamKey: meta.key, taskIndex, label: projectText(task.name), oldDate: taskOldDate, newDate: shiftProjectISO(taskOldDate, delayDays) });
          });
        });
      }
      const launchChange = gateChanges.find((item) => item.entityId === "Launch");
      return {
        anchorIndex,
        oldAnchorDate,
        delayDays,
        gateChanges,
        workstreamChanges,
        taskChanges,
        oldLaunchDate: project.launchDate,
        newLaunchDate: launchChange?.newDate || project.launchDate,
        allChanges: [...gateChanges, ...workstreamChanges, ...taskChanges]
      };
    }

    function formatNumber(value) {

    function compact(value) {
      const abs = Math.abs(value);
      if (abs >= 1000) {
        const rounded = Math.round((value / 1000) * 10) / 10;
        return rounded.toFixed(Math.abs(rounded) >= 10 || Number.isInteger(rounded) ? 0 : 1) + "K";
      }
      return String(value);
    }

    function signed(value) {
      if (value > 0) return "+" + compact(value);
      return compact(value);
    }

    function salesText(value) {
      return {
        "All Models": "全部型号",
        "All Categories": "全部类别",
        "All": "全部",
        "New": "新品",
        "Launched": "已上市",
        "Power Bank": "移动电源",
        "Wireless Charger": "无线充电器",
        "Charger": "充电器",
        "Stockout": "缺货",
        "High": "高风险",
        "Watch": "关注",
        "Low": "低风险",
        "1st Batch Risk": "首批风险",
        "1st Batch Watch": "首批关注",
        "1st Batch OK": "首批正常",
        "Gap": "供需差",
        "Stockout risk": "缺货风险",
        "First batch OK": "首批正常",
        "First batch check": "检查首批供需",
        "Published": "已发布",
        "Draft": "草稿",
        "Editing": "编辑中",
        "Today": "今天",
        "Forecast": "销售预测",
        "Supply Plan": "供应计划",
        "Comment": "备注",
        "Current user": "当前用户",
        "Connector": "系统连接器",
        "Sales": "销售",
        "Supply": "供应链",
        "Aug 2026": "2026年8月",
        "Sep 2026": "2026年9月",
        "Oct 2026": "2026年10月",
        "Jul 2026": "2026年7月",
        "Jul 31": "7月31日",
        "Jul 31, 2026": "2026年7月31日",
        "Jul Archive v3": "7月正式版 v3",
        "Aug Draft v4": "8月草稿 v4",
        "Baseline before Aug planning window": "上月正式版本，作为8月滚动计划的对比起点",
        "Current rolling plan draft": "当前滚动计划草稿",
        "Saved rolling 3-month plan draft": "已保存三个月滚动计划草稿",
        "History Sync": "历史数据同步",
        "Previous": "同步前",
        "SYSTEM": "系统"
      }[value] || value;
    }

    function monthLabel(key) {
      return MONTHS.find((month) => month.key === key)?.label || key;
    }

    function firstBatchMonth(product) {
      if (product.lifecycle !== "New") return null;
      const match = MONTHS.find((month) => Number(product.plans[month.key]?.supply || 0) > 0);
      return match ? match.key : null;
    }

    function enrichedProduct(product) {
      let eoh = Number(product.currentInventory || 0);
      const fbMonth = firstBatchMonth(product);
      const months = MONTHS.map((month) => {
        const plan = product.plans[month.key] || { demand: 0, supply: 0 };
        const demand = Number(plan.demand || 0);
        const supply = Number(plan.supply || 0);
        const gap = supply - demand;
        eoh += gap;
        const isFirstBatch = product.lifecycle === "New" && fbMonth === month.key;
        const fbStatus = isFirstBatch ? firstBatchStatus(gap, eoh) : null;
        return {
          key: month.key,
          label: month.label,
          demand,
          supply,
          gap,
          eoh,
          isFirstBatch,
          fbStatus
        };
      });
      const totalDemand = months.reduce((sum, item) => sum + item.demand, 0);
      const totalSupply = months.reduce((sum, item) => sum + item.supply, 0);
      const totalGap = totalSupply - totalDemand;
      const minEoh = Math.min(...months.map((item) => item.eoh));
      const severeGap = months.some((item) => item.gap < 0 && Math.abs(item.gap) >= Math.max(100, item.demand * 0.1));
      const recurringGap = months.filter((item) => item.gap < 0).length >= 2;
      const risk = minEoh < 0 ? "Stockout" : severeGap || recurringGap ? "High" : totalGap < 0 ? "Watch" : "Low";
      return {
        ...product,
        months,
        totalDemand,
        totalSupply,
        totalGap,
        minEoh,
        risk
      };
    }

    function firstBatchStatus(gap, eoh) {
      if (gap <= -100 || eoh < 0) return "risk";
      if (gap < 0) return "watch";
      return "ok";
    }

    function filteredProducts() {
      return state.products.map(enrichedProduct).filter((product) => {
        if (state.filters.model !== "All Models" && product.model !== state.filters.model) return false;
        if (state.filters.category !== "All Categories" && product.category !== state.filters.category) return false;
        if (state.filters.lifecycle !== "All" && product.lifecycle !== state.filters.lifecycle) return false;
        if (state.filters.onlyGap && !product.months.some((month) => month.gap < 0 || month.eoh < 0)) return false;
        if (state.filters.firstBatchOnly && !(product.lifecycle === "New" && product.months.some((month) => month.isFirstBatch))) return false;
        return true;
      });
    }

    function allEnrichedProducts() {
      return state.products.map(enrichedProduct);
    }

    function kpiData(products) {
      const demand = products.reduce((sum, product) => sum + product.totalDemand, 0);
      const supply = products.reduce((sum, product) => sum + product.totalSupply, 0);
      const monthly = MONTHS.map((month) => {
        const monthDemand = products.reduce((sum, product) => {
          const item = product.months.find((entry) => entry.key === month.key);
          return sum + (item?.demand || 0);
        }, 0);
        const monthSupply = products.reduce((sum, product) => {
          const item = product.months.find((entry) => entry.key === month.key);
          return sum + (item?.supply || 0);
        }, 0);
        return { ...month, demand: monthDemand, supply: monthSupply, gap: monthSupply - monthDemand };
      });
      const worst = monthly.reduce((current, item) => (item.gap < current.gap ? item : current), monthly[0]);
      const stockoutSku = products.filter((product) => product.months.some((month) => month.eoh < 0)).length;
      return { demand, supply, gap: supply - demand, monthly, worst, stockoutSku };
    }

    function exceptionRows(products) {
      const rows = [];
      products.forEach((product) => {
        const stockout = product.months.find((month) => month.eoh < 0);
        if (stockout) {
          rows.push({
            type: "Stockout",
            priority: 1,
            model: product.model,
            name: product.name,
            lifecycle: product.lifecycle,
            month: stockout.key,
            issue: "EOH " + signed(stockout.eoh),
            detail: "缺货风险",
            demand: stockout.demand,
            supply: stockout.supply,
            gap: stockout.gap,
            eoh: stockout.eoh
          });
        }
        product.months.forEach((month) => {
          if (month.isFirstBatch) {
            const type = month.fbStatus === "risk" ? "1st Batch Risk" : month.fbStatus === "watch" ? "1st Batch Watch" : "1st Batch OK";
            rows.push({
              type,
              priority: month.fbStatus === "risk" ? 2 : 4,
              model: product.model,
              name: product.name,
              lifecycle: product.lifecycle,
              month: month.key,
              issue: month.fbStatus === "ok" ? "首批正常" : "供需差 " + signed(month.gap),
              detail: month.fbStatus === "ok" ? "首批供需正常" : "检查首批供需",
              demand: month.demand,
              supply: month.supply,
              gap: month.gap,
              eoh: month.eoh
            });
          }
        });
        const negativeMonths = product.months.filter((month) => month.gap < 0);
        if (negativeMonths.length >= 2) {
          const worstMonth = negativeMonths.reduce((worst, month) => month.gap < worst.gap ? month : worst, negativeMonths[0]);
          rows.push({
            type: "Gap",
            priority: 3,
            model: product.model,
            name: product.name,
            lifecycle: product.lifecycle,
            month: worstMonth.key,
            issue: "供需差 " + signed(worstMonth.gap),
            detail: `${MONTHS.length}个月中有${negativeMonths.length}个月供应低于需求`,
            demand: worstMonth.demand,
            supply: worstMonth.supply,
            gap: worstMonth.gap,
            eoh: worstMonth.eoh
          });
        }
      });
      return rows.sort((a, b) => a.priority - b.priority || a.model.localeCompare(b.model));
    }

    function render() {
      const products = filteredProducts();
      document.getElementById("periodBadge").textContent = state.periodLabel + " · 3个月视图";
      renderToolbar();
      renderKpis(products);
      renderMain(products);
      renderModal();
    }

    function renderApp() {
      const salesModule = document.getElementById("salesModule");
      const projectModule = document.getElementById("projectModule");
      const isSales = activeModule === "sales";
      syncSalesAccessFromToolUser();
      renderToolAccessControls();
      salesModule.hidden = !isSales;
      projectModule.hidden = isSales;
      document.querySelectorAll("[data-module]").forEach((button) => {
        const active = button.getAttribute("data-module") === activeModule;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      const alertCount = projectExceptionRows(projectState.projects.filter((project) => projectMatchesPortfolioScope(project, "current"))).filter((item) => item.health === "red").length;
      document.getElementById("projectAlertCount").textContent = String(alertCount);
      if (isSales) {
        render();
        renderProjectDrawer(null);
      } else {
        state.modal = null;
        renderModal();
        renderProjectModule();
      }
    }

    function healthRank(health) {
      return { red: 0, amber: 1, green: 2, grey: 3 }[health] ?? 4;
    }

    function projectFirstBatchData(project, includeHistorical = false) {
      const product = state.products.find((item) => item.model === project.model);
      if (!product || product.lifecycle !== "New") return includeHistorical && project.firstBatchSnapshot ? { ...project.firstBatchSnapshot, historical: true } : null;
      const enriched = enrichedProduct(product);
      let month = enriched.months.find((item) => item.isFirstBatch);
      let planned = true;
      if (!month) {
        month = enriched.months.find((item) => item.demand > 0);
        planned = false;
      }
      if (!month) return null;
      const status = planned ? month.fbStatus : "risk";
      return {
        month: month.key,
        monthLabel: planned ? monthLabel(month.key) : "未排产",
        monthShort: planned ? `${Number(month.key.slice(5))}月` : "未排产",
        demand: month.demand,
        supply: month.supply,
        gap: month.gap,
        eoh: month.eoh,
        status,
        health: status === "risk" ? "red" : status === "watch" ? "amber" : "green",
        planned,
        source: "Sales & Inventory"
      };
    }

    function projectWorkstreamView(project, workstreamKey) {
      const stream = project.workstreams[workstreamKey];
      if (!stream || workstreamKey !== "supply") return stream;
      const firstBatch = projectFirstBatchData(project);
      if (!firstBatch) return stream;
      const effectiveHealth = healthRank(firstBatch.health) < healthRank(stream.health) ? firstBatch.health : stream.health;
      const firstBatchIssue = firstBatch.health === "green"
        ? ""
        : `首批${firstBatch.monthShort}：预测${compact(firstBatch.demand)}，供应${compact(firstBatch.supply)}，供需差 ${signed(firstBatch.gap)}`;
      return {
        ...stream,
        health: effectiveHealth,
        blocker: [firstBatchIssue, projectText(stream.blocker)].filter(Boolean).join("；"),
        firstBatch
      };
    }

    function projectMetrics(project) {
      const streams = PROJECT_WORKSTREAMS.map((meta) => projectWorkstreamView(project, meta.key)).filter((item) => item && item.health !== "grey");
      const done = streams.reduce((sum, item) => sum + item.done, 0);
      const total = streams.reduce((sum, item) => sum + item.total, 0);
      const health = streams.reduce((worst, item) => healthRank(item.health) < healthRank(worst) ? item.health : worst, "green");
      const readiness = total ? Math.round((done / total) * 100) : 0;
      return { health, readiness, done, total };
    }

    function filteredProjects() {
      const search = projectState.filters.search.trim().toLowerCase();
      return projectState.projects.filter((project) => {
        const metrics = projectMetrics(project);
        if (!projectMatchesPortfolioScope(project)) return false;
        if (search && !`${project.model} ${project.name} ${project.category}`.toLowerCase().includes(search)) return false;
        if (projectState.filters.health !== "All" && metrics.health !== projectState.filters.health.toLowerCase()) return false;
        if (projectState.filters.stage !== "All" && project.stage !== projectState.filters.stage) return false;
        if (projectState.filters.owner !== "All" && project.owner !== projectState.filters.owner) return false;
        if (projectState.filters.onlyCritical && !Object.values(project.workstreams).some((item) => item.health === "red")) return false;
        return true;
      });
    }

    function projectExceptionRows(projects) {
      return projects.flatMap((project) => PROJECT_WORKSTREAMS.flatMap((meta) => {
        const stream = projectWorkstreamView(project, meta.key);
        if (!stream || !stream.blocker || !["red", "amber"].includes(stream.health)) return [];
        return [{
          projectId: project.id,
          model: project.model,
          projectName: project.name,
          workstream: meta.key,
          workstreamLabel: meta.label,
          health: stream.health,
          issue: stream.blocker,
          owner: stream.owner,
          due: stream.due,
          dueISO: stream.dueISO
        }];
      })).sort((a, b) => healthRank(a.health) - healthRank(b.health) || a.dueISO.localeCompare(b.dueISO));
    }

    function projectKpiData(projects) {
      const metrics = projects.map((project) => projectMetrics(project));
      const blockedTasks = projects.flatMap((project) => Object.values(project.workstreams).flatMap((item) => item.tasks)).filter((task) => task.status === "Blocked").length;
      const dueStart = new Date("2026-08-04T00:00:00Z");
      const dueEnd = new Date("2026-08-18T23:59:59Z");
      const dueNext14 = projects.flatMap((project) => Object.values(project.workstreams)).filter((item) => {
        const due = new Date(item.dueISO + "T00:00:00Z");
        return item.done < item.total && due >= dueStart && due <= dueEnd;
      }).length;
      const readiness = metrics.length ? Math.round(metrics.reduce((sum, item) => sum + item.readiness, 0) / metrics.length) : 0;
      return {
        active: projects.length,
        launchRisk: metrics.filter((item) => item.health === "red").length,
        blockedTasks,
        dueNext14,
        readiness
      };
    }

    function renderProjectModule() {
      const projects = filteredProjects();
      const exceptions = projectExceptionRows(projects);
      const owners = ["All", ...Array.from(new Set(projectState.projects.map((project) => project.owner)))];
      const stages = ["All", ...PROJECT_GATES];
      const currentCount = projectState.projects.filter((project) => projectMatchesPortfolioScope(project, "current")).length;
      document.getElementById("projectModule").innerHTML = `
        <header class="topbar">
          <div class="brand">

          ${renderProjectScopeSwitch()}
          <div class="control" style="min-width:210px">
            <label for="projectSearch">项目 / 型号</label>
            <input class="project-search" id="projectSearch" data-project-filter="search" value="${projectState.filters.search}" placeholder="搜索项目">
          </div>
          ${renderProjectSelect("health", "健康状态", ["All", "Red", "Amber", "Green"], projectState.filters.health)}

          <button class="toggle ${projectState.filters.onlyCritical ? "active" : ""}" data-project-action="toggle-critical" aria-pressed="${projectState.filters.onlyCritical}">
            <span class="switch"></span><span>仅看重大风险</span>

              <button class="${projectState.view === "matrix" ? "active" : ""}" data-project-view="matrix">矩阵</button>

        <main class="project-content-grid">

        </main>
      `;

    function renderProjectScopeSwitch() {
      const items = [
        ["current", "当前跟进"],

    function renderProjectSelect(name, label, options, value) {
      return `

    function renderProjectKpis(projects) {

        { label: "未来14天到期", value: kpi.dueNext14, foot: "尚未完成的交付项" },

      return `<section class="kpis" aria-label="项目组合摘要">${cards.map((card) => `
        <article class="kpi">
          <div class="kpi-label">${card.label}</div>
          <div class="kpi-value ${card.risk ? "number-negative" : ""}">${card.value}</div>
          <div class="kpi-foot">${card.foot}</div>
        </article>
      `).join("")}</section>`;
    }

    function renderProjectExceptionBoard(rows) {
      return `
        <aside class="panel project-exception-panel">
          <div class="panel-head">
            <h2 class="panel-title">异常事项 <span class="count-badge">${rows.length}</span></h2>
            <span class="exception-summary">负责人和截止时间</span>

          <div class="chips">
            <span class="chip danger">阻塞 (${rows.filter((row) => row.health === "red").length})</span>

          </div>
        </aside>

    function renderProjectMatrix(projects) {

                  <th class="project-col">项目</th>
                  <th class="launch-col">上市日期</th>

                  ${PROJECT_WORKSTREAMS.map((item) => `<th class="workstream-col ${item.key === "supply" ? "supply-col" : ""}" title="${item.label}">${item.short}</th>`).join("")}
                  <th class="milestone-col">下一里程碑</th>

            <span><span class="legend-dot" style="background:var(--green)"></span>按计划推进</span>
            <span><span class="legend-dot" style="background:var(--soft)"></span>未启用 / 不适用</span>
          </div>
        </section>
      `;
    }

    function renderProjectRow(project) {
      const metrics = projectMetrics(project);
      const lifecycle = projectLifecycleMeta(project);
      const stageProgress = Math.round(((project.gateIndex + 1) / PROJECT_GATES.length) * 100);
      return `
        <tr>
          <td class="project-col">
            <button class="project-link" data-project-action="open-project" data-project-id="${project.id}">
              <span class="sku-main">${project.model} · ${project.name}</span>

            </button>

              <span class="readiness-value">准备度 ${metrics.readiness}%</span>
            </div>
          </td>
          ${PROJECT_WORKSTREAMS.map((meta) => renderWorkstreamCell(project, meta)).join("")}
          <td>
            <button class="project-link" data-project-action="open-project" data-project-id="${project.id}">

            </button>
          </td>
        </tr>
      `;
    }

    function renderWorkstreamCell(project, meta) {
      const stream = projectWorkstreamView(project, meta.key);
      const alertCount = stream.tasks.filter((task) => task.status === "Blocked").length;
      return `<td>
        <button class="ws-cell ${stream.health}${stream.firstBatch ? " has-first-batch" : ""}" data-project-action="open-workstream" data-project-id="${project.id}" data-workstream="${meta.key}" aria-label="${project.model} ${meta.label}：${projectHealthLabel(stream.health)}，完成${stream.done}/${stream.total}${stream.firstBatch ? `，首批预测${stream.firstBatch.demand}，供应${stream.firstBatch.supply}` : ""}">
          <span class="ws-main"><span class="ws-count">${stream.done}/${stream.total}</span></span>
          <span class="ws-meta"><span title="${stream.baselineDueISO && stream.baselineDueISO !== stream.dueISO ? `原计划 ${projectISODateLabel(stream.baselineDueISO)}` : ""}">${projectDateLabel(stream.due)}${stream.baselineDueISO && stream.baselineDueISO !== stream.dueISO ? "*" : ""}</span>${alertCount ? `<span class="ws-alert">! ${alertCount}</span>` : ""}</span>
          ${stream.firstBatch ? `<span class="ws-first-batch"><span>首批 ${stream.firstBatch.monthShort}</span><span>预${compact(stream.firstBatch.demand)} / 供${compact(stream.firstBatch.supply)}</span></span>` : ""}
        </button>
      </td>`;
    }

    function renderProjectMilestones(projects) {
      return `
        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">项目阶段与里程碑</h2>
            <span class="chart-note">预测日期及当前阶段</span>
          </div>
          <div class="milestone-wrap">
            <table class="milestone-table">
              <thead><tr><th class="project-col">项目</th>${PROJECT_GATES.map((gate) => `<th>${projectStageLabel(gate)}</th>`).join("")}</tr></thead>
              <tbody>
                ${projects.length ? projects.map((project) => `
                  <tr>
                    <td class="project-col"><button class="project-link" data-project-action="open-project" data-project-id="${project.id}"><span class="sku-main">${project.model}</span><span class="project-owner">${project.name}</span></button></td>
                    ${project.gates.map((gate, index) => `<td><div class="gate-cell ${gate.state}${gate.revisionCount ? " revised" : ""}"><strong>${projectDateLabel(gate.date)}</strong>${gate.baselineDueISO && gate.baselineDueISO !== gate.dueISO ? `<span class="gate-original-date">原 ${projectISODateLabel(gate.baselineDueISO)}</span>` : ""}<span class="gate-status">${gate.state === "current" ? "当前" : gate.state === "done" ? "已完成" : gate.state === "delayed" ? "延期" : "计划"}${gate.revisionCount ? " · 已修订" : ""}</span></div></td>`).join("")}
                  </tr>
                `).join("") : `<tr><td colspan="7" class="exception-empty">没有符合筛选条件的项目。</td></tr>`}
              </tbody>
            </table>
          </div>
          <div class="legend">
            <span><span class="legend-dot" style="background:var(--green)"></span>已完成</span>
            <span><span class="legend-dot" style="background:var(--blue)"></span>当前阶段</span>
            <span><span class="legend-dot" style="background:var(--red)"></span>预测延期</span>
          </div>
        </section>
      `;
    }

    function renderProjectDrawer(projectId) {
      const root = document.getElementById("projectDrawerRoot");
      const project = projectState.projects.find((item) => item.id === projectId);
      if (!project) {
        root.className = "drawer-backdrop";
        root.setAttribute("aria-hidden", "true");
        root.innerHTML = "";
        return;
      }
      const metrics = projectMetrics(project);
      const lifecycle = projectLifecycleMeta(project);
      const readOnly = projectIsReadOnly(project);
      const selectedMeta = PROJECT_WORKSTREAMS.find((item) => item.key === projectState.selectedWorkstream);
      const selectedStream = selectedMeta ? projectWorkstreamView(project, selectedMeta.key) : null;
      root.className = "drawer-backdrop active";
      root.setAttribute("aria-hidden", "false");
      root.innerHTML = `
        <aside class="project-drawer" role="dialog" aria-modal="true" aria-labelledby="projectDrawerTitle">
          <div class="drawer-head">
            <div>
              <h2 class="drawer-title" id="projectDrawerTitle">${project.model} · ${selectedMeta ? selectedMeta.label : project.name}</h2>
              <div class="drawer-subtitle">${project.name} · ${projectStageLabel(project.stage)} · 负责人 ${project.owner} <span class="project-lifecycle-badge ${lifecycle.tone}">${lifecycle.label}</span></div>
            </div>
            <button class="icon-btn" data-project-action="close-drawer" aria-label="关闭">×</button>
          </div>
          <div class="drawer-body">
            <div class="drawer-summary">
              <div class="drawer-stat"><div class="drawer-stat-label">健康状态</div><div class="drawer-stat-value"><span class="health-dot ${selectedStream?.health || metrics.health}"></span> ${projectHealthLabel(selectedStream?.health || metrics.health)}</div></div>
              <div class="drawer-stat"><div class="drawer-stat-label">准备度</div><div class="drawer-stat-value">${selectedStream ? `${selectedStream.done}/${selectedStream.total}` : `${metrics.readiness}%`}</div></div>
              <div class="drawer-stat"><div class="drawer-stat-label">最近截止</div><div class="drawer-stat-value">${projectDateLabel(selectedStream?.due || project.nextDate)}</div></div>
              <div class="drawer-stat"><div class="drawer-stat-label">负责人</div><div class="drawer-stat-value">${selectedStream?.owner || project.owner}</div></div>
            </div>

            ${selectedMeta?.key === "supply" ? renderFirstBatchSyncStrip(project) : ""}

            <div class="chips">
              <button class="chip ${!projectState.selectedWorkstream ? "active" : ""}" data-project-action="select-workstream" data-project-id="${project.id}" data-workstream="">全部</button>
              ${PROJECT_WORKSTREAMS.map((meta) => `<button class="chip" data-project-action="select-workstream" data-project-id="${project.id}" data-workstream="${meta.key}"><span class="health-dot ${projectWorkstreamView(project, meta.key).health}"></span> ${meta.short}</button>`).join("")}
            </div>

            <div class="tabs">
              ${["overview", "tasks", "dependencies", "delays", "history"].map((tab) => `<button class="tab ${projectState.drawerTab === tab ? "active" : ""}" data-project-action="drawer-tab" data-tab="${tab}">${{ overview: "概览", tasks: "任务", dependencies: "依赖", delays: `延期${project.delayRecords?.length ? ` (${project.delayRecords.length})` : ""}`, history: "历史" }[tab]}</button>`).join("")}
            </div>
            ${renderProjectDrawerBody(project, selectedMeta)}
          </div>
          <div class="drawer-foot">
            <span class="helper-note">${readOnly ? "历史项目只读保留，可从项目台账恢复跟进。" : "状态和部门更新均保留操作记录；已接入模块可查看来源数据。"}</span>
            <div class="drawer-actions">
              ${selectedStream ? renderProjectSourceControl(project, selectedStream, selectedMeta.key) : ""}
              ${selectedStream && canEditProjectWorkstream(selectedMeta.key, project.id) ? `<button class="btn danger" data-project-action="register-delay" data-project-id="${project.id}" data-workstream="${selectedMeta.key}">登记延期</button><button class="btn primary" data-project-action="edit-workstream" data-project-id="${project.id}" data-workstream="${selectedMeta.key}">编辑更新</button>` : ""}
              ${canManageProjectLifecycle() ? `<button class="btn ${readOnly ? "primary" : ""}" data-project-action="manage-project-status" data-project-id="${project.id}">${readOnly ? "恢复跟进" : "状态管理"}</button>` : ""}
              <button class="btn" data-project-action="close-drawer">关闭</button>
            </div>
          </div>
        </aside>
      `;
    }

    function renderProjectDrawerBody(project, selectedMeta) {
      if (projectState.drawerTab === "tasks") return renderProjectTasks(project, selectedMeta);
      if (projectState.drawerTab === "dependencies") return renderProjectDependencies(project);
      if (projectState.drawerTab === "delays") return renderProjectDelays(project);
      if (projectState.drawerTab === "history") return renderProjectHistory(project);
      const streams = selectedMeta ? [selectedMeta] : PROJECT_WORKSTREAMS;
      const blockers = streams.flatMap((meta) => {
        const stream = projectWorkstreamView(project, meta.key);
        return stream.blocker ? [{ label: meta.label, ...stream }] : [];
      });
      return `
        <section class="drawer-section">
          <h3 class="drawer-section-title">当前异常</h3>
          <div class="dependency-list">
            ${blockers.length ? blockers.map((item) => `
              <div class="dependency-row">
                <span class="health-label"><span class="health-dot ${item.health}"></span>${item.label}</span>
                <span class="dependency-copy">${projectText(item.blocker)}</span>
                <strong>${projectDateLabel(item.due)}</strong>
              </div>
            `).join("") : `<div class="exception-empty">没有未关闭的异常。</div>`}
          </div>
        </section>
        <section class="drawer-section">
          <h3 class="drawer-section-title">工作流准备度</h3>
          <table class="drawer-table">
            <thead><tr><th>工作流</th><th>状态</th><th>完成情况</th><th>最近截止</th><th>负责人</th></tr></thead>
            <tbody>${streams.map((meta) => {
              const stream = projectWorkstreamView(project, meta.key);
              return `<tr><td>${meta.label}</td><td><span class="task-status"><span class="health-dot ${stream.health}"></span>${projectHealthLabel(stream.health)}</span></td><td>${stream.done}/${stream.total}</td><td>${projectDateLabel(stream.due)}</td><td>${stream.owner}</td></tr>`;
            }).join("")}</tbody>
          </table>
        </section>
      `;
    }

    function renderProjectTasks(project, selectedMeta) {
      const metas = selectedMeta ? [selectedMeta] : PROJECT_WORKSTREAMS;
      const rows = metas.flatMap((meta) => project.workstreams[meta.key].tasks.map((task) => ({ ...task, workstream: meta.label })));
      return `
        <section class="drawer-section">
          <h3 class="drawer-section-title">${selectedMeta ? selectedMeta.label : "跨职能"}任务</h3>
          <table class="drawer-table">
            <thead><tr><th>任务</th><th>工作流</th><th>状态</th><th>负责人</th><th>截止时间</th></tr></thead>
            <tbody>${rows.map((task) => `<tr><td><strong>${projectText(task.name)}</strong>${task.critical ? `<div class="ws-alert">关键任务</div>` : ""}</td><td>${task.workstream}</td><td><span class="task-status"><span class="health-dot ${task.status === "Blocked" ? "red" : task.status === "Completed" ? "green" : "amber"}"></span>${projectStatusLabel(task.status)}</span></td><td>${task.owner}</td><td>${projectDateLabel(task.due)}</td></tr>`).join("")}</tbody>
          </table>
        </section>
      `;
    }

    function renderProjectDependencies(project) {
      return `
        <section class="drawer-section">
          <h3 class="drawer-section-title">依赖关系</h3>
          <div class="dependency-list">
            ${project.dependencies.length ? project.dependencies.map((item) => `
              <div class="dependency-row">
                <span class="dependency-source">${projectText(item.source)} → ${projectText(item.target)}</span>
                <span class="dependency-copy">${projectText(item.detail)}</span>
                <span class="task-status"><span class="health-dot ${item.status === "Blocked" ? "red" : "amber"}"></span>${projectStatusLabel(item.status)}</span>
              </div>
            `).join("") : `<div class="exception-empty">没有有效依赖关系。</div>`}
          </div>
        </section>
      `;
    }

    function renderProjectHistory(project) {
      const statusRecords = project.statusHistory || [];
      return `
        ${statusRecords.length ? `<section class="drawer-section"><h3 class="drawer-section-title">项目状态记录</h3><div class="activity-list">${statusRecords.map((item) => `<div class="activity-row"><strong>${projectISODateLabel(item.effectiveDate)}</strong><span class="dependency-copy"><span class="project-lifecycle-badge ${projectLifecycleMeta(item.toStatus).tone}">${projectLifecycleMeta(item.toStatus).label}</span> ${escapeProjectHtml(item.reason)}</span><span class="task-status">${escapeProjectHtml(item.createdBy)} · ${escapeProjectHtml(item.responsibleOwner)}</span></div>`).join("")}</div></section>` : ""}
        <section class="drawer-section">
          <h3 class="drawer-section-title">最近动态</h3>
          <div class="activity-list">
            ${project.history.map((item) => `<div class="activity-row"><strong>${projectTimeLabel(item.time)}</strong><span class="dependency-copy">${projectText(item.detail)}</span><span class="task-status">${projectText(item.source)}</span></div>`).join("")}
          </div>
        </section>
      `;
    }

    function renderProjectDelays(project) {
      const records = project.delayRecords || [];
      const baselineLaunchDate = project.originalLaunchDate || records[records.length - 1]?.oldLaunchDate || project.launchDate;
      const cumulativeDelayDays = Math.max(0, projectDelayDays(baselineLaunchDate, project.launchDate));
      return `
        <section class="drawer-section">
          <h3 class="drawer-section-title">时间线修订记录</h3>
          ${records.length ? `<div class="delay-impact-summary drawer-delay-summary">
            <div class="delay-impact-item"><div class="delay-impact-label">当前版本</div><div class="delay-impact-value">V${project.timelineVersion || records[0].version}</div></div>
            <div class="delay-impact-item"><div class="delay-impact-label">累计延期</div><div class="delay-impact-value number-negative">+${cumulativeDelayDays}天</div></div>
            <div class="delay-impact-item"><div class="delay-impact-label">上市日期</div><div class="delay-impact-value">${projectISODateLabel(baselineLaunchDate)} → ${projectISODateLabel(project.launchDate)}</div></div>
            <div class="delay-impact-item"><div class="delay-impact-label">延期记录</div><div class="delay-impact-value">${records.length}次</div></div>
          </div>` : ""}
          <div class="delay-record-list">
            ${records.length ? records.map((record) => {
              const changes = record.changes || [];
              return `
                <article class="delay-record">
                  <div class="delay-record-head">
                    <span class="health-label"><span class="health-dot red"></span>V${record.version} · ${projectWorkstreamLabel(record.sourceWorkstream)} ${record.isDemo ? `<span class="role-badge">示例</span>` : ""}</span>
                    <span class="exception-month">${record.createdLabel}</span>
                  </div>
                  <div class="delay-record-body">
                    <div class="delay-reason">${escapeProjectHtml(record.reason)}</div>
                    <div class="delay-meta"><span>根因：${delayCategoryLabel(record.category)}</span><span>责任人：${escapeProjectHtml(record.responsibleOwner)}</span><span>顺延方式：${delayPropagationLabel(record.propagation)}</span><span>延期：+${record.delayDays}天</span></div>
                    ${record.mitigation ? `<div class="dependency-copy"><strong>缓解措施：</strong>${escapeProjectHtml(record.mitigation)}</div>` : ""}
                    ${record.impactNote ? `<div class="dependency-copy"><strong>影响说明：</strong>${escapeProjectHtml(record.impactNote)}</div>` : ""}
                    <details class="delay-changes"><summary>查看全部 ${changes.length} 项日期变化</summary><div class="timeline-change-list">${changes.map(renderDelayPreviewChange).join("")}</div></details>
                    <div class="delay-meta"><span>上市日期：${projectISODateLabel(record.oldLaunchDate)} → ${projectISODateLabel(record.newLaunchDate)}</span><span>登记人：${record.createdBy}</span></div>
                  </div>
                </article>
              `;
            }).join("") : `<div class="exception-empty">暂无延期和时间线修订记录。</div>`}
          </div>
        </section>
      `;
    }

    function renderFirstBatchSyncStrip(project) {
      const firstBatch = projectFirstBatchData(project, true);
      if (!firstBatch) return "";
      return `
        <section class="first-batch-sync" aria-label="产销首批同步数据">
          <div class="first-batch-sync-item"><div class="first-batch-sync-label">首批月份</div><div class="first-batch-sync-value">${firstBatch.monthShort}</div></div>
          <div class="first-batch-sync-item"><div class="first-batch-sync-label">销售预测</div><div class="first-batch-sync-value">${formatNumber(firstBatch.demand)}</div></div>
          <div class="first-batch-sync-item"><div class="first-batch-sync-label">供应计划</div><div class="first-batch-sync-value">${formatNumber(firstBatch.supply)}</div></div>
          <div class="first-batch-sync-item"><div class="first-batch-sync-label">供需差</div><div class="first-batch-sync-value ${firstBatch.gap < 0 ? "number-negative" : "number-positive"}">${signed(firstBatch.gap)}</div></div>
          <div class="first-batch-sync-item"><div class="first-batch-sync-label">EOH</div><div class="first-batch-sync-value ${firstBatch.eoh < 0 ? "number-negative" : ""}">${formatNumber(firstBatch.eoh)}</div></div>
          <div class="first-batch-sync-source">数据来源：产销管理 · ${firstBatch.historical ? "上市时首批快照" : "只读同步"} · ${firstBatch.historical ? "历史数据不参与当前健康状态计算" : "供应计划请在产销模块更新"}</div>
        </section>
      `;
    }

    function renderProjectAdminModal() {
      const root = document.getElementById("projectEditorRoot");
      if (!projectState.adminModal) {
        root.className = "modal-backdrop project-editor-backdrop";
        root.setAttribute("aria-hidden", "true");
        root.innerHTML = "";
        return;
      }
      root.className = "modal-backdrop project-editor-backdrop active";
      root.setAttribute("aria-hidden", "false");
      root.innerHTML = projectState.adminModal === "permissions"
        ? renderProjectPermissionModal()
        : projectState.adminModal === "project-ledger"
          ? renderProjectLedgerModal()
          : projectState.adminModal === "project-transition"
            ? renderProjectTransitionModal()
        : projectState.adminModal === "add-project"
          ? renderAddProjectModal()
          : projectState.adminModal === "delay"
            ? renderProjectDelayModal()
            : renderProjectWorkstreamEditor();
    }

    function renderProjectLedgerModal() {
      const statusOrder = { active: 0, paused: 1, closeout: 2, archived: 3, cancelled: 4 };
      const projects = [...projectState.projects].sort((a, b) => statusOrder[projectLifecycleStatus(a)] - statusOrder[projectLifecycleStatus(b)] || a.launchDate.localeCompare(b.launchDate));
      const counts = Object.fromEntries(Object.keys(PROJECT_LIFECYCLE).map((status) => [status, projects.filter((project) => projectLifecycleStatus(project) === status).length]));
      return `
        <section class="modal project-editor-modal project-ledger-modal" role="dialog" aria-modal="true" aria-labelledby="projectLedgerTitle">
          <div class="modal-head">
            <div>
              <h2 class="modal-title" id="projectLedgerTitle">项目台账</h2>
              <p class="modal-subtitle">统一管理项目进入、退出、上市收尾和恢复；历史项目只读保留</p>
            </div>
            <button class="icon-btn" data-project-editor-action="close" aria-label="关闭">×</button>
          </div>
          <div class="modal-body">
            <div class="ledger-summary" aria-label="项目状态摘要">
              ${[["active", "进行中"], ["paused", "暂停"], ["closeout", "上市待收尾"], ["archived", "已归档"], ["cancelled", "已取消"]].map(([status, label]) => `<div class="ledger-summary-item"><span>${label}</span><strong class="${status === "cancelled" ? "number-negative" : ""}">${counts[status] || 0}</strong></div>`).join("")}
            </div>
            <div class="ledger-guidance">
              <span><strong>默认矩阵：</strong>进行中、暂停和上市待收尾</span>
              <span><strong>历史保留：</strong>归档和取消项目不再占用默认矩阵</span>
              <span><strong>删除规则：</strong>已创建项目不硬删除，所有退出和恢复均留痕</span>
            </div>
            <div class="project-ledger-table-wrap">
              <table class="project-ledger-table">
                <thead><tr><th>项目</th><th>状态</th><th>上市时间</th><th>负责人</th><th>收尾情况</th><th>最近状态变更</th><th>操作</th></tr></thead>
                <tbody>${projects.map((project) => {
                  const lifecycle = projectLifecycleMeta(project);
                  const progress = projectCloseoutProgress(project);
                  const latest = project.statusHistory?.[0];
                  return `<tr>
                    <td><button class="project-link" data-project-editor-action="open-ledger-project" data-project-id="${project.id}"><span class="sku-main">${project.model} · ${project.name}</span><span class="project-owner">${project.id} · ${projectText(project.category)}</span></button></td>
                    <td><span class="project-lifecycle-badge ${lifecycle.tone}">${lifecycle.label}</span><div class="ledger-scope-note">${projectMatchesPortfolioScope(project, "history") ? "历史项目" : "默认矩阵可见"}</div></td>
                    <td><strong>${project.actualLaunchDate || project.launchDate}</strong>${project.actualLaunchDate ? `<div class="ledger-scope-note">原计划 ${project.launchDate}</div>` : `<div class="ledger-scope-note">计划日期</div>`}</td>
                    <td>${escapeProjectHtml(project.owner)}</td>
                    <td><span class="${progress.ready ? "number-positive" : progress.blockers ? "number-negative" : ""}">${progress.ready ? "已完成" : `剩余 ${progress.remaining} 项`}</span>${progress.blockers ? `<div class="ledger-scope-note number-negative">${progress.blockers} 项阻塞</div>` : ""}</td>
                    <td>${latest ? `<strong>${projectISODateLabel(latest.effectiveDate)}</strong><div class="ledger-scope-note">${escapeProjectHtml(latest.createdBy)} · ${escapeProjectHtml(latest.reason)}</div>` : `<span class="ledger-scope-note">暂无状态变更</span>`}</td>
                    <td><div class="ledger-actions"><button class="btn" data-project-editor-action="open-ledger-project" data-project-id="${project.id}">查看</button>${canManageProjectLifecycle() ? `<button class="btn ${projectIsReadOnly(project) ? "primary" : ""}" data-project-editor-action="manage-project-status" data-project-id="${project.id}">${projectIsReadOnly(project) ? "恢复" : "管理状态"}</button>` : ""}</div></td>
                  </tr>`;
                }).join("")}</tbody>
              </table>
            </div>
          </div>
          <div class="modal-foot">
            <span class="helper-note">项目台账统计全部项目，不受主页面筛选条件影响。</span>
            <button class="btn" data-project-editor-action="close">关闭</button>
          </div>
        </section>
      `;
    }

    function renderProjectTransitionModal() {
      const draft = projectState.transitionDraft;
      const project = projectState.projects.find((item) => item.id === draft?.projectId);
      if (!draft || !project) return "";
      const targets = projectAllowedTransitions(project);
      const fromMeta = projectLifecycleMeta(draft.fromStatus);
      const targetMeta = projectLifecycleMeta(draft.targetStatus);
      const reasons = projectTransitionReasonOptions(draft.targetStatus);
      const closeout = projectCloseoutProgress(project);
      const requiresLaunchDate = ["closeout", "archived"].includes(draft.targetStatus);
      const movesToHistory = ["archived", "cancelled"].includes(draft.targetStatus);
      return `
        <section class="modal project-editor-modal project-transition-modal" role="dialog" aria-modal="true" aria-labelledby="projectTransitionTitle">
          <div class="modal-head">
            <div>
              <h2 class="modal-title" id="projectTransitionTitle">项目状态管理</h2>
              <p class="modal-subtitle">${project.model} · ${project.name}</p>
            </div>
            <button class="icon-btn" data-project-editor-action="close" aria-label="关闭">×</button>
          </div>
          <div class="modal-body">
            <div class="transition-path">

                <label class="template-option"><input type="radio" name="projectTemplate" data-new-project-field="template" value="market_extension" ${draft.template === "market_extension" ? "checked" : ""}><strong>市场扩展</strong><span>重点启用认证、供应、营销和销售，其他工作流默认不适用。</span></label>

    function renderProjectDelayModal() {
      const draft = projectState.delayDraft;
      const project = projectState.projects.find((item) => item.id === draft?.projectId);
      if (!draft || !project) return "";
      const preview = buildProjectDelayPreview(project, draft);
      const sourceMeta = PROJECT_WORKSTREAMS.find((item) => item.key === draft.sourceWorkstream);
      const firstBatch = projectFirstBatchData(project);
      const visibleChanges = preview.allChanges.slice(0, 14);
      return `
        <section class="modal project-editor-modal" role="dialog" aria-modal="true" aria-labelledby="delayEditorTitle">
          <div class="modal-head">
            <div>
              <h2 class="modal-title" id="delayEditorTitle">登记延期并更新时间线</h2>
              <p class="modal-subtitle">${project.model} · ${project.name} · 时间线版本 V${(project.timelineVersion || 1) + 1}</p>
            </div>
            <button class="icon-btn" data-project-editor-action="close" aria-label="关闭">×</button>
          </div>
          <div class="modal-body">
            <div class="admin-context-strip">
              <span>登记人：${currentProjectUser()?.name || "Ivy"} <span class="role-badge">${projectRoleLabel(currentProjectUser()?.role)}</span></span>
              <span>卡点来源：${sourceMeta?.label || "未指定"}</span>
            </div>

            <section class="editor-section">
              <div class="editor-section-head"><h3 class="editor-section-title">延期信息</h3><span class="permission-note">原因和责任信息将进入不可覆盖的修订历史</span></div>
              <div class="editor-form-grid">
                <div class="editor-field">
                  <label>卡点工作流</label>
                  <select data-delay-field="sourceWorkstream">${PROJECT_WORKSTREAMS.map((meta) => `<option value="${meta.key}" ${draft.sourceWorkstream === meta.key ? "selected" : ""}>${meta.label}</option>`).join("")}</select>
                </div>
                <div class="editor-field">
                  <label>根因分类</label>
                  <select data-delay-field="category">${["technical", "prototype", "quality", "compliance", "supply", "resource", "decision", "external", "other"].map((value) => `<option value="${value}" ${draft.category === value ? "selected" : ""}>${delayCategoryLabel(value)}</option>`).join("")}</select>
                </div>
                <div class="editor-field">
                  <label>责任人</label>
                  <input data-delay-field="responsibleOwner" value="${escapeProjectHtml(draft.responsibleOwner)}">
                </div>
                <div class="editor-field">
                  <label>顺延方式</label>
                  <select data-delay-field="propagation"><option value="all_downstream" ${draft.propagation === "all_downstream" ? "selected" : ""}>全链路顺延</option><option value="milestones_only" ${draft.propagation === "milestones_only" ? "selected" : ""}>仅顺延里程碑</option><option value="anchor_only" ${draft.propagation === "anchor_only" ? "selected" : ""}>仅调整当前节点</option></select>
                </div>
                <div class="editor-field">
                  <label>受影响里程碑</label>
                  <select data-delay-field="anchorGate">${PROJECT_GATES.map((gate, index) => ({ gate, index })).filter((item) => item.index >= project.gateIndex).map((item) => `<option value="${item.gate}" ${draft.anchorGate === item.gate ? "selected" : ""}>${projectStageLabel(item.gate)}</option>`).join("")}</select>
                </div>
                <div class="editor-field">
                  <label>当前预测日期</label>
                  <input value="${preview.oldAnchorDate}" disabled>
                </div>
                <div class="editor-field">
                  <label>新预测日期</label>
                  <input type="date" data-delay-field="newDate" value="${draft.newDate}">
                </div>
                <div class="editor-field">
                  <label>延期天数</label>
                  <input value="${preview.delayDays > 0 ? `+${preview.delayDays} 天` : `${preview.delayDays} 天`}" disabled>
                </div>
                <div class="editor-field span-2">
                  <label>延期原因</label>
                  <textarea data-delay-field="reason" placeholder="说明卡点事实、发生时间和直接原因">${escapeProjectHtml(draft.reason)}</textarea>
                </div>
                <div class="editor-field span-2">
                  <label>缓解措施与下一步</label>
                  <textarea data-delay-field="mitigation" placeholder="说明负责人、措施和预计关闭时间">${escapeProjectHtml(draft.mitigation)}</textarea>
                </div>
                <div class="editor-field span-2">
                  <label>影响说明</label>
                  <textarea data-delay-field="impactNote" placeholder="补充对供应、营销、销售或市场上市的影响">${escapeProjectHtml(draft.impactNote)}</textarea>
                </div>
              </div>
            </section>

            <section class="editor-section">
              <div class="editor-section-head"><h3 class="editor-section-title">时间线变化预览</h3><span class="permission-note">${delayPropagationLabel(draft.propagation)}</span></div>
              <div class="delay-impact-summary">
                <div class="delay-impact-item"><div class="delay-impact-label">延期天数</div><div class="delay-impact-value number-negative">+${Math.max(0, preview.delayDays)}天</div></div>
                <div class="delay-impact-item"><div class="delay-impact-label">里程碑变化</div><div class="delay-impact-value">${preview.gateChanges.length}</div></div>
                <div class="delay-impact-item"><div class="delay-impact-label">工作流 / 任务变化</div><div class="delay-impact-value">${preview.workstreamChanges.length} / ${preview.taskChanges.length}</div></div>
                <div class="delay-impact-item"><div class="delay-impact-label">上市日期</div><div class="delay-impact-value">${projectISODateLabel(preview.oldLaunchDate)} → ${projectISODateLabel(preview.newLaunchDate)}</div></div>
              </div>
              ${preview.delayDays <= 0 ? `<div class="delay-warning">新预测日期必须晚于当前预测日期。</div>` : ""}
              ${firstBatch ? `<div class="delay-warning">项目时间线更新不会自动改写产销首批销售预测或供应计划。发布后需在产销管理中复核 ${firstBatch.monthShort} 首批计划。</div>` : ""}
              <div class="timeline-change-list" style="margin-top:8px">
                ${visibleChanges.map(renderDelayPreviewChange).join("")}
                ${preview.allChanges.length > visibleChanges.length ? `<div class="timeline-change"><strong>其他变化</strong><span class="dependency-copy">另有 ${preview.allChanges.length - visibleChanges.length} 项任务日期将同步顺延</span><span></span></div>` : ""}
              </div>
            </section>
          </div>
          <div class="modal-foot">
            <span>${autosaveStatusMarkup("project-delay")} <span class="helper-note">发布后生成新版本，历史不会被覆盖。</span></span>
            <div style="display:flex;gap:7px"><button class="btn" data-project-editor-action="close">暂存并关闭</button><button class="btn primary" data-project-editor-action="apply-delay" ${preview.delayDays <= 0 ? "disabled" : ""}>发布延期与新时间线</button></div>
          </div>
        </section>
      `;
    }

    function renderDelayPreviewChange(change) {
      const typeLabel = change.entityType === "gate" ? "里程碑" : change.entityType === "workstream" ? "工作流" : "任务";
      return `<div class="timeline-change"><strong>${typeLabel} · ${change.label}</strong><span class="dependency-copy">${projectISODateLabel(change.oldDate)}</span><span class="timeline-arrow">→ ${projectISODateLabel(change.newDate)}</span></div>`;
    }

      const project = projectState.projects.find((item) => item.id === projectState.editorProjectId);
      const meta = PROJECT_WORKSTREAMS.find((item) => item.key === projectState.editorWorkstream);
      const draft = projectState.editorDraft;
      if (!project || !meta || !draft) return "";
      const stream = project.workstreams[meta.key];
      const hasSavedDraft = Boolean(projectState.drafts[projectDraftKey(project.id, meta.key)]);
      return `
        <section class="modal project-editor-modal" role="dialog" aria-modal="true" aria-labelledby="projectEditorTitle">
          <div class="modal-head">
            <div>
              <h2 class="modal-title" id="projectEditorTitle">部门更新 · ${meta.label}</h2>

                <select data-project-editor-context="projectId">
                  ${projectState.projects.filter((item) => !projectIsReadOnly(item)).map((item) => `<option value="${item.id}" ${item.id === project.id ? "selected" : ""}>${item.model} · ${item.name}</option>`).join("")}

              <div class="editor-field">

                <select data-project-editor-context="workstream">

                </select>
              </div>
              <div class="editor-field">
                <label>当前项目阶段</label>
                <input value="${projectStageLabel(project.stage)}" disabled>
              </div>
              <div class="editor-field">
                <label>上次更新时间</label>
                <input value="${projectText(project.updated)}" disabled>
              </div>

            ${meta.key === "supply" ? renderFirstBatchSyncStrip(project) : ""}

            <section class="editor-section">
              <div class="editor-section-head">
                <h3 class="editor-section-title">工作流汇总</h3>
                <span class="permission-note">发布后立即更新项目矩阵和异常看板</span>
              </div>
              <div class="editor-form-grid">
                <div class="editor-field">
                  <label>${meta.key === "supply" ? "部门准备状态" : "健康状态"}</label>
                  <select data-project-editor-field="health">
                    ${["green", "amber", "red", "grey"].map((health) => `<option value="${health}" ${draft.health === health ? "selected" : ""}>${projectHealthLabel(health)}</option>`).join("")}
                  </select>
                </div>
                <div class="editor-field">
                  <label>负责人</label>
                  <input data-project-editor-field="owner" value="${escapeProjectHtml(draft.owner)}">
                </div>
                <div class="editor-field">
                  <label>已完成任务</label>
                  <input type="number" min="0" data-project-editor-field="done" value="${draft.done}">

                <div class="editor-field">
                  <label>必需任务总数</label>
                  <input type="number" min="0" data-project-editor-field="total" value="${draft.total}">
                </div>
                <div class="editor-field">
                  <label>最近截止日期</label>
                  <input type="date" data-project-editor-field="dueISO" value="${draft.dueISO}">

                <div class="editor-field span-2">

                  <textarea data-project-editor-field="blocker" placeholder="无风险时可留空">${escapeProjectHtml(draft.blocker)}</textarea>

                  <textarea data-project-editor-field="nextAction" placeholder="填写下一步和完成时间">${escapeProjectHtml(draft.nextAction)}</textarea>
                </div>
              </div>
            </section>

            <section class="editor-section">
              <div class="editor-section-head">
                <h3 class="editor-section-title">重点任务</h3>
                <button class="btn" data-project-editor-action="add-task">+ 新增任务</button>

              <div style="overflow:auto">
